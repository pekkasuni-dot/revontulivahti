name: 'Ajastimen vahti (varajastus)'
description: >
  GitHubin oma cron-ajastus on varalla Cloudflare-ajastimen
  (workers/ajastin) rinnalla (2026-10-23). Tämä vahti ajetaan VAIN
  schedule-tapahtumassa: jos työnkulku on käynnistetty workflow_dispatchilla
  (ajastin tai käsin) mainilla viimeisen max-age-min minuutin aikana,
  varaajo ohitetaan (run=false) -> ei tuplia. Muuten run=true. API-virhe ->
  run=true (varaajo ennemmin kuin ei ajoa). Kutsuva job tarvitsee
  permissions: actions: read.

inputs:
  max-age-min:
    description: 'Varaajo ohitetaan, jos dispatch-ajo on tätä tuoreempi (min)'
    required: true

outputs:
  run:
    description: "'true' = aja, 'false' = ohita"
    value: ${{ steps.v.outputs.run }}

runs:
  using: 'composite'
  steps:
    - id: v
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        WF_REF: ${{ github.workflow_ref }}
        MAX_AGE: ${{ inputs.max-age-min }}
      run: |
        WF="${WF_REF%@*}"; WF="${WF##*/}"
        LAST=$(gh api "repos/$REPO/actions/workflows/$WF/runs?event=workflow_dispatch&branch=main&per_page=1" \
          --jq '.workflow_runs[0].created_at // ""' 2>/dev/null) || LAST=""
        if [ -n "$LAST" ]; then
          AGE=$(( ($(date -u +%s) - $(date -u -d "$LAST" +%s)) / 60 ))
          if [ "$AGE" -lt "$MAX_AGE" ]; then
            echo "::notice title=Varaajo ohitetaan::$WF käynnistettiin ajastimella $AGE min sitten (raja $MAX_AGE min)."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "::warning title=Ajastin myöhässä::$WF edellinen ajastimen ajo $AGE min sitten (raja $MAX_AGE min) - varaajo ajetaan. Tarkista Cloudflare-ajastin (OHJE-ajastin.md)."
        else
          echo "::warning title=Ajastimen ajoja ei löytynyt::$WF - varaajo ajetaan."
        fi
        echo "run=true" >> "$GITHUB_OUTPUT"
