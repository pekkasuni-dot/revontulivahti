name: Palautteen osoite (Cloudflare Worker)
description: >
  Asettaa PALAUTE_URL-ympäristömuuttujan: salaisuus PALAUTE_URL, tai Workerin
  auroraawesome-ajastin workers.dev-osoite Cloudflaren rajapinnasta
  (CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID). Ks. OHJE-ntfy.md.
inputs:
  url: {description: 'secrets.PALAUTE_URL', required: false, default: ''}
  cf-token: {description: 'secrets.CLOUDFLARE_API_TOKEN', required: false, default: ''}
  cf-account: {description: 'secrets.CLOUDFLARE_ACCOUNT_ID', required: false, default: ''}
runs:
  using: composite
  steps:
    - shell: bash
      env:
        U: ${{ inputs.url }}
        T: ${{ inputs.cf-token }}
        A: ${{ inputs.cf-account }}
      run: |
        if [ -z "$U" ] && [ -n "$T" ] && [ -n "$A" ]; then
          SUB=$(curl -sS -m 20 -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/accounts/$A/workers/subdomain" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s).result.subdomain||"")}catch(e){}})') || true
          [ -n "$SUB" ] && U="https://auroraawesome-ajastin.$SUB.workers.dev"
        fi
        if [ -n "$U" ]; then echo "PALAUTE_URL=$U" >> "$GITHUB_ENV"; echo "Palautteen osoite: $U/palaute"
        else echo "::notice title=Palautenapit puuttuvat::Workerin osoitetta ei saatu (OHJE-ntfy.md)."; fi
