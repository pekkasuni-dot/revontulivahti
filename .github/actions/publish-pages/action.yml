name: 'Julkaise GitHub Pagesille (tiivistetty, ei kasvavaa historiaa)'
description: >
  Kopioi main:n nykyisen sovelluskoodin (index.html, i18n.js, sw.js, manifest,
  icons) + annetun hakemiston data-tiedostot gh-pages-haaraan YHTENA
  orphan-committina (git checkout --orphan + force-push). gh-pages
  EI KOSKAAN kasva - jokainen julkaisu KORVAA edellisen commitin
  kokonaan, se ei jaa kerrostumaan historiaan. Kutsujan TAYTYY olla
  checkout'annut main:n ennen tata askelta (index.html ym. luetaan
  suoraan tyohakemistosta). Kutsujan job TARVITSEE
  "concurrency: {group: gh-pages-publish, cancel-in-progress: false}"
  - MUUTEN kaksi samanaikaista julkaisua voi ylikirjoittaa toisensa
  (force-push ei anna git:in oman non-fast-forward-suojan varoitusta).

inputs:
  label:
    description: 'Lyhyt nimi commit-viestiin, esim. "Pilvidata ECMWF"'
    required: true
  data-source-dir:
    description: >
      Hakemisto (tyohakemiston suhteen) josta *.json-tiedostot
      kopioidaan gh-pages:n data/-kansioon. Tyhja = ei data-muutosta
      (esim. pelkka sovelluskoodin synkkaus).
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - shell: bash
      run: |
        set -e
        # Tuotantoon (gh-pages) julkaistaan VAIN mainista (2026-10-23). Kutsuvan
        # jobin if-ehto estää tämän jo; tämä on varmistus, jos ehto unohtuu.
        if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
          echo "::error title=Julkaisu estetty::Julkaisu gh-pagesille vain mainista (ajo: ${GITHUB_REF}). Haara-ajon data on fetch-jobin artefaktina."
          exit 1
        fi
        git config --global user.name "pilvibotti"
        git config --global user.email "actions@users.noreply.github.com"

        WORKDIR="$(pwd)"
        PAGES_DIR="${WORKDIR}/../pages-publish-${{ github.run_id }}-${{ github.run_attempt }}"
        TMP_BRANCH="pages-tmp-${{ github.run_id }}-${{ github.run_attempt }}"

        # gh-pages voi olla olematon (ensimmainen julkaisu koskaan) - silloin
        # ei ole mitaan haettavaa/diffattavaa, luodaan tyhja orphan-worktree
        # suoraan. Muulloin haetaan oikea sisalto, jotta "ei muutoksia"
        # -tarkistus alla toimii oikeasti edellista julkaisua vastaan.
        git fetch origin gh-pages --depth=1 2>/dev/null || true
        if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
          git worktree add "$PAGES_DIR" -b "$TMP_BRANCH" origin/gh-pages
        else
          echo "gh-pages ei ole olemassa viela - luodaan ensimmainen julkaisu."
          mkdir -p "$PAGES_DIR"
          git worktree add --detach --no-checkout "$PAGES_DIR" HEAD
          (cd "$PAGES_DIR" && git checkout --orphan "$TMP_BRANCH")
        fi

        # Sovelluskoodi AINA mainin uusimmasta commitista (2026-10-22, KATSELMOINTI):
        # data-työnkulun publish-job checkouttaa ajon KÄYNNISTYSHETKEN commitin.
        # Jos main päivittyi haun aikana, sync-pages ehti julkaista uuden koodin
        # ja tämä julkaisu olisi palauttanut vanhan. Tiedostot haetaan suoraan
        # origin/mainista työhakemistoon ennen kopiointia.
        APP_FILES="index.html i18n.js aurora-core.js sw.js manifest.webmanifest icons lib fonts embed data/cameras.json"
        git fetch --no-tags --depth=1 origin main
        git checkout FETCH_HEAD -- $APP_FILES
        echo "Sovelluskoodi: main $(git rev-parse --short FETCH_HEAD) (ajon commit $(git rev-parse --short HEAD))"

        cp index.html i18n.js aurora-core.js sw.js manifest.webmanifest "$PAGES_DIR"/
        # Poistettu testisivu (2026-10) pois myos vanhasta julkaisusta.
        rm -f "$PAGES_DIR"/avaussivu-testi.html
        rm -rf "$PAGES_DIR"/icons
        cp -r icons "$PAGES_DIR"/icons
        rm -rf "$PAGES_DIR"/lib
        cp -r lib "$PAGES_DIR"/lib
        # Sora-fontti omana (2026-10-27, Suni-ilme ?ilme=suni; OFL fonts/OFL.txt).
        rm -rf "$PAGES_DIR"/fonts
        cp -r fonts "$PAGES_DIR"/fonts
        # YouTube-upotussivu (2026-10-27, embed/youtube.html: sovelluksen virhe 153).
        rm -rf "$PAGES_DIR"/embed
        cp -r embed "$PAGES_DIR"/embed
        # data/cameras.json on kasin yllapidetty, EI botin generoima -
        # synkataan tassa AINA main:ista kuten muukin sovelluskoodi
        # (ei ole osa mitaan fetch-jobin artifactia).
        mkdir -p "$PAGES_DIR"/data
        cp data/cameras.json "$PAGES_DIR"/data/

        if [ -n "${{ inputs.data-source-dir }}" ]; then
          # Ei dataa = hakuskripti totesi mallinajon keskeneräiseksi (run_guard.py,
          # KATSELMOINTI 1.13): ei julkaista mitään, edellinen ajo säilyy.
          if ! ls "${{ inputs.data-source-dir }}"/*.json >/dev/null 2>&1; then
            echo "::notice title=Ei julkaisua::Ei uutta dataa (keskeneräinen mallinajo) - gh-pages ennallaan."
            git worktree remove --force "$PAGES_DIR" 2>/dev/null || true
            exit 0
          fi
          mkdir -p "$PAGES_DIR"/data
          cp "${{ inputs.data-source-dir }}"/*.json "$PAGES_DIR"/data/
        fi

        cd "$PAGES_DIR"
        git add -A
        if git diff --cached --quiet; then
          echo "Ei muutoksia - ei julkaista uudelleen."
          exit 0
        fi

        # Tiivistys: orphan-commit EI periyta edellista historiaa lainkaan -
        # gh-pages pysyy aina tasan yhden commitin kokoisena, riippumatta
        # kuinka monta kertaa paivassa tama ajetaan (ks. CLAUDE.md/MUISTIO -
        # korjattu juuri siksi etta data/-tiedostojen suora commit mainiin
        # kasvatti repon .git-kokoa rajatta).
        git checkout --orphan "pages-orphan-${{ github.run_id }}-${{ github.run_attempt }}"
        git add -A
        git commit -m "${{ inputs.label }} $(date -u +'%Y-%m-%d %H:%M') UTC"
        git push --force origin HEAD:gh-pages
