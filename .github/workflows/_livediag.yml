name: TILAPÄINEN kameroiden live-diagnostiikka
on:
  push:
    branches: ['claude/kamerat-uudet']
    paths: ['scripts/_livediag.py']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/_livediag.py
