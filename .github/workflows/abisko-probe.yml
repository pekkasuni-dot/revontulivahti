name: Tutkimus - Abisko ja still-tarkistus (väliaikainen)
# Väliaikainen: poistetaan ennen mainiin yhdistämistä. Ei julkaise mitään.
on:
  push:
    branches: ['claude/**']
    paths: ['.github/abisko-probe.env']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Abisko 2 - Lights over Lapland -widget ja Twitch-esikatselu
        run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) AuroraAwesome-research'
          echo "=== widget.js"
          curl -sS -L -m 30 -A "$UA" https://webcams.lightsoverlapland.com/js/widget.js -o /tmp/w.js || true
          wc -c /tmp/w.js; head -c 3000 /tmp/w.js; echo
          echo "--- URLit"
          grep -oiE 'https?://[^"'"'"' )]+|//[a-z0-9.-]+/[^"'"'"' )]+' /tmp/w.js | sort -u | head -60
          echo "=== webcams.lightsoverlapland.com etusivu"
          curl -sS -L -m 30 -A "$UA" https://webcams.lightsoverlapland.com/ -o /tmp/l.html -D /tmp/lh || true
          grep -iE '^(HTTP|content-type|location)' /tmp/lh | tr -d '\r'
          grep -oiE '(src|href|data-src)="[^"]*"' /tmp/l.html | sort -u | head -60
          grep -oiE 'https?://[^"'"'"' )]+\.(jpe?g|png|webp|m3u8)[^"'"'"' )]*' /tmp/l.html /tmp/w.js | sort -u | head -30
          echo "=== Twitch-esikatselukuvat (otsakkeet)"
          for ch in lightsoverlapland lightsoverlaplandlive; do
            for i in 1 2; do
              u="https://static-cdn.jtvnw.net/previews-ttv/live_user_${ch}-640x360.jpg"
              echo "== $u"
              curl -sS -L -m 20 -A "$UA" -D /tmp/th -o /tmp/t.jpg "$u" || true
              grep -iE '^(HTTP|last-modified|content-length|content-type|cache-control|access-control|age|expires|location)' /tmp/th | tr -d '\r'
              sha256sum /tmp/t.jpg | cut -c1-12
              [ $i = 1 ] && sleep 330
            done
          done
          echo "=== Twitch-kanavasivut (otsikko)"
          for ch in lightsoverlapland lightsoverlaplandlive; do curl -sS -L -m 20 -A "$UA" "https://www.twitch.tv/$ch" | grep -oiE '<meta (property|name)="(og:title|og:description|og:image)" content="[^"]*"' | head -4; done
