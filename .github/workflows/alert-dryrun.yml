name: Revontulihälytys (kuivaharjoitus)

# VAIHE 1 (2026-10): ajaa hälytyslogiikan (alerts/aurora-alerts.js +
# aurora-core.js) 15 min välein testipaikoille ja kirjaa, mitkä hälytykset
# OLISIVAT lähteneet. EI lähetä ilmoituksia. Loki erilliseen haaraan
# halytys-loki (ei mainiin, ei gh-pagesille) yhtenä orpokommittina, joka
# korvaa edellisen -> historia ei kasva; lokit 14 vrk (skripti poistaa
# vanhemmat). Tuotannossa hälytykset ajetaan Cloudflare Workerissa (Actionsin
# ajastus myöhästyy 5-20 min), ks. MUISTIO-halytykset.md.
# PÄÄTTYY AUTOMAATTISESTI: END_DATE jälkeen (UTC-päivä) ajot eivät tee mitään
# (loki jää haaraan). Työnkulun voi poistaa sen jälkeen.
on:
  schedule:
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  END_DATE: '2026-11-04'   # kuivaharjoitus 14 vrk: 21.10.-4.11.2026 (viimeinen ajopäivä, UTC)

concurrency:
  group: alert-dryrun
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Onko kuivaharjoitus käynnissä (päättyy END_DATE)
        id: active
        run: |
          if [ "$(date -u +%F)" \> "$END_DATE" ]; then
            echo "Kuivaharjoitus päättyi $END_DATE - ei ajoa."
            echo "on=false" >> "$GITHUB_OUTPUT"
          else
            echo "on=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.active.outputs.on == 'true'

      - uses: actions/setup-node@v4
        if: steps.active.outputs.on == 'true'
        with:
          node-version: '20'

      - name: Hae edellinen loki ja tila (haara halytys-loki)
        if: steps.active.outputs.on == 'true'
        run: |
          set -e
          git config --global user.name "halytysbotti"
          git config --global user.email "actions@users.noreply.github.com"
          LOG="$RUNNER_TEMP/loki"
          echo "LOG=$LOG" >> "$GITHUB_ENV"
          git fetch origin halytys-loki --depth=1 2>/dev/null || true
          if git rev-parse --verify origin/halytys-loki >/dev/null 2>&1; then
            git worktree add --detach "$LOG" origin/halytys-loki
            echo "BASE=$(git rev-parse origin/halytys-loki)" >> "$GITHUB_ENV"
          else
            echo "Ensimmäinen ajo - haara halytys-loki luodaan."
            git worktree add --detach --no-checkout "$LOG" HEAD
            (cd "$LOG" && git checkout --orphan loki-alku && git read-tree --empty)
          fi

      - name: Aja hälytyslogiikka (kuivaharjoitus)
        if: steps.active.outputs.on == 'true'
        run: node scripts/alert-dryrun.mjs --out "$LOG"

      - name: Tallenna loki (orpokommitti, korvaa edellisen)
        if: steps.active.outputs.on == 'true'
        run: |
          set -e
          cd "$LOG"
          cat > README.md <<'EOF'
          # Revontulihälytysten kuivaharjoituksen loki

          Tämän haaran tekee työnkulku `.github/workflows/alert-dryrun.yml` (main).
          Jokainen ajo korvaa haaran yhdellä commitilla (historia ei kasva).

          - **YHTEENVETO.md** – viimeiset yöt aikajanana paikoittain
          - **HAVAINNOT.md** – omat havainnot (muokkaa käsin), näkyvät yhteenvedossa
          - **logs/VVVV-KK-PP.jsonl** – yksi rivi per ajo (UTC-päivä), 14 vrk
          - **state.json** – toiston eston tila

          Komentorivillä: `node scripts/alert-summary.mjs <tämän haaran hakemisto> --nights 7`
          EOF
          sed -i 's/^          //' README.md
          git checkout --orphan "loki-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          # Vain lokitiedostot: indeksi tyhjäksi ja nimetyt polut takaisin.
          # read-tree --empty (EI 'git rm --cached': se kieltäytyy koko
          # poistosta, jos tiedosto on muuttunut sekä indeksiin että työ-
          # hakemistoon nähden -> haaraan jäi koko main, todettu 2026-10-21).
          git read-tree --empty
          git add README.md YHTEENVETO.md HAVAINNOT.md state.json logs
          git commit -q -m "Hälytysloki $(date -u +'%Y-%m-%d %H:%M') UTC"
          # Force-push vain jos haara on yhä se, jonka haimme (lease): jos
          # HAVAINNOT.md:tä on muokattu ajon aikana, otetaan uusi versio,
          # yhteenveto uudelleen ja yritetään uudestaan -> havainto ei katoa.
          for i in 1 2 3 4; do
            if git push --force-with-lease="halytys-loki:${BASE:-}" origin HEAD:halytys-loki; then exit 0; fi
            sleep $((i * 3))
            git fetch origin halytys-loki --depth=1
            BASE=$(git rev-parse origin/halytys-loki)
            git show origin/halytys-loki:HAVAINNOT.md > HAVAINNOT.md 2>/dev/null || true
            node "$GITHUB_WORKSPACE/scripts/alert-dryrun.mjs" --out "$LOG" --summary-only
            git add HAVAINNOT.md YHTEENVETO.md
            git commit -q --amend --no-edit
          done
          exit 1
