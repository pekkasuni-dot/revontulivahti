name: Revontulihälytys (kuivaharjoitus)

# KENTTÄTESTI (2026-10-24): mainista ajettuna myös lähettää ilmoitukset
# ntfy.sh:lla (alerts/notify.js, taso normaali) ja palaute tallentuu
# PALAUTE.md:hen (palaute.yml). Pilvisyys HARMONIEsta (ALERT_CFG.cloudModel).

# VAIHE 1 (2026-10): ajaa hälytyslogiikan (alerts/aurora-alerts.js +
# aurora-core.js) 15 min välein testipaikoille ja kirjaa, mitkä hälytykset
# OLISIVAT lähteneet. EI lähetä ilmoituksia. Loki erilliseen haaraan
# halytys-loki (ei mainiin, ei gh-pagesille) yhtenä orpokommittina, joka
# korvaa edellisen -> historia ei kasva. Tuotannossa hälytykset ajetaan
# Cloudflare Workerissa (Actionsin ajastus myöhästyy 5-20 min), ks.
# MUISTIO-halytykset.md.
# JAKSO START_AT..END_DATE (2. jakso 23.10.-6.11.2026, Cloudflare-ajastimella;
# 1. jakso 21.-23.10. jäi haaraan halytys-loki, ajot 3-5 h välein). Tilat (askel "Tila"):
#   run    jakso käynnissä: normaali ajo; END_DATE-päivänä myös väliaikainen
#          LOPPURAPORTTI.md
#   final  END_DATE jälkeen, lopullista raporttia ei vielä ole: kirjoittaa
#          lopullisen LOPPURAPORTTI.md:n ja YHTEENVETO.md:n (ei hälytysajoa)
#   done   lopullinen raportti on jo: ei mitään. Työnkulun voi poistaa.
on:
  schedule:
    # VARAJASTUS (2026-10-23): pääajastin on Cloudflare Worker (workers/ajastin,
    # aikataulu schedule.js). Tämä cron (ennallaan, harvennetaan kun ajastin on
    # toiminut >= 3 vrk) ajaa vain, jos ajastin ei ole käynnistänyt työnkulkua
    # 30 min sisällä (job vahti) -> ei tuplia.
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  START_AT: '2026-10-23T14:45:00Z'   # 2. jakson alku (Cloudflare-ajastin käytössä); aiemmat rivit eivät yhteenvetoon/raporttiin
  END_DATE: '2026-11-06'             # viimeinen ajopäivä (UTC); 14 vrk
  LOKI: halytys-loki-2               # 1. jakso (21.-23.10.) jää haaraan halytys-loki koskematta

concurrency:
  group: alert-dryrun
  cancel-in-progress: false

jobs:
  # Varajastuksen vahti (vain schedule): ohittaa ajon, jos Cloudflare-ajastin
  # käynnisti työnkulun viimeisen 30 min aikana (.github/actions/ajastin-vahti).
  vahti:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.v.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions/ajastin-vahti
          persist-credentials: false
      - id: v
        uses: ./.github/actions/ajastin-vahti
        with:
          max-age-min: '30'

  run:
    needs: vahti
    if: ${{ !cancelled() && needs.vahti.outputs.run != 'false' }}   # vahti ohitettu (ei schedule) tai epäonnistui -> ajetaan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Tila ja edellinen loki (haara ${{ env.LOKI }})
        id: mode
        run: |
          set -e
          git config --global user.name "halytysbotti"
          git config --global user.email "actions@users.noreply.github.com"
          LOG="$RUNNER_TEMP/loki"
          echo "LOG=$LOG" >> "$GITHUB_ENV"
          git fetch origin "$LOKI" --depth=1 2>/dev/null || true
          if git rev-parse --verify "origin/$LOKI" >/dev/null 2>&1; then
            git worktree add --detach "$LOG" "origin/$LOKI"
            echo "BASE=$(git rev-parse "origin/$LOKI")" >> "$GITHUB_ENV"
          else
            echo "Ensimmäinen ajo - haara $LOKI luodaan."
            git worktree add --detach --no-checkout "$LOG" HEAD
            (cd "$LOG" && git checkout --orphan loki-alku && git read-tree --empty)
          fi
          if [ "$(date -u +%F)" \> "$END_DATE" ]; then
            if grep -q 'lopullinen -->' "$LOG/LOPPURAPORTTI.md" 2>/dev/null; then
              echo "Kuivaharjoitus päättyi $END_DATE ja lopullinen raportti on jo kirjoitettu - ei ajoa."
              MODE=done
            else
              echo "Kuivaharjoitus päättyi $END_DATE - kirjoitetaan lopullinen raportti."
              MODE=final
            fi
          else
            MODE=run
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "MODE=$MODE" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        if: steps.mode.outputs.mode != 'done'
        with:
          node-version: '20'

      # Kenttätesti (2026-10-24): ilmoitukset ntfy.sh:lla VAIN mainista ajettuna.
      # Kanavat ja palauteavain GitHubin salaisuuksista (eivät lokiin - GitHub
      # peittää ne). Palautteen osoite: PALAUTE_URL tai Workerin workers.dev-
      # osoite Cloudflaren rajapinnasta. Ks. OHJE-ntfy.md.
      - name: Palautteen osoite (Cloudflare Worker)
        if: steps.mode.outputs.mode == 'run' && github.ref == 'refs/heads/main'
        env:
          U: ${{ secrets.PALAUTE_URL }}
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$U" ] && [ -n "$T" ] && [ -n "$A" ]; then
            SUB=$(curl -sS -m 20 -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/accounts/$A/workers/subdomain" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s).result.subdomain||"")}catch(e){}})') || true
            [ -n "$SUB" ] && U="https://auroraawesome-ajastin.$SUB.workers.dev"
          fi
          if [ -n "$U" ]; then echo "PALAUTE_URL=$U" >> "$GITHUB_ENV"; else echo "::notice title=Palautenapit puuttuvat::Workerin osoitetta ei saatu (OHJE-ntfy.md)."; fi

      - name: Aja hälytyslogiikka (+ ilmoitukset mainista) tai lopullinen raportti
        if: steps.mode.outputs.mode != 'done'
        env:
          NTFY_TOPIC_PEKKA: ${{ secrets.NTFY_TOPIC_PEKKA }}
          NTFY_TOPIC_OPAS: ${{ secrets.NTFY_TOPIC_OPAS }}
          PALAUTE_AVAIN: ${{ secrets.PALAUTE_AVAIN }}
        run: |
          if [ "$MODE" = final ]; then FLAG=--final; else FLAG=; fi
          if [ "$MODE" = run ] && [ "$GITHUB_REF" = refs/heads/main ]; then FLAG="$FLAG --send"; fi
          node scripts/alert-dryrun.mjs --out "$LOG" --start "$START_AT" --end "$END_DATE" $FLAG

      - name: Tallenna loki (orpokommitti, korvaa edellisen)
        if: steps.mode.outputs.mode != 'done'
        run: |
          set -e
          cd "$LOG"
          cat > README.md <<'EOF'
          # Revontulihälytysten kuivaharjoituksen loki

          Tämän haaran tekee työnkulku `.github/workflows/alert-dryrun.yml` (main).
          Jokainen ajo korvaa haaran yhdellä commitilla (historia ei kasva).

          - **YHTEENVETO.md** – kaikki yöt aikajanana paikoittain
          - **HAVAINNOT.md** – omat havainnot (muokkaa käsin), näkyvät yhteenvedossa ja raportissa
          - **LOPPURAPORTTI.md** – koko jakson tilastot ja ehdotukset (viimeisenä päivänä, lopullinen sen jälkeen)
          - **logs/VVVV-KK-PP.jsonl** – yksi rivi per ajo (UTC-päivä)
          - **state.json** – toiston eston tila
          - **keograms.json** – julkaistujen keogrammien osoitteet (tarkistetaan aamulla)
          - **PALAUTE.md** – kenttätestin ilmoitusten napit (Näkyi / Ei näkynyt / Pilvessä), kirjaa työnkulku palaute.yml

          Komentorivillä: `node scripts/alert-summary.mjs <tämän haaran hakemisto>`
          EOF
          sed -i 's/^          //' README.md
          git checkout --orphan "loki-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          # Vain lokitiedostot: indeksi tyhjäksi ja nimetyt polut takaisin.
          # read-tree --empty (EI 'git rm --cached': se kieltäytyy koko
          # poistosta, jos tiedosto on muuttunut sekä indeksiin että työ-
          # hakemistoon nähden -> haaraan jäi koko main, todettu 2026-10-21).
          git read-tree --empty
          git add README.md YHTEENVETO.md HAVAINNOT.md state.json logs
          [ -f keograms.json ] && git add keograms.json
          [ -f PALAUTE.md ] && git add PALAUTE.md
          [ -f LOPPURAPORTTI.md ] && git add LOPPURAPORTTI.md
          git commit -q -m "Hälytysloki $(date -u +'%Y-%m-%d %H:%M') UTC ($MODE)"
          # Force-push vain jos haara on yhä se, jonka haimme (lease): jos
          # HAVAINNOT.md:tä on muokattu ajon aikana, otetaan uusi versio,
          # yhteenveto/raportti uudelleen ja yritetään uudestaan -> havainto ei katoa.
          if [ "$MODE" = final ]; then FLAG=--final; else FLAG=--summary-only; fi
          for i in 1 2 3 4; do
            if git push --force-with-lease="$LOKI:${BASE:-}" origin "HEAD:$LOKI"; then exit 0; fi
            sleep $((i * 3))
            git fetch origin "$LOKI" --depth=1
            BASE=$(git rev-parse "origin/$LOKI")
            git show "origin/$LOKI:HAVAINNOT.md" > HAVAINNOT.md 2>/dev/null || true
            # Palaute (palaute.yml) voi tulla ajon aikana -> uusin versio mukaan.
            git show "origin/$LOKI:PALAUTE.md" > PALAUTE.md 2>/dev/null || rm -f PALAUTE.md
            node "$GITHUB_WORKSPACE/scripts/alert-dryrun.mjs" --out "$LOG" --start "$START_AT" --end "$END_DATE" $FLAG
            git add HAVAINNOT.md YHTEENVETO.md
            [ -f PALAUTE.md ] && git add PALAUTE.md
            [ -f LOPPURAPORTTI.md ] && git add LOPPURAPORTTI.md
            git commit -q --amend --no-edit
          done
          exit 1
