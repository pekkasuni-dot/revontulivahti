name: Päivitä kameroiden tuoreustila

on:
  schedule:
    # Joka 10. min - sama suuruusluokka kuin YouTuben pikkukuvien oma
    # Cache-Control: max-age=300 (5 min) - ks. MUISTIO-webkamerat.md.
    # VARAJASTUS (2026-10-23): pääajastin on Cloudflare Worker (workers/ajastin,
    # aikataulu schedule.js). Tämä cron (harvennettu 2026-10-26: ajastin toiminut
    # luotettavasti 3 vrk, ks. OHJE-ajastin.md) ajaa vain, jos ajastin ei ole käynnistänyt työnkulkua
    # 20 min sisällä (job vahti) -> ei tuplia.
    - cron: '7 * * * *'   # varalla 1 h
  workflow_dispatch:

# Oikeudet (2026-10-22, KATSELMOINTI 3.1): työnkulun tasolla vain luku;
# kirjoitus vain publish-jobille (sen oma permissions-lohko).
permissions:
  contents: read

concurrency:
  group: camera-status
  cancel-in-progress: false   # 2026-10-23: varaajo ei saa keskeyttää ajastimen ajoa (jää jonoon, vahti ohittaa)

# HUOM (2026-10, korjattu repon kasvu, ks. pilvidata-ecmwf.yml:n
# vastaava kommentti): data julkaistaan gh-pages-haaraan tiivistettyna,
# EI committoida main:iin. ERITYISTA tallle tyonkululle: check-camera-
# thumbnails.py lukee EDELLISEN tilan (firstSeenAt/pysyvyysseuranta,
# ks. skriptin "PITKITTAINEN-signaali") data/camera-status.json:ista -
# main:issa tama olisi JATKUVASTI SAMA jaatynyt tila migraation jalkeen,
# joten edellinen tila haetaan NYT eksplisiittisesti gh-pages:sta ENNEN
# tarkistusta (ks. "fetch"-jobin oma askel alla).
jobs:
  # Varajastuksen vahti (vain schedule): ohittaa ajon, jos Cloudflare-ajastin
  # käynnisti työnkulun viimeisen 20 min aikana (.github/actions/ajastin-vahti).
  vahti:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.v.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions/ajastin-vahti
          persist-credentials: false
      - id: v
        uses: ./.github/actions/ajastin-vahti
        with:
          max-age-min: '20'

  fetch:
    needs: vahti
    if: ${{ !cancelled() && needs.vahti.outputs.run != 'false' }}   # vahti ohitettu (ei schedule) tai epäonnistui -> ajetaan
    runs-on: ubuntu-latest
    # Aikaraja (KATSELMOINTI): jumittunut haku ei pysäytä päivityksiä tunneiksi,
    # ja aikakatkaisu = failure -> publish julkaisee onnistuneet osat.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Hae edellinen tila gh-pages:sta (pysyvyysseurannan jatkamiseksi)
        run: |
          git fetch origin gh-pages --depth=1
          mkdir -p data
          git show origin/gh-pages:data/camera-status.json > data/camera-status.json 2>/dev/null \
            && echo "Edellinen tila loytyi gh-pages:sta." \
            || { echo "Ei edellista tilaa gh-pages:ssa - ensimmainen ajo."; rm -f data/camera-status.json; }

      - name: Tarkista kameroiden pikkukuvat (ei riippuvuuksia - pelkka stdlib)
        run: python3 scripts/check-camera-thumbnails.py

      - name: Tallenna data artifactiksi (julkaistaan alla)
        uses: actions/upload-artifact@v4
        with:
          name: camera-status
          path: data/camera-status.json
          retention-days: ${{ github.ref == 'refs/heads/main' && 1 || 7 }}   # haara-ajo: vertailuun 7 vrk
          if-no-files-found: error

  publish:
    needs: fetch
    # Julkaisu VAIN mainista (2026-10-23): haaralta ajettaessa data jää
    # fetch-jobin artefaktiksi (7 vrk) vertailua varten, gh-pages ennallaan.
    if: ${{ !cancelled() && needs.fetch.result != 'skipped' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: camera-status
          path: fetched
      - uses: ./.github/actions/publish-pages
        with:
          label: 'Kameroiden tuoreustila'
          data-source-dir: fetched
