name: Päivitä kameroiden tuoreustila

on:
  schedule:
    # Joka 10. min - sama suuruusluokka kuin YouTuben pikkukuvien oma
    # Cache-Control: max-age=300 (5 min) - ks. MUISTIO-webkamerat.md.
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: camera-status
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tarkista kameroiden pikkukuvat (ei riippuvuuksia - pelkka stdlib)
        run: python3 scripts/check-camera-thumbnails.py

      - name: Committaa jos tila muuttui
        run: |
          git config user.name "pilvibotti"
          git config user.email "actions@users.noreply.github.com"
          git add data/camera-status.json
          if git diff --cached --quiet; then
            echo "Ei muutoksia."
            exit 0
          fi
          git commit -m "Kameroiden tuoreustila $(date -u +'%Y-%m-%d %H:%M') UTC"
          # "pull --rebase" VASTA commitin jalkeen (ei ennen - likainen
          # tyohakemisto ennen committia rikkoo rebasen, ks. CLAUDE.md/
          # MUISTIO-pilviluku.md: tama bugi loytyi oikeasti wind-harmonie.
          # yml:sta, ja SAMA rakenne oli tassakin piilevana, EI vielä
          # havaittuna - korjattu ennaltaehkaisevasti), + muutama
          # uudelleenyritys ristikkaisen kilpajuoksun varalta.
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push epaonnistui (yritys $i/5), odotetaan ja yritetaan uudelleen..."
            sleep $((RANDOM % 10 + 3))
          done
          echo "Push epaonnistui kaikilla yrityksilla." >&2
          exit 1
