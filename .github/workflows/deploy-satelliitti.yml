name: Julkaise satelliitti-Worker

# Julkaisee workers/satelliitti-Workerin Cloudflareen (2026-10-30, ks. MUISTIO-selvitykset.md
# "Satelliittitaso: tuore kuva" ja OHJE-ajastin.md "Satelliittikuvat (R2)"). VAIN KÄSIN (workflow_dispatch,
# mainista): R2-säilö auroraawesome-sat on luotava hallintapaneelissa ennen ensimmäistä julkaisua,
# eikä automaattinen julkaisu saa kaatua sen puuttumiseen. Samat salaisuudet kuin ajastimella
# (CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID; tokenilla pitää olla myös Workers R2 Storage: Edit).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-satelliitti
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Testit
        run: node --test tests/satelliitti.test.mjs
      # R2-säilö luodaan, jos sitä ei vielä ole (2026-10-31; "already exists" ei kaada ajoa). Vaatii tokenilta
      # Workers R2 Storage: Edit - ilman sitä tämä askel epäonnistuu ja säilö luodaan hallintapaneelissa.
      - name: R2-säilö (luo, jos puuttuu)
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/satelliitti
          command: r2 bucket create auroraawesome-sat
      - name: Julkaise (wrangler deploy)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/satelliitti
      # Tarkistus (2026-10-30): odottaa ensimmäistä ajastettua hakua (enintään ~7 min) ja näyttää latest.jsonin.
      - name: Tarkista latest.json
        run: |
          for i in $(seq 1 15); do
            if curl -fsS "https://auroraawesome-satelliitti.pekka-suni.workers.dev/sat/ir105/latest.json"; then echo; echo "::notice title=Satelliitti-Worker::latest.json OK"; exit 0; fi
            sleep 30
          done
          echo "::warning title=Satelliitti-Worker::latest.json ei vastannut 7,5 min kuluessa - tarkista Workerin lokit (OHJE-ajastin.md)."
