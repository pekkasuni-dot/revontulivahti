name: Hälytysten testi-ilmoitus (FCM)

# Revontulihälytykset vaihe 1 (2026-11-02, päätökset 29 ja 30): lähettää testi-ilmoituksen yhden sijaintiruudun
# aiheeseen (alerts/fcm.js, scripts/fcm-test.mjs). Puhelin saa sen, jos sovelluksessa on Asetukset >
# Revontulihälytykset päällä ja oma sijainti tai jokin Omat paikat -paikka on samassa ruudussa.
# Käynnistys: Actions -> tämä työnkulku -> Run workflow, tai haaralta muuttamalla .github/fcm-testi.env.
# 11.11.2026: viesti oikean hälytyksen muodossa (sama rakennus kuin alert-fcm.yml: tulos + näkyvyys-%, mallit, Kp,
# palautepainikkeet), otsikon perässä "(testi)". Tyyppi valittavissa. Kysely (11.11.): data.survey = '1' -> varakysely napautuksesta heti. Lokissa ruutu ja aihe; varoitus oletuskoordinaateista.
# Salaisuudet: FCM_SERVICE_ACCOUNT (lähetys), PALAUTE_AVAIN_FCM (allekirjoitus -> palautepainikkeen vastaus kelpaa
# Workerille). Ei julkaise mitään. Ks. OHJE-fcm.md.
on:
  workflow_dispatch:
    inputs:
      lat:
        description: 'Leveysaste (esim. 65.01 = Oulu)'
        default: '65.01'
      lon:
        description: 'Pituusaste (esim. 25.47)'
        default: '25.47'
      lang:
        description: 'Kieli (all = kaikki kolme: fi, en, zh)'
        type: choice
        options: [all, fi, en, zh]
        default: all
      type:
        description: 'Hälytyksen tyyppi (now = Nyt, coming = Tulossa; sama ilmoitus, päätös 42)'
        type: choice
        options: [now, coming]
        default: now
      pct:
        description: 'Näkyvyys-% viestissä'
        default: '62'
      kysely:
        description: 'Pakota varakysely napautuksesta (aikaikkunasta riippumatta, vain testi)'
        type: boolean
        default: false
  push:
    branches: ['claude/**']
    paths: ['.github/fcm-testi.env']

permissions:
  contents: read

jobs:
  testi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lähetä testi-ilmoitus
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          PALAUTE_AVAIN_FCM: ${{ secrets.PALAUTE_AVAIN_FCM }}
          IN_LAT: ${{ inputs.lat }}
          IN_LON: ${{ inputs.lon }}
          IN_LANG: ${{ inputs.lang }}
          IN_TYPE: ${{ inputs.type }}
          IN_PCT: ${{ inputs.pct }}
          IN_KYSELY: ${{ inputs.kysely }}
        run: |
          # Haara-ajossa arvot .github/fcm-testi.env-tiedostosta (LAT, LON, LANG, TYPE, PCT; vanha VIEW -> tyyppi).
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ -f .github/fcm-testi.env ]; then
            set -a; . ./.github/fcm-testi.env; set +a
            IN_LAT="${LAT:-65.01}"; IN_LON="${LON:-25.47}"; IN_LANG="${LANG:-all}"; IN_PCT="${PCT:-62}"; IN_KYSELY="${KYSELY:-false}"
            case "${TYPE:-now}" in coming) IN_TYPE=coming ;; *) IN_TYPE=now ;; esac
          fi
          SURVEY=""; [ "$IN_KYSELY" = true ] && SURVEY="--survey"
          node scripts/fcm-test.mjs --lat "$IN_LAT" --lon "$IN_LON" --lang "$IN_LANG" --type "${IN_TYPE:-now}" --pct "${IN_PCT:-62}" $SURVEY
