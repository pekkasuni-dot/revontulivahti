name: Sumutason koehaku (väliaikainen)

# Tutkimustyökalu (ei julkaise mitään, ei koske gh-pagesiin eikä mainiin).
# Käynnistyy kun .github/fog-probe.env muuttuu claude/**-haaralla.
# POISTETAAN ennen mainiin yhdistämistä.
on:
  push:
    branches: ['claude/**']
    paths: ['.github/fog-probe.env']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Asenna riippuvuudet
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libeccodes-dev
          pip install --require-hashes -r requirements.txt
      - name: Koehaku
        run: python3 scripts/probe-fog.py
      - name: Tallenna tulos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fog-probe-${{ github.run_id }}
          path: probe-out
          retention-days: 7
