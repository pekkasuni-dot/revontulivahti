# VÄLIAIKAINEN tutkimus (2026-11-12): HARMONIEn ajon tunniste. Ei julkaisua, ei ajastusta. Poistetaan ennen yhdistämistä.
name: HARMONIE run -tutkimus
on:
  push:
    branches: ['claude/**']
    paths: ['.github/harmonie-run.env']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y libeccodes-dev
          pip install --require-hashes -r requirements.txt
      - run: python3 scripts/harmonie-run-probe.py
