name: iOS-sovellus (TestFlight)

# Capacitor-sovelluksen iOS-käännös GitHubin Mac-palvelimella ja lähetys TestFlightiin
# (2026-10-27, ks. OHJE-kaupat.md). Käynnistys käsin: Actions -> "iOS-sovellus (TestFlight)"
# -> Run workflow (main). Ilman Applen salaisuuksia tehdään pelkkä allekirjoittamaton
# koekäännös (tarkistaa, että projekti kääntyy). Haaralla koekäännös käynnistyy myös
# .github/sovellus-koe.env-tiedoston muutoksesta (ei lähetystä).
# Allekirjoitus: Xcoden automaattinen allekirjoitus App Store Connect -API-avaimella
# (pilvessä hallittu jakeluvarmenne, ei omaa .p12-tiedostoa eikä profiileja).
on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Lähetä TestFlightiin (vaatii salaisuudet)'
        type: boolean
        default: true
  # Kehitysversio "Aurora Dev" (2026-10-31): käynnistetään työnkulusta ios-dev.yml (oma build-numerosarja),
  # joka kutsuu tätä dev: true. Xcode-konfiguraatio Dev / scheme "Aurora Dev" (tunniste, nimi, kuvake).
  workflow_call:
    inputs:
      upload:
        type: boolean
        default: false
      dev:
        type: boolean
        default: false
      build_offset:
        description: 'Lisätään ajon numeroon (kehitysversion oma sarja)'
        type: number
        default: 0
  push:
    branches: ['claude/**']
    paths: ['.github/sovellus-koe.env']

permissions:
  contents: read

concurrency:
  group: ios-build
  cancel-in-progress: false

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Riippuvuudet ja verkkosisältö (www/)
        run: |
          npm ci
          # APP_TEST_BUILD=1: Pro-testikytkin asetuksissa; kauppaversiossa pois (CLAUDE.md tarkistuslista)
          # APP_DEV=1 (dev-valinta): kehitysversio, paketissa vain latainsivu (OHJE-kaupat.md "Kehitysversio")
          if [ "${{ inputs.dev }}" = "true" ]; then APP_DEV=1 node scripts/build-app.mjs; else APP_TEST_BUILD=1 node scripts/build-app.mjs; fi
          npx cap sync ios
      - name: Firebase-asetukset (hälytykset, salaisuuksista)
        # 2026-11-02, päätös 29: GoogleService-Info.plist base64:nä salaisuudesta (tuotanto / Aurora Dev erikseen,
        # eri tunnisteet). Ilman salaisuutta sovellus kääntyy ja toimii, hälytykset eivät (ks. OHJE-fcm.md).
        env:
          PLIST_B64: ${{ inputs.dev && secrets.FIREBASE_IOS_DEV_PLIST_B64 || secrets.FIREBASE_IOS_PLIST_B64 }}
        run: |
          if [ -n "$PLIST_B64" ]; then
            printf '%s' "$PLIST_B64" | base64 --decode > ios/App/App/GoogleService-Info.plist
            plutil -lint ios/App/App/GoogleService-Info.plist
            echo "Firebase: BUNDLE_ID $(/usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' ios/App/App/GoogleService-Info.plist)"
          else
            echo "::notice::Firebase-salaisuus puuttuu -> käännös ilman ilmoituksia (hälytykset eivät toimi)."
          fi
      - name: Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          xcodebuild -version
      - name: Versio
        id: ver
        run: |
          echo "version=$(cat www/app-version.txt)" >> "$GITHUB_OUTPUT"
          # Build-numero = ajon numero; kehitysversiolla oma työnkulku (oma run_number) + 1000 -> oma sarja,
          # ei ristiin kauppaversion kanssa eikä aiempien (tämän työnkulun numeroilla tehtyjen) Dev-käännösten kanssa.
          echo "build=$(( ${{ github.run_number }} + ${{ inputs.build_offset || 0 }} ))" >> "$GITHUB_OUTPUT"
      - name: Käännös ja lähetys
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ steps.ver.outputs.version }}
          BUILD: ${{ steps.ver.outputs.build }}
          UPLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.upload == true && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          PROJ=ios/App/App.xcodeproj
          # Tuotanto: scheme App / Release. Kehitysversio: scheme "Aurora Dev" / Dev
          # (fi.suni.auroraweather.dev, nimi "Aurora Dev", kuvake AppIcon-Dev).
          if [ "${{ inputs.dev }}" = "true" ]; then SCHEME="Aurora Dev"; CONF=Dev; else SCHEME=App; CONF=Release; fi
          echo "Scheme: $SCHEME, konfiguraatio: $CONF, versio $VERSION ($BUILD)"
          if [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "$KEY_P8" ] || [ -z "$TEAM_ID" ]; then
            echo "::notice::Applen salaisuudet puuttuvat -> allekirjoittamaton koekäännös (ei lähetystä)."
            xcodebuild -project "$PROJ" -scheme "$SCHEME" -configuration "$CONF" -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" build | tail -40
            exit 0
          fi
          KEY="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s\n' "$KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID")
          # Arkisto allekirjoittamattomana: automaattinen allekirjoitus loisi arkistolle
          # kehitysprofiilin, joka vaatii rekisteröidyn laitteen ("Your team has no devices").
          # Allekirjoitus tehdään vasta viennissä App Store -jakelulle (pilvessä hallittu
          # jakeluvarmenne + App Store -profiili, ei laitteita).
          xcodebuild -project "$PROJ" -scheme "$SCHEME" -configuration "$CONF" -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" archive | tail -40
          # Ilmoitusoikeus (2026-11-02, hälytykset): allekirjoittamaton arkisto ei sisällä entitlements-tietoja, eikä vienti
          # lisännyt niitä (koekäännös 47: aps-environment puuttui). Väliaikainen allekirjoitus (ad hoc, "-") arkistoon
          # App.entitlementsin kanssa -> viennin App Store -allekirjoitus perii oikeudet (Xcode vaihtaa production-arvon).
          APPD_A=$(ls -d "$RUNNER_TEMP"/App.xcarchive/Products/Applications/*.app | head -1)
          find "$APPD_A/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -print0 2>/dev/null \
            | xargs -0 -I{} codesign -f -s - {} 2>/dev/null || true
          # Päätös 61 (18.11.2026): Notification Service Extension (PlugIns/NotificationService.appex) allekirjoitetaan
          # ENSIN omilla oikeuksillaan (App Group), sitten sovellus. Dev-käännöksellä omat tiedostot (.dev-ryhmä).
          if [ "${{ inputs.dev }}" = "true" ]; then APP_ENT=ios/App/App/App-Dev.entitlements; EXT_ENT=ios/App/NotificationService/NotificationService-Dev.entitlements
          else APP_ENT=ios/App/App/App.entitlements; EXT_ENT=ios/App/NotificationService/NotificationService.entitlements; fi
          APPEX="$APPD_A/PlugIns/NotificationService.appex"
          if [ -d "$APPEX" ]; then
            codesign -f -s - --entitlements "$EXT_ENT" --generate-entitlement-der "$APPEX"
            echo "Laajennuksen oikeudet:"; codesign -d --entitlements :- "$APPEX" 2>/dev/null | grep -A2 application-groups || echo "::warning::App Group ei tarttunut laajennukseen"
          else
            echo "::warning::NotificationService.appex puuttuu arkistosta -> paikan nimi ei näy iOS-ilmoituksissa"
          fi
          codesign -f -s - --entitlements "$APP_ENT" --generate-entitlement-der "$APPD_A"
          echo "Arkiston oikeudet:"; codesign -d --entitlements :- "$APPD_A" 2>/dev/null | grep -A1 -E 'aps-environment|application-groups' || echo "::warning::aps-environment ei tarttunut arkistoon"
          DEST=export; [ "$UPLOAD" = "true" ] && DEST=upload
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$DEST</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}" | tail -40
          rm -f "$KEY"
          # Hälytykset (2026-11-02): tarkista, että allekirjoitetussa sovelluksessa on ilmoitusoikeus (aps-environment)
          # ja Firebase-asetukset. Arkisto tehdään allekirjoittamattomana -> varmistetaan, että vienti lisää oikeuden.
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa 2>/dev/null | head -1 || true)
          if [ -n "$IPA" ]; then
            rm -rf "$RUNNER_TEMP/ipa" && mkdir -p "$RUNNER_TEMP/ipa" && unzip -q "$IPA" -d "$RUNNER_TEMP/ipa"
            APPD=$(ls -d "$RUNNER_TEMP"/ipa/Payload/*.app | head -1)
            codesign -d --entitlements :- "$APPD" 2>/dev/null > "$RUNNER_TEMP/ent.plist" || true
            APS=$(/usr/libexec/PlistBuddy -c 'Print :aps-environment' "$RUNNER_TEMP/ent.plist" 2>/dev/null || echo puuttuu)
            echo "Ilmoitusoikeus (aps-environment): $APS"
            [ "$APS" = puuttuu ] && echo "::warning::Sovelluksesta puuttuu aps-environment -> ilmoitukset eivät toimi (OHJE-fcm.md)."
            [ -f "$APPD/GoogleService-Info.plist" ] && echo "Firebase-asetukset paketissa" || echo "::notice::GoogleService-Info.plist ei paketissa"
            # Päätös 61: App Group sovelluksessa ja laajennuksessa (sama ryhmä), laajennus mukana paketissa.
            echo "Sovelluksen App Group: $(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' "$RUNNER_TEMP/ent.plist" 2>/dev/null || echo puuttuu)"
            if [ -d "$APPD/PlugIns/NotificationService.appex" ]; then
              codesign -d --entitlements :- "$APPD/PlugIns/NotificationService.appex" 2>/dev/null > "$RUNNER_TEMP/ent-ext.plist" || true
              echo "Laajennuksen App Group: $(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' "$RUNNER_TEMP/ent-ext.plist" 2>/dev/null || echo puuttuu)"
            else
              echo "::warning::NotificationService.appex puuttuu paketista"
            fi
          fi
          if [ "$DEST" = upload ]; then
            echo "::notice::Lähetetty App Store Connectiin: versio $VERSION ($BUILD)${{ inputs.dev && ', KEHITYSVERSIO Aurora Dev' || '' }}. Näkyy TestFlightissa käsittelyn jälkeen (5-30 min)."
          else
            echo "::notice::Allekirjoitettu käännös tehty, ei lähetetty (upload pois tai ei mainista)."
          fi
