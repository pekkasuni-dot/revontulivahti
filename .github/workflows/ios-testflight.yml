name: iOS-sovellus (TestFlight)

# Capacitor-sovelluksen iOS-käännös GitHubin Mac-palvelimella ja lähetys TestFlightiin
# (2026-10-27, ks. OHJE-kaupat.md). Käynnistys käsin: Actions -> "iOS-sovellus (TestFlight)"
# -> Run workflow (main). Ilman Applen salaisuuksia tehdään pelkkä allekirjoittamaton
# koekäännös (tarkistaa, että projekti kääntyy). Haaralla koekäännös käynnistyy myös
# .github/sovellus-koe.env-tiedoston muutoksesta (ei lähetystä).
# Allekirjoitus: Xcoden automaattinen allekirjoitus App Store Connect -API-avaimella
# (pilvessä hallittu jakeluvarmenne, ei omaa .p12-tiedostoa eikä profiileja).
on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Lähetä TestFlightiin (vaatii salaisuudet)'
        type: boolean
        default: true
  # Kehitysversio "Aurora Dev" (2026-10-31): käynnistetään työnkulusta ios-dev.yml (oma build-numerosarja),
  # joka kutsuu tätä dev: true. Xcode-konfiguraatio Dev / scheme "Aurora Dev" (tunniste, nimi, kuvake).
  workflow_call:
    inputs:
      upload:
        type: boolean
        default: false
      dev:
        type: boolean
        default: false
      build_offset:
        description: 'Lisätään ajon numeroon (kehitysversion oma sarja)'
        type: number
        default: 0
  push:
    branches: ['claude/**']
    paths: ['.github/sovellus-koe.env']

permissions:
  contents: read

concurrency:
  group: ios-build
  cancel-in-progress: false

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Riippuvuudet ja verkkosisältö (www/)
        run: |
          npm ci
          # APP_TEST_BUILD=1: Pro-testikytkin asetuksissa; kauppaversiossa pois (CLAUDE.md tarkistuslista)
          # APP_DEV=1 (dev-valinta): kehitysversio, paketissa vain latainsivu (OHJE-kaupat.md "Kehitysversio")
          if [ "${{ inputs.dev }}" = "true" ]; then APP_DEV=1 node scripts/build-app.mjs; else APP_TEST_BUILD=1 node scripts/build-app.mjs; fi
          npx cap sync ios
      - name: Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          xcodebuild -version
      - name: Versio
        id: ver
        run: |
          echo "version=$(cat www/app-version.txt)" >> "$GITHUB_OUTPUT"
          # Build-numero = ajon numero; kehitysversiolla oma työnkulku (oma run_number) + 1000 -> oma sarja,
          # ei ristiin kauppaversion kanssa eikä aiempien (tämän työnkulun numeroilla tehtyjen) Dev-käännösten kanssa.
          echo "build=$(( ${{ github.run_number }} + ${{ inputs.build_offset || 0 }} ))" >> "$GITHUB_OUTPUT"
      - name: Käännös ja lähetys
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ steps.ver.outputs.version }}
          BUILD: ${{ steps.ver.outputs.build }}
          UPLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.upload == true && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          PROJ=ios/App/App.xcodeproj
          # Tuotanto: scheme App / Release. Kehitysversio: scheme "Aurora Dev" / Dev
          # (fi.suni.auroraweather.dev, nimi "Aurora Dev", kuvake AppIcon-Dev).
          if [ "${{ inputs.dev }}" = "true" ]; then SCHEME="Aurora Dev"; CONF=Dev; else SCHEME=App; CONF=Release; fi
          echo "Scheme: $SCHEME, konfiguraatio: $CONF, versio $VERSION ($BUILD)"
          if [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "$KEY_P8" ] || [ -z "$TEAM_ID" ]; then
            echo "::notice::Applen salaisuudet puuttuvat -> allekirjoittamaton koekäännös (ei lähetystä)."
            xcodebuild -project "$PROJ" -scheme "$SCHEME" -configuration "$CONF" -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" build | tail -40
            exit 0
          fi
          KEY="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s\n' "$KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID")
          # Arkisto allekirjoittamattomana: automaattinen allekirjoitus loisi arkistolle
          # kehitysprofiilin, joka vaatii rekisteröidyn laitteen ("Your team has no devices").
          # Allekirjoitus tehdään vasta viennissä App Store -jakelulle (pilvessä hallittu
          # jakeluvarmenne + App Store -profiili, ei laitteita).
          xcodebuild -project "$PROJ" -scheme "$SCHEME" -configuration "$CONF" -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" archive | tail -40
          DEST=export; [ "$UPLOAD" = "true" ] && DEST=upload
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$DEST</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}" | tail -40
          rm -f "$KEY"
          if [ "$DEST" = upload ]; then
            echo "::notice::Lähetetty App Store Connectiin: versio $VERSION ($BUILD)${{ inputs.dev && ', KEHITYSVERSIO Aurora Dev' || '' }}. Näkyy TestFlightissa käsittelyn jälkeen (5-30 min)."
          else
            echo "::notice::Allekirjoitettu käännös tehty, ei lähetetty (upload pois tai ei mainista)."
          fi
