name: Kamerahaku Ranua (väliaikainen tutkimus)
# Tutkimustyökalu: ei julkaise tuotantoon. Tulos orpohaaraan kamerahaku-ranua-kuvat.
on:
  push:
    branches: ['claude/**']
    paths: ['.github/kamerahaku-ranua.env']
permissions:
  contents: write
jobs:
  haku:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/kamerahaku-kuvat.py || echo "virhe $?"
      - name: Tallenna orpohaaraan
        if: always()
        run: |
          mkdir -p out && cd out
          git init -q -b kamerahaku-ranua-kuvat && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "tulos $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" kamerahaku-ranua-kuvat
