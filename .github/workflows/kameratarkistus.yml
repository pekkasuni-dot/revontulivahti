name: Kameratarkistus (väliaikainen tutkimus)

# Tutkimustyökalu: ei julkaise tuotantoon. Tulos orpohaaraan kameratarkistus-tulos.
on:
  push:
    branches: ['claude/**']
    paths: ['.github/kameratarkistus.env']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: pip install --quiet pillow
      - name: Aja tarkistus
        run: |
          set -a; . .github/kameratarkistus.env; set +a
          git fetch -q origin gh-pages --depth=1 && git show origin/gh-pages:data/camera-status.json > /tmp/camera-status.json || true
          python3 scripts/kameratarkistus-probe.py || echo "skripti päättyi virheeseen $?"
          mkdir -p out && cp /tmp/camera-status.json out/ 2>/dev/null || true
      - name: Tallenna orpohaaraan
        if: always()
        run: |
          cd out
          rm -rf pages
          [ -f report.json ] && python3 -c "
          import re,sys; p='report.json'; s=open(p).read()
          s=re.sub(r'(?i)(access_token|api_?key|key|token|sig|signature|secret)=[^&\"\\s]+', r'\\1=X', s)
          s=re.sub(r'\\b(pk|sk|tk)\\.[A-Za-z0-9._-]{20,}', 'TOKEN', s)
          s=re.sub(r'AIza[0-9A-Za-z_-]{30,}', 'TOKEN', s)
          open(p,'w').write(s)"
          git init -q -b "$TULOS" && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "tulos $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$TULOS" || { echo PUSH EPÄONNISTUI; head -c 300000 report.json; exit 1; }
        env:
          TULOS: kameratarkistus-${{ hashFiles('.github/kameratarkistus.env') }}
