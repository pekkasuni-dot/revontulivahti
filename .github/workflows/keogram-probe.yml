name: Tutkimus - keogrammit (väliaikainen)
on:
  push:
    branches: ['claude/**']
    paths: ['.github/keogram-probe.env']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Hae
        run: |
          for u in https://www.irf.se/en/forskning/kago/license/ https://www.sgo.fi/Data/licence.php; do
            echo "=== $u"; curl -sS -L -m 30 "$u" | tr '\n' ' ' | sed -e 's/<script[^<]*<\/script>//g; s/<style[^<]*<\/style>//g; s/<[^>]*>/\n/g' | tr -s ' \t' | grep -v '^\s*$' | awk 'length>60' | grep -iE 'licen|credit|acknowl|cite|commercial|permission|redistrib|free|publish|user|data' | head -30; done
