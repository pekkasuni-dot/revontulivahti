name: Tutkimus - keogrammit (väliaikainen)
on:
  push:
    branches: ['claude/**']
    paths: ['.github/keogram-probe.env']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Hae
        run: |
          idx(){ echo; echo "=== $1"; curl -sS -L -m 30 "$1" | sed -e 's/<[^>]*>/ /g' | tr -s ' ' | grep -v '^\s*$' | grep -v '\.jpg ' | tail -${2:-25}; echo "jpg-tiedostoja: $(curl -sS -L -m 30 "$1" | grep -c '\.jpg"')"; }
          K=https://www.irf.se/alis/allsky/krn
          idx $K/2026/10/22/ 25
          idx $K/2026/10/23/ 10
          echo "=== SGO GET"
          for q in 'year=2026&month=10&day=21&sod=1&show=Show+data' 'year=2026&month=10&day=21&skyiShow=ALL'; do
            curl -sS -L -m 30 "https://www.sgo.fi/Data/Optical/Skyi/skyiRevotData.php?$q" | grep -oiE '(src|href)="?[^" >]*(keo|\.png|\.jpg)[^" >]*' | grep -viE 'grafiikka|logo' | head -10; echo ---; done
          echo "=== SGO POST"
          curl -sS -L -m 30 -d 'year=2026&month=10&day=21&sod=1&show=Show+data' https://www.sgo.fi/Data/Optical/Skyi/skyiRevotData.php | grep -oiE '(src|href)="?[^" >]*(keo|\.png|\.jpg)[^" >]*' | grep -viE 'grafiikka|logo' | head -10
