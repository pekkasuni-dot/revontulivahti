name: Tutkimus - keogrammit (väliaikainen)
on:
  push:
    branches: ['claude/**']
    paths: ['.github/keogram-probe.env']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Hae
        run: |
          ctx(){ echo; echo "=== $1 [$2]"; curl -sS -L -m 30 "$1" | tr '\n' ' ' | grep -oiE ".{0,160}($2).{0,220}" | head -${3:-12}; }
          text(){ echo; echo "=== TEXT $1"; curl -sS -L -m 30 "$1" | tr '\n' ' ' | sed -e 's/<script[^<]*<\/script>//g; s/<[^>]*>/ /g' | tr -s ' ' | grep -oiE "${2}" | head -${3:-6}; }
          head1(){ printf '%s ' "$1"; curl -sS -I -L -m 20 "$1" | grep -iE '^(HTTP|last-modified|content-length|location)' | tr -d '\r' | tr '\n' ' '; echo; }
          text https://www.sgo.fi/Data/licence.php '.{0,100}(licen|CC BY|attribut|cite|acknowledg|commercial|permission).{0,500}' 8
          ctx https://www.sgo.fi/Data/Optical/allskyArchive.php 'keo|\.jpg|\.png|skyi|php\?' 20
          ctx https://www.sgo.fi/Data/Optical/allskyData.php 'keo|\.jpg|\.png|skyi|iframe|php\?' 20
          ctx https://www.irf.se/en/observatory-activities/allsky-camera/ 'keogram|\.jpg|\.png|\.gif|\.mp4' 12
          echo "=== krn listing"; curl -sS -L -m 30 https://www.irf.se/alis/allsky/krn/ | grep -oiE 'href="[^"]+"' | head -40
          curl -sS -L -m 30 https://www.irf.se/alis/allsky/krn/ | sed -e 's/<[^>]*>/ /g' | tr -s ' ' | grep -v '^\s*$' | head -40
          text "https://www.irf.se/en/observatory-activities/allsky-camera/license-agreement-for-data-obtained-from-kiruna-atmospheric-and-geophysical-observatory-at-swedish-institute-of-space-physics/" '.{0,100}(licen|attribut|cite|acknowledg|commercial|permission|free|allowed).{0,500}' 10
          ctx https://www.irf.se/en/observatory-activities/allsky-camera/ 'href="[^"]*licen[^"]*"' 3
