name: Tutkimus - keogrammit (väliaikainen)
on:
  push:
    branches: ['claude/**']
    paths: ['.github/keogram-probe.env']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Hae
        run: |
          idx(){ echo; echo "=== $1"; curl -sS -L -m 30 "$1" | sed -e 's/<[^>]*>/ /g' | tr -s ' ' | grep -v '^\s*$' | tail -${2:-25}; }
          ctx(){ echo; echo "=== $1 [$2]"; curl -sS -L -m 30 "$1" | tr '\n' ' ' | grep -oiE ".{0,120}($2).{0,200}" | head -${3:-12}; }
          head1(){ printf '%s ' "$1"; curl -sS -I -L -m 20 "$1" | grep -iE '^(HTTP|last-modified|content-length|content-type)' | tr -d '\r' | tr '\n' ' '; echo; }
          K=https://www.irf.se/alis/allsky/krn
          idx $K/keo/ 30
          idx $K/2026/ 15
          idx $K/2026/10/ 15
          idx $K/10/ 10
          ctx https://www.sgo.fi/Data/Optical/Skyi/skyiDataMain.php 'keo|\.jpg|\.png|select|option value|action=' 25
          ctx "https://www.irf.se/en/observatory-activities/allsky-camera/" 'licen' 5
          curl -sS -L -m 30 https://www.irf.se/en/observatory-activities/allsky-camera/ | grep -oiE 'href="[^"]*(licen|avtal)[^"]*"' | sort -u
