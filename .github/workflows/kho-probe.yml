name: KHO-kameroiden tutkimus (väliaikainen)

# Tutkimustyökalu: ei julkaise tuotantoon. Tallentaa kuvat orpohaaraan kho-tutkimus.
on:
  push:
    branches: ['claude/**']
    paths: ['.github/kho-probe.env']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Hae kuvat ja sivut
        run: |
          mkdir out && cd out
          UA="Mozilla/5.0 (research probe)"
          for u in SD/pics/cam1.jpg SD/pics/cam2.jpg SD/pics/cam3.jpg SD/pics/cam3a.jpg SD/pics/cam4.jpg Quicklooks/kho_sony.jpg Quicklooks/realtimekeo__sony_RGB.png Quicklooks/khodog.jpg WebCameras.html data/SonyA7s.html Instruments/SonyA7s.html Data.html Keograms/keograms.php; do
            f=$(echo "$u" | tr '/' '_'); curl -sSL -A "$UA" -m 30 -D "$f.hdr" -o "$f" "https://kho.unis.no/$u"; done
          curl -sSL -m 30 -o tid_lyr_latest.png http://tid.uio.no/plasma/allsky_camera/realtime/incoming/lyr_latest.png -D tid.hdr || true
          date -u > aika.txt; ls -la
      - name: Tallenna orpohaaraan
        run: |
          cd out
          git init -q -b kho-tutkimus && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "KHO $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" kho-tutkimus
