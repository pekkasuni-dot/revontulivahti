name: KOE ennustevertailun lähteet (väliaikainen)
# Poistetaan ennen yhdistämistä. Ei julkaisua.
on:
  push:
    branches: ['claude/**']
    paths: ['.github/koe-vertailu.env']
permissions:
  contents: read
jobs:
  koe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/koe-vertailu.mjs
      - name: Lokiajo (kuiva) ja oikea ajo väliaikaiseen hakemistoon + raportti
        run: |
          node scripts/forecast-log.mjs --dry | head -c 6000
          node scripts/forecast-log.mjs --out "$RUNNER_TEMP/loki" --min-end 2026-11-17 --max-end 2026-12-15
          cat "$RUNNER_TEMP/loki/status.json"; head -c 3000 "$RUNNER_TEMP/loki/RAPORTTI.md"
