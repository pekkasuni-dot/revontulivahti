name: KOE ennustevertailun lähteet (väliaikainen)
# Poistetaan ennen yhdistämistä. Ei julkaisua.
on:
  push:
    branches: ['claude/**']
    paths: ['.github/koe-vertailu.env']
permissions:
  contents: read
jobs:
  koe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/koe-vertailu.mjs
