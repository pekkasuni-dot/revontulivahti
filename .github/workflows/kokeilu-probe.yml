name: Tutkimus - stillkamerat (väliaikainen)
on:
  push:
    branches: ['kokeilu/**']
    paths: ['.github/kokeilu-probe.env']
permissions:
  contents: read
jobs:
  yoseuranta:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Puuttuvat osoitteet (IRF, UAF, AuroraMAX)
        run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) AuroraAwesome-research'
          echo "=== IRF"; curl -sS -L -m 30 -A "$UA" https://www.irf.se/en/forskning/kago/firmamentkamera/ | grep -oiE '(src|href)="[^"]*\.(jpe?g|png|gif|mp4)[^"]*"' | grep -viE 'logo|icon|favicon|/uploads/|sitevision' | sort -u | head -12
          echo "=== UAF SSE"; for c in poker toolik; do timeout 8 curl -sS -N "https://allsky.gi.alaska.edu/src/checkLive.php?cam=$c" | head -c 600; echo; done
          echo "=== AuroraMAX"; for s in 480p 720p 1080p; do printf "$s "; curl -sS -I -m 20 https://auroramax.phys.ucalgary.ca/recent/recent_$s.jpg | grep -iE '^(HTTP|last-modified|content-length)' | tr -d '\r' | tr '\n' ' '; echo; done
      - name: Seuranta 10 min välein (~5,5 h)
        run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) AuroraAwesome-research'
          cat > /tmp/urls <<'X'
          sod https://www.sgo.fi/Data/RealTime/Kuvat/skyi_SOD_latest.jpg
          oul https://www.sgo.fi/pub_asc/requests/skyi_test/skyi_OUL_latest.jpg
          aak https://www.sgo.fi/pub_asc/requests/skyi_test/skyi_AAK_latest.jpg
          hks https://www.ursa.fi/yhd/sirius/sivut/kuvat/ImageLastFTP_AllSKY.jpg
          kho https://kho.unis.no/SD/pics/cam2.jpg
          prj https://uk.jokkmokk.jp/photo/nr1/latest_m.jpg
          ayk https://pics.starvisor.net/galleries/orig/cap_ayk2.jpg
          vrk https://pics.starvisor.net/galleries/orig/cap_vrk.jpg
          fsm https://api.phys.ucalgary.ca/api/v1/rt/trexrgb_fsmi_standard/latest?no_logo=true
          gil https://api.phys.ucalgary.ca/api/v1/rt/trexrgb_gill_standard/latest?no_logo=true
          ymx https://auroramax.phys.ucalgary.ca/recent/recent_480p.jpg
          isr https://www.nps.gov/webcams-isro/northshore.jpg
          X
          sed -i 's/^ *//' /tmp/urls
          for i in $(seq 1 33); do
            echo "##### kierros $i $(date -u +%H:%M)"
            while read id u; do
              r=$(curl -sS -L -m 40 -A "$UA" -o /tmp/i -D /tmp/h -w '%{http_code} %{size_download} %{time_total}' "$u" 2>/dev/null || echo "ERR 0 0")
              lm=$(grep -i '^last-modified' /tmp/h 2>/dev/null | tail -1 | cut -d' ' -f2- | tr -d '\r')
              h=$(sha256sum /tmp/i 2>/dev/null | cut -c1-10)
              echo "$(date -u +%H:%M) $id $r $h | $lm"
            done < /tmp/urls
            [ $i -lt 33 ] && sleep 600
          done
