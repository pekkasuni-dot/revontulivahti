name: Tutkimus - stillkamerat (väliaikainen)
on:
  push:
    branches: ['kokeilu/**']
    paths: ['.github/kokeilu-probe.env']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Kamerasivujen lähdelinkit (vain löytämiseen)
        run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) AuroraAwesome-research'
          for s in sodankyla-sgo-finland hankasalmi-finland espoo-finland skibotn-tromso-tgo-norway svalbard-norway setermoen-norway kiruna-sweden porjus-sweden abisko-sweden gallivare-sweden vorkuta-russia provideniya-russia pyatireche-russia aykhal-russia strezhevoy-russia yellowknife-nwt canada-nwt-fort-smith canada-manitoba-gillam churchill-manitoba usa-alaska-poker-flat toolik-alaska isle-royale-np-michigan chik-wauk-minnesota; do
            curl -sS -L -m 30 -A "$UA" -o /tmp/p.html "https://liveauroracams.com/webcams/$s/" || true
            echo "=== $s"
            tr '\n' ' ' < /tmp/p.html | sed -e 's/<script[^<]*<\/script>//g; s/<[^>]*>/ /g' | tr -s ' ' | grep -oiE '.{0,80}(provider|source|courtesy|credit|owner|copyright|©).{0,160}' | head -4
            grep -oiE '(href|src|data-src)="https?://[^"]+"' /tmp/p.html | grep -viE 'liveauroracams|jsdelivr|google|facebook|twitter|x\.com|instagram|youtube.com/@|gstatic|fonts|cloudflare' | sort -u | head -12
          done
