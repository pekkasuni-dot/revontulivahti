name: Tutkimus - stillkamerat (väliaikainen)
on:
  push:
    branches: ['kokeilu/**']
    paths: ['.github/kokeilu-probe.env']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Loput kuvaosoitteet
        run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) AuroraAwesome-research'
          img(){ printf '%s\n   ' "$1"; curl -sS -L -m 30 -A "$UA" -o /tmp/i -D /tmp/h -w 'HTTP %{http_code} %{content_type} %{size_download}B %{time_total}s' "$1" || true; printf ' | %s\n' "$(grep -i '^last-modified' /tmp/h | tail -1 | tr -d '\r')"; }
          echo "=== IRF firmamentkamera"; curl -sS -L -m 30 -A "$UA" https://www.irf.se/en/forskning/kago/firmamentkamera/ | grep -oiE '(src|href|data-src)="[^"]*(\.jpe?g|\.png|\.gif|\.mp4|allsky|keo)[^"]*"' | sort -u | head -20
          echo "=== Skibotn"; for n in 1 2 3 4; do curl -sS -L -m 30 https://fox.phys.uit.no/ASC/ASC01_img$n.html | grep -oiE '(src|href|content)="[^"]+"|url=[^"> ]+' | head -6; done
          curl -sS -L -m 30 http://tid.uio.no/plasma/allsky_camera/realtime/skn_allsky.html | grep -oiE '(src|href)="[^"]+"' | head -10
          echo "=== UAF cameraControl"; curl -sS -m 30 https://allsky.gi.alaska.edu/js/cameraControl.js | grep -oiE '.{0,80}(http|\.jpe?g|png|latest|/images/|sse|EventSource|url).{0,120}' | head -25
          curl -sS -m 30 https://allsky.gi.alaska.edu/js/local.js | grep -oiE '.{0,80}(http|\.jpe?g|png|latest|/images/|toolik|poker).{0,120}' | head -15
          echo "=== AuroraMAX js"; curl -sS -m 30 https://auroramax.com/static/js/main.07724260.js | grep -oiE '"https?://[^"]{5,140}"' | sort -u | head -25
          echo "=== Porjus nr kuvaukset"; curl -sS -L -m 30 https://uk.jokkmokk.jp/ | iconv -f shift_jis -t utf-8 2>/dev/null | tr '\n' ' ' | sed -e 's/<[^>]*>/ /g' | tr -s ' ' | grep -oiE '.{0,120}(camera|webcam|direction|north|copyright|©|mail).{0,120}' | head -12
          for n in 2 3 4 5; do img https://uk.jokkmokk.jp/photo/nr$n/latest_m.jpg; done
          echo "=== lisenssit"; for u in https://kho.unis.no/ https://www.ursa.fi/yhd/sirius/ https://starvisor.net/ https://www.nps.gov/aboutus/disclaimer.htm https://www.asc-csa.gc.ca/eng/terms.asp; do echo "-- $u"; curl -sS -L -m 30 -A "$UA" "$u" | tr '\n' ' ' | sed -e 's/<script[^<]*<\/script>//g; s/<[^>]*>/ /g' | tr -s ' ' | grep -oiE '.{0,80}(licen|copyright|©|public domain|creative commons|permission|may be used|reproduc).{0,200}' | head -4; done
