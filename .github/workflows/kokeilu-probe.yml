name: Tutkimus - stillkamerat (väliaikainen)
on:
  push:
    branches: ['kokeilu/**']
    paths: ['.github/kokeilu-probe.env']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Hakemisto (vain kameroiden löytämiseen)
        run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) AuroraAwesome-research'
          curl -sS -L -m 40 -A "$UA" -o /tmp/d.html -w '%{http_code} %{size_download}\n' https://liveauroracams.com/webcams/
          echo "=== otsikot ja tekstit"
          tr '\n' ' ' < /tmp/d.html | sed -e 's/<script[^<]*<\/script>//g; s/<style[^<]*<\/style>//g; s/<\/\(h[1-6]\|li\|p\|div\|a\)>/\n/g; s/<[^>]*>/ /g' | tr -s ' \t' | grep -v '^\s*$' | awk 'length>3 && length<200' | head -300
          echo "=== ulkoiset linkit"
          grep -oiE 'href="https?://[^"]+"' /tmp/d.html | grep -viE 'liveauroracams|google|facebook|twitter|instagram|cloudflare|gstatic|fonts' | sort | uniq -c | sort -rn | head -150
          echo "=== sisäiset kamerasivut"
          grep -oiE 'href="[^"]*(webcam|cam)[^"]*"' /tmp/d.html | sort -u | head -150
