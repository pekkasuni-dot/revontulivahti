# VÄLIAIKAINEN selvitys (2026-10-25): FMI:n editoitu ennuste (pal_skandinavia) Tänä yönä -lähiennusteeksi.
# Ei julkaise tuotantoon. Vertailukuva väliaikaiseen haaraan claude/sat-koehaku-kuvat. Viiveseuranta ~28 h
# (5 peräkkäistä jobia). Poistetaan ennen yhdistämistä.
name: MNWC-selvitys (väliaikainen)
on:
  push:
    branches: ['claude/**']
    paths: ['.github/mnwc-probe.env']
permissions:
  contents: write
jobs:
  analyysi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q -r requirements.txt && pip install -q matplotlib
      - run: python scripts/probe-edited.py
      - name: Kuvat väliaikaiseen haaraan
        run: |
          cd ed-out
          git init -q -b kuvat && git add *.png *.txt && git -c user.name=probe -c user.email=probe@example.invalid commit -qm kuvat
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" kuvat:claude/sat-koehaku-kuvat
  viive1:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: bash scripts/probe-edited-lag.sh 33
  viive2:
    needs: viive1
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: bash scripts/probe-edited-lag.sh 33
  viive3:
    needs: viive2
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: bash scripts/probe-edited-lag.sh 33
  viive4:
    needs: viive3
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: bash scripts/probe-edited-lag.sh 33
  viive5:
    needs: viive4
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: bash scripts/probe-edited-lag.sh 33
