name: NOAA SWPC -tiedostojen tarkistus

# Tilapäinen tutkimustyökalu (ei julkaise mitään). Käynnistyy, kun
# scripts/probe-noaa.py muuttuu kehityshaaralla.
on:
  push:
    branches: ['claude/**']
    paths: ['scripts/probe-noaa.py', '.github/workflows/noaa-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/probe-noaa.py
