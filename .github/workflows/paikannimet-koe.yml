name: Paikannimet tiilissä (väliaikainen koe)
# VÄLIAIKAINEN (2026-11-14): (1) miltä tiilitasolta kylien nimet ovat OpenFreeMapin tiilissä, (2) kuvat oikeilla
# tiilillä ennen/jälkeen orpohaaraan kuvat-paikannimet. Käynnistyy .github/paikannimet-koe.env-muutoksesta
# claude/**-haaralla. Ei julkaise tuotantoon. Poistetaan ennen yhdistämistä.
on:
  push:
    branches: ['claude/**']
    paths: ['.github/paikannimet-koe.env']
permissions:
  contents: write
jobs:
  koe:
    runs-on: ubuntu-24.04   # Playwright 1.56 ei tue ubuntu-latestia (26.04)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node scripts/paikannimet-koe.mjs
      - name: Kuvat oikeilla tiilillä
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node scripts/screenshots.mjs --sizes=390x844 --states=paikannimet --lang=fi
      - name: Kuvat orpohaaraan kuvat-paikannimet
        run: |
          set -e
          D=$(ls -d docs/kuvakaappaukset/*/ | tail -1)
          mkdir -p /tmp/k && cp "$D"/*paikannimet* /tmp/k/
          git config user.name "kuvabotti"; git config user.email "actions@users.noreply.github.com"
          git checkout --orphan kuvat-tmp && git rm -rfq . && cp /tmp/k/* . && git add -A
          git commit -qm "Paikannimet: kuvat oikeilla tiilillä" && git push -f origin HEAD:kuvat-paikannimet
