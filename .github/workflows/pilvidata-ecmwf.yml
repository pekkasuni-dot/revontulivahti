name: Päivitä pilvidata (ECMWF)

on:
  schedule:
    - cron: '12 1,7,13,19 * * *'   # 4× vrk ECMWF-malliajojen jälkeen (01, 07, 13, 19 UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pilvidata
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Asenna Python-riippuvuudet
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libeccodes-dev
          pip install ecmwf-opendata cfgrib xarray numpy

      - name: Hae pilviruudukko ECMWF:ltä
        run: python scripts/fetch-clouds.py

      - name: Committaa jos data muuttui
        run: |
          git config user.name "pilvibotti"
          git config user.email "actions@users.noreply.github.com"
          git add data/clouds-ecmwf.json
          if git diff --cached --quiet; then
            echo "Ei muutoksia."
            exit 0
          fi
          git commit -m "Pilvidata ECMWF $(date -u +'%Y-%m-%d %H:%M') UTC"
          # "pull --rebase" VASTA commitin jalkeen (ei ennen - likainen
          # tyohakemisto ennen committia rikkoo rebasen, ks. CLAUDE.md/
          # MUISTIO-pilviluku.md), + muutama uudelleenyritys ristikkaisen
          # kilpajuoksun varalta (toinen tyonkulku pushaa samaan aikaan).
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push epaonnistui (yritys $i/5), odotetaan ja yritetaan uudelleen..."
            sleep $((RANDOM % 10 + 3))
          done
          echo "Push epaonnistui kaikilla yrityksilla." >&2
          exit 1
