name: Päivitä pilvidata (ECMWF)

on:
  schedule:
    - cron: '12 1,7,13,19 * * *'   # 4× vrk ECMWF-malliajojen jälkeen (01, 07, 13, 19 UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pilvidata
  cancel-in-progress: true

# HUOM (2026-10, korjattu repon kasvu): data EI enää committoidu
# main-haaraan - main kasvoi ~300 Mt:iin, ja HARMONIEn aluelaajennus
# olisi moninkertaistanut paivavauhdin (ks. CLAUDE.md/MUISTIO-korkeudet-
# tuuli.md). "fetch"-job hakee datan ja tallentaa sen artifactiksi;
# "publish"-job julkaisee sen gh-pages-haaraan YHTENA tiivistettyna
# committina (ks. .github/actions/publish-pages) - main pysyy jatkossa
# PUHTAANA sovelluskoodista, gh-pages EI KOSKAAN kasva kokoaan.
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Asenna Python-riippuvuudet
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libeccodes-dev
          pip install ecmwf-opendata cfgrib xarray numpy

      - name: Hae pilviruudukko ECMWF:ltä
        run: python scripts/fetch-clouds.py

      - name: Tallenna data artifactiksi (julkaistaan alla)
        uses: actions/upload-artifact@v4
        with:
          name: clouds-ecmwf
          path: data/clouds-ecmwf*.json
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: fetch
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: clouds-ecmwf
          path: fetched
      - uses: ./.github/actions/publish-pages
        with:
          label: 'Pilvidata ECMWF'
          data-source-dir: fetched
