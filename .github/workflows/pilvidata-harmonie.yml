name: Päivitä pilvidata (HARMONIE)

on:
  schedule:
    # FMI:n oma dokumentaatio (DescribeStoredQueries) kertoo HARMONIEn
    # paivittyvan "every 6 hours", mutta rajapinnassa EI ole origintime-
    # parametria (toisin kuin DWD:lla) eika julkista ajohakemistolistausta -
    # julkaisuviivetta EI pystytty todentamaan yhta tarkasti kuin ICON-EU:lle
    # (ks. CLAUDE.md/MUISTIO). Sen sijaan etta ajoitus ARVATTAISIIN, haku-
    # tiheys nostettiin 6h->3h: rajapinta palauttaa AINA sen hetken
    # tuoreimman saatavilla olevan ajon automaattisesti, joten useammin
    # kysyminen takaa etta data on enintaan ~3h vanhaa riippumatta
    # todellisesta ajo-/julkaisusyklista - ei vaadi tarkkaa ajoitusta.
    - cron: '25 2,5,8,11,14,17,20,23 * * *'
  workflow_dispatch:

# Oikeudet (2026-10-22, KATSELMOINTI 3.1): työnkulun tasolla vain luku;
# kirjoitus vain publish-jobille (sen oma permissions-lohko).
permissions:
  contents: read

concurrency:
  group: pilvidata-harmonie
  cancel-in-progress: true

# HUOM (2026-10, korjattu repon kasvu, ks. pilvidata-ecmwf.yml:n
# vastaava kommentti): data julkaistaan gh-pages-haaraan tiivistettyna,
# EI committoida main:iin. Erityisen tarkeaa taalla - HARMONIEn
# aluelaajennus (koko Skandinavia, ks. model_areas.py) kasvatti
# tiedostokokoa ~4,8x, joka main-committina olisi tayttanyt repon
# paivissa.
jobs:
  fetch:
    runs-on: ubuntu-latest
    # Aikaraja (KATSELMOINTI): jumittunut haku ei pysäytä päivityksiä tunneiksi,
    # ja aikakatkaisu = failure -> publish julkaisee onnistuneet osat.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # haku ei tarvitse tokenia (KATSELMOINTI 3.1)

      - name: Asenna Python-riippuvuudet
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libeccodes-dev
          pip install --require-hashes -r requirements.txt   # lukitut versiot + tiivisteet (requirements.in)
      - name: Hae pilviruudukko Ilmatieteenlaitokselta (HARMONIE)
        run: python3 scripts/fetch-clouds-harmonie.py

      - name: Tallenna data artifactiksi (julkaistaan alla)
        uses: actions/upload-artifact@v4
        with:
          name: clouds-harmonie
          path: |
            data/clouds-harmonie-meta.json
            data/clouds-harmonie-step*.json
          retention-days: 1
          if-no-files-found: ignore   # keskeneräinen mallinajo -> ei tiedostoja, ei julkaisua (run_guard.py)

  publish:
    needs: fetch
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true   # ei artifactia = keskeneräinen ajo, julkaisu ohitetaan (publish-pages)
        with:
          name: clouds-harmonie
          path: fetched
      - uses: ./.github/actions/publish-pages
        with:
          label: 'Pilvidata HARMONIE'
          data-source-dir: fetched
