name: Päivitä pilvidata (ICON-EU)

on:
  schedule:
    # DWD julkaisee ICON-EU:n 8x vrk (00,03,06,...,21 UTC), ~2,5-3 h viiveella.
    # Skripti etsii itse viimeisimman julkaistun ajon, joten ajoitus ei ole kriittinen.
    - cron: '10 3,6,9,12,15,18,21,0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pilvidata-icon_eu
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Asenna Python-riippuvuudet
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libeccodes-dev
          pip install cfgrib xarray numpy

      - name: Hae pilviruudukko DWD:n avoimesta datasta (ICON-EU)
        run: python3 scripts/fetch-clouds-icon_eu.py

      - name: Committaa jos data muuttui
        run: |
          git config user.name "pilvibotti"
          git config user.email "actions@users.noreply.github.com"
          git add data/clouds-icon_eu.json
          if git diff --cached --quiet; then
            echo "Ei muutoksia."
          else
            git commit -m "Pilvidata ICON-EU $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
