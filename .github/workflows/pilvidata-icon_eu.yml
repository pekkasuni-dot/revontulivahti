name: Päivitä pilvidata (ICON-EU)

on:
  schedule:
    # DWD julkaisee ICON-EU:n 8x vrk (00,03,06,...,21 UTC). Julkaisuviive
    # TODENNETTU hakemistolistauksen aikaleimoista (5 eri ajoa): ~2 h 40-45 min
    # ajon jalkeen, johdonmukaisesti. Edellinen ajoitus (:10 minuutin kohdalla,
    # heti 3h-rajan jalkeen) osui AINA liian aikaisin - uusin ajo ei ollut viela
    # julkaistu, joten skripti kaytti systemaattisesti edellista (3h vanhempaa)
    # ajoa. :55 (2 h 55 min rajan jalkeen, 10-15 min turvamarginaali
    # julkaisuviiveen paalle) osuu aina JUURI julkaistun ajon jalkeen.
    - cron: '55 2,5,8,11,14,17,20,23 * * *'
  workflow_dispatch:

# Oikeudet (2026-10-22, KATSELMOINTI 3.1): työnkulun tasolla vain luku;
# kirjoitus vain publish-jobille (sen oma permissions-lohko).
permissions:
  contents: read

concurrency:
  group: pilvidata-icon_eu
  cancel-in-progress: true

# HUOM (2026-10, korjattu repon kasvu, ks. pilvidata-ecmwf.yml:n
# vastaava kommentti): data julkaistaan gh-pages-haaraan tiivistettyna,
# EI committoida main:iin.
jobs:
  fetch:
    runs-on: ubuntu-latest
    # Aikaraja (KATSELMOINTI): jumittunut haku ei pysäytä päivityksiä tunneiksi,
    # ja aikakatkaisu = failure -> publish julkaisee onnistuneet osat.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # haku ei tarvitse tokenia (KATSELMOINTI 3.1)

      - name: Asenna Python-riippuvuudet
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libeccodes-dev
          pip install --require-hashes -r requirements.txt   # lukitut versiot + tiivisteet (requirements.in)
      - name: Hae pilviruudukko DWD:n avoimesta datasta (ICON-EU)
        run: python3 scripts/fetch-clouds-icon_eu.py

      - name: Tallenna data artifactiksi (julkaistaan alla)
        uses: actions/upload-artifact@v4
        with:
          name: clouds-icon_eu
          path: |
            data/clouds-icon_eu-meta.json
            data/clouds-icon_eu-step*.json
          retention-days: 1
          if-no-files-found: ignore   # keskeneräinen mallinajo -> ei tiedostoja, ei julkaisua (run_guard.py)

  publish:
    needs: fetch
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true   # ei artifactia = keskeneräinen ajo, julkaisu ohitetaan (publish-pages)
        with:
          name: clouds-icon_eu
          path: fetched
      - uses: ./.github/actions/publish-pages
        with:
          label: 'Pilvidata ICON-EU'
          data-source-dir: fetched
