name: 7 vrk -tutkimus (väliaikainen, ei julkaise)

# Väliaikainen (2026-10, haara claude/7vrk): NOAA 27 vrk -ennusteen muoto ja
# CORS, mallien todelliset ennustepituudet ja fetch-ecmwf-7d.py:n kuivaharjoitus.
# Poistetaan ennen yhdistämistä.
on:
  push:
    branches: ['claude/**']
    paths: ['.github/probe-7vrk.env']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: NOAA 27 vrk
        run: |
          for u in https://services.swpc.noaa.gov/text/27-day-outlook.txt \
                   https://services.swpc.noaa.gov/json/27-day-outlook.json \
                   https://services.swpc.noaa.gov/products/27-day-outlook.json \
                   https://services.swpc.noaa.gov/products/noaa-planetary-k-index-forecast.json; do
            echo "=== $u"; curl -sS -D - -o body.txt -H 'Origin: https://pekkasuni-dot.github.io' "$u" | grep -i -E '^HTTP|access-control|content-type|last-modified' || true
            head -c 2500 body.txt; echo; tail -c 600 body.txt; echo
          done
      - name: ICON-EU horisontti
        run: |
          for r in 00 03 06 09 12 15 18 21; do
            curl -s https://opendata.dwd.de/weather/nwp/icon-eu/grib/$r/clct/ > l.html
            n=$(grep -o '_[0-9]\{3\}_CLCT' l.html | grep -o '[0-9]\{3\}' | sort -n | tail -1)
            echo "ajo $r: suurin askel $n h, tiedostoja $(grep -c 'CLCT' l.html)"; grep -o 'href="[^"]*"' l.html | sed -n '5p'
          done
      - name: HARMONIE horisontti
        run: |
          S=$(date -u +%Y-%m-%dT%H:00:00Z); E=$(date -u -d '+150 hours' +%Y-%m-%dT%H:00:00Z)
          curl -s "https://opendata.fmi.fi/wfs?service=WFS&version=2.0.0&request=getFeature&storedquery_id=fmi::forecast::harmonie::surface::point::simple&latlon=65.0,25.5&parameters=TotalCloudCover&starttime=$S&endtime=$E&timestep=60" > h.xml
          grep -o '<BsWfs:Time>[^<]*' h.xml | sed 's/<BsWfs:Time>//' | sort | sed -n '1p;$p'
          grep -c '<BsWfs:Time>' h.xml || true
          grep -o '<BsWfs:ParameterValue>[^<]*' h.xml | sed 's/.*>//' | tr '\n' ' ' | tail -c 800; echo
          curl -s "https://opendata.fmi.fi/wfs?service=WFS&version=2.0.0&request=describeStoredQueries&storedquery_id=fmi::forecast::harmonie::surface::grid" | head -c 1500
  ecmwf:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y libeccodes-dev
          pip install ecmwf-opendata cfgrib xarray numpy
      - run: python scripts/fetch-ecmwf-7d.py
      - name: Näyte (Oulu, ruutu 4-22)
        run: |
          ls data/e7d-*.json | wc -l; du -ch data/e7d-*.json | tail -1; ls -la data/e7d-4-22.json
          python3 - <<'PY'
          import json, base64, numpy as np, datetime
          T = json.load(open('data/e7d-4-22.json'))
          n = T['n']; S = len(T['times'])
          g = lambda k: np.frombuffer(base64.b64decode(T[k]), np.uint8).reshape(S, n, n)
          tcc, t2m, ws = g('tcc'), g('t2m'), g('ws')
          print('lat0', T['lat0'], 'lon0', T['lon0'], 'run', datetime.datetime.utcfromtimestamp(T['run']/1000))
          i, j = round((65.0-T['lat0'])/0.25), round((25.5-T['lon0'])/0.25)
          for s in range(0, S, 4):
              print(datetime.datetime.utcfromtimestamp(T['times'][s]/1000), tcc[s,i,j], t2m[s,i,j]/2-60, ws[s,i,j]/4)
          PY
