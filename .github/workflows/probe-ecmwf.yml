# VÄLIAIKAINEN koehaku: ECMWF:n pilvikerrokset (lcc/mcc/hcc). Ei julkaise mitään.
# Poistetaan ennen yhdistämistä.
name: Koehaku ECMWF-kerrokset
on:
  push:
    branches: ['claude/**']
    paths: ['.github/probe-ecmwf.env']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y libeccodes-dev
          pip install --require-hashes -r requirements.txt
      - run: python .github/probe-ecmwf/probe.py
