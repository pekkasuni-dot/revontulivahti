name: probe-kp
on:
  push:
    branches: ['claude/**']
    paths: ['.github/probe-kp.env']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in json/planetary_k_index_1m.json products/noaa-planetary-k-index.json products/noaa-planetary-k-index-forecast.json; do
            echo "=== $u"
            curl -sS -D - -o body.json -H 'Origin: https://pekkasuni-dot.github.io' "https://services.swpc.noaa.gov/$u" | grep -iE 'HTTP/|access-control|last-modified|cache-control'
            python3 - <<'PY'
          import json
          d=json.load(open('body.json'))
          print('len',len(d))
          print('first',json.dumps(d[:2]))
          print('last',json.dumps(d[-12:]))
          PY
          done
