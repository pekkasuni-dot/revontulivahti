name: probe-load
on:
  push:
    branches: ['claude/**']
    paths: ['.github/probe-load.env']
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: |
          cd .github/probe-load && npm init -y >/dev/null && npm i playwright@1.56.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          node measure.mjs
      - uses: actions/upload-artifact@v4
        with: {name: mittaus, path: .github/probe-load/mittaus.json}
