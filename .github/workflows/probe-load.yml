name: probe-load
on:
  push:
    branches: ['claude/**']
    paths: ['.github/probe-load.env']
permissions:
  contents: write
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Haaran sovellus + julkaistu data paikalliseksi palvelimeksi
        run: |
          git fetch --depth=1 origin gh-pages
          git checkout origin/gh-pages -- data
          (python3 .github/probe-load/serve.py >/dev/null 2>&1 &)
          sleep 1; curl -sI http://localhost:8080/index.html | head -1
      - name: Asennus
        run: |
          cd .github/probe-load && npm init -y >/dev/null && npm i playwright@1.56.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          pip install pillow >/dev/null
      - name: Kirjaston CDN-tarkistus
        run: |
          for u in https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/3.6.2/maplibre-gl.min.js https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/3.6.2/maplibre-gl.js https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js; do
            echo "== $u"; curl -sSL -D - -o lib.tmp "$u" | grep -iE '^HTTP|content-type' ; sha256sum lib.tmp; done
          sha256sum lib/maplibre-gl.js
      - name: Mittaus (julkaistu vs. haara)
        run: cd .github/probe-load && NODE_PATH=$PWD/node_modules node measure.mjs
      - name: Varjostusvertailu
        if: ${{ false }}
        run: |
          NODE_PATH=$PWD/.github/probe-load/node_modules node .github/probe-load/hillshade.mjs
          python3 .github/probe-load/compose.py
      - name: Kuvat haaraan claude/latausnopeus-kuvat
        if: ${{ false }}
        run: |
          mkdir -p /tmp/kuvat && cp hsout/*.png hs/tulokset.json /tmp/kuvat/ 2>/dev/null || true
          git config user.name "probe"; git config user.email "probe@users.noreply.github.com"
          git checkout --orphan kuvat-tmp && git rm -rfq . && cp /tmp/kuvat/* . && git add -A && git commit -qm "Varjostusvertailu" && git push -f origin HEAD:claude/latausnopeus-kuvat
