# VÄLIAIKAINEN (poistetaan ennen yhdistämistä): publish-pages tyhjällä
# datakansiolla = keskeneräinen mallinajo -> ei julkaisua, ei virhettä.
name: Tutkimus tyhjä julkaisu
on:
  push:
    branches: ['claude/**']
    paths: ['.github/probe-tyhja.env']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ei-olemassa
          path: fetched
      - uses: ./.github/actions/publish-pages
        with:
          label: 'Tutkimus'
          data-source-dir: fetched
      - run: echo "Julkaisuaskel päättyi onnistuneesti ilman julkaisua"
