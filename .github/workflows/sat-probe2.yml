# VÄLIAIKAINEN selvitys (2026-10-25): MTG FCI L2 -pilvimaski Data Storessa, MET Norway thredds, datapolitiikka.
# Ei julkaise mitään. Poistetaan ennen yhdistämistä.
name: Satelliittiselvitys 2 (väliaikainen)
on:
  push:
    branches: ['claude/**']
    paths: ['.github/sat-probe2.env']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Selvitys
        run: bash scripts/probe-satellite2.sh
