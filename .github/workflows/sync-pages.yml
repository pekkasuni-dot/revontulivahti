name: Synkkaa sovelluskoodi GitHub Pagesille

# Jokainen data-tyonkulku (pilvidata-*/wind-*/camera-status) synkkaa
# sovelluskoodin (index.html/i18n.js/sw.js/manifest/icons/cameras.json)
# gh-pages-haaraan OMALLA julkaisullaan (ks. .github/actions/
# publish-pages), joten koodimuutos nakyy viimeistaan seuraavan
# fetch-ajon yhteydessa (pahimmillaan ~3 h, camera-status ajaa 10 min
# valein). Tama tyonkulku nopeuttaa sen HETI kun koodia pushataan
# main:iin - ei ODOTA seuraavaa cronia.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'i18n.js'
      - 'aurora-core.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icons/**'
      - 'lib/**'
      - 'fonts/**'
      - 'embed/**'
      - 'data/cameras.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' }}   # julkaisu vain mainista (2026-10-23)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/publish-pages
        with:
          label: 'Sovelluskoodin synkkaus'
