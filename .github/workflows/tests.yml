name: Testit

# Yksikkötestit (aurora-core.js, hälytykset, hakuskriptien run_guard.py) ja käännösavainten tarkistus
# jokaiselle haaralle ja PR:lle (2026-10-22, KATSELMOINTI osa 2). Node +
# Python-paketit lukittuina (requirements.txt; hilan harvennuksen testi tarvitsee numpyn).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Yksikkötestit
        run: node --test "tests/*.test.mjs"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Python-paketit (lukitut versiot + tiivisteet)
        run: pip install --require-hashes -r requirements.txt
      - name: Hakuskriptien testit (keskeneräinen mallinajo, hilan harvennus)
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
      - name: Käännösavaimet
        run: node scripts/check-i18n.mjs
