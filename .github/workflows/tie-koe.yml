# VÄLIAIKAINEN (2026-11-14): lähimmän tien haku oikeilla OpenFreeMap-tiilillä. Poistetaan ennen yhdistämistä.
name: tie-koe
on:
  push:
    branches: ['claude/**']
    paths: ['.github/tie-koe.env']
permissions:
  contents: read
jobs:
  koe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node scripts/tie-koe.mjs
