name: Päivitä tuulidata (ECMWF)

on:
  schedule:
    # Sama ajoitus kuin pilvidata-ecmwf.yml - tuuli ja pilvet SAMASTA
    # ECMWF-ajosta (ks. CLAUDE.md "mallinvalitsin koskee kaikkia tasoja").
    - cron: '17 1,7,13,19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wind-ecmwf
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Asenna Python-riippuvuudet
        run: |
          pip install ecmwf-opendata cfgrib xarray numpy

      - name: Hae tuuli ECMWF:ltä (kaikki 4 korkeutta, 2 hakua)
        run: python3 scripts/fetch-wind-ecmwf.py

      - name: Committaa jos data muuttui
        run: |
          git config user.name "pilvibotti"
          git config user.email "actions@users.noreply.github.com"
          git add data/wind-ecmwf-surface.json data/wind-ecmwf-850.json data/wind-ecmwf-500.json data/wind-ecmwf-300.json
          if git diff --cached --quiet; then
            echo "Ei muutoksia."
            exit 0
          fi
          git commit -m "Tuulidata ECMWF $(date -u +'%Y-%m-%d %H:%M') UTC"
          # HUOM (2026-10, korjattu kilpajuoksu): "pull --rebase" TAYTYY
          # ajaa VASTA commitin jalkeen, EI ennen - ennen committia
          # tyohakemisto on "likainen" (fetch-skripti on juuri muuttanut
          # tiedostoja, ei vielä committoitu), ja "git pull --rebase"
          # ilman committia epaonnistuu "cannot pull with rebase: you
          # have unstaged changes" - virhe nielaistiin aiemmin "|| true"
          # -k:lla, jolloin push yritettiin SILTI vanhentuneen paikallisen
          # haaran paalta ja hylattiin non-fast-forward-virheella (todettu
          # oikeasti: ks. CLAUDE.md/MUISTIO). Uudelleenyritys muutaman
          # kerran kattaa harvinaisemman RISTIKKAISEN kilpajuoksun (toinen
          # tyonkulku pushaa juuri commit/pull/push-valissa).
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push epaonnistui (yritys $i/5), odotetaan ja yritetaan uudelleen..."
            sleep $((RANDOM % 10 + 3))
          done
          echo "Push epaonnistui kaikilla yrityksilla." >&2
          exit 1
