name: Päivitä tuulidata (ECMWF)

on:
  schedule:
    # Sama ajoitus kuin pilvidata-ecmwf.yml - tuuli ja pilvet SAMASTA
    # ECMWF-ajosta (ks. CLAUDE.md "mallinvalitsin koskee kaikkia tasoja").
    # VARAJASTUS (2026-10-23): pääajastin on Cloudflare Worker (workers/ajastin,
    # aikataulu schedule.js). Tämä harvennettu cron ajaa vain, jos ajastin ei ole
    # käynnistänyt työnkulkua 540 min sisällä (job vahti) -> ei tuplia.
    - cron: '17 1,13 * * *'
  workflow_dispatch:

# Oikeudet (2026-10-22, KATSELMOINTI 3.1): työnkulun tasolla vain luku;
# kirjoitus vain publish-jobille (sen oma permissions-lohko).
permissions:
  contents: read

concurrency:
  group: wind-ecmwf
  cancel-in-progress: false   # 2026-10-23: varaajo ei saa keskeyttää ajastimen ajoa (jää jonoon, vahti ohittaa)

# HUOM (2026-10, korjattu repon kasvu, ks. pilvidata-ecmwf.yml:n
# vastaava kommentti): data julkaistaan gh-pages-haaraan tiivistettyna,
# EI committoida main:iin.
jobs:
  # Varajastuksen vahti (vain schedule): ohittaa ajon, jos Cloudflare-ajastin
  # käynnisti työnkulun viimeisen 540 min aikana (.github/actions/ajastin-vahti).
  vahti:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.v.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions/ajastin-vahti
          persist-credentials: false
      - id: v
        uses: ./.github/actions/ajastin-vahti
        with:
          max-age-min: '540'

  fetch:
    needs: vahti
    if: ${{ !cancelled() && needs.vahti.outputs.run != 'false' }}   # vahti ohitettu (ei schedule) tai epäonnistui -> ajetaan
    runs-on: ubuntu-latest
    # Aikaraja (KATSELMOINTI): jumittunut haku ei pysäytä päivityksiä tunneiksi,
    # ja aikakatkaisu = failure -> publish julkaisee onnistuneet osat.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # haku ei tarvitse tokenia (KATSELMOINTI 3.1)

      - name: Asenna Python-riippuvuudet
        run: |
          pip install --require-hashes -r requirements.txt   # lukitut versiot + tiivisteet (requirements.in)
      - name: Hae tuuli ECMWF:ltä (kaikki 4 korkeutta, 2 hakua)
        run: python3 scripts/fetch-wind-ecmwf.py

      - name: Tallenna data artifactiksi (julkaistaan alla)
        uses: actions/upload-artifact@v4
        with:
          name: wind-ecmwf
          path: data/wind-ecmwf-*.json
          retention-days: ${{ github.ref == 'refs/heads/main' && 1 || 7 }}   # haara-ajo: vertailuun 7 vrk
          if-no-files-found: ignore   # keskeneräinen mallinajo -> ei tiedostoja, ei julkaisua (run_guard.py)

  publish:
    needs: fetch
    # Julkaisu VAIN mainista (2026-10-23): haaralta ajettaessa data jää
    # fetch-jobin artefaktiksi (7 vrk) vertailua varten, gh-pages ennallaan.
    if: ${{ !cancelled() && needs.fetch.result != 'skipped' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true   # ei artifactia = keskeneräinen ajo, julkaisu ohitetaan (publish-pages)
        with:
          name: wind-ecmwf
          path: fetched
      - uses: ./.github/actions/publish-pages
        with:
          label: 'Tuulidata ECMWF'
          data-source-dir: fetched
