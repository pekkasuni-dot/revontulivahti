name: Päivitä tuulidata (ECMWF)

on:
  schedule:
    # Sama ajoitus kuin pilvidata-ecmwf.yml - tuuli ja pilvet SAMASTA
    # ECMWF-ajosta (ks. CLAUDE.md "mallinvalitsin koskee kaikkia tasoja").
    - cron: '17 1,7,13,19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wind-ecmwf
  cancel-in-progress: true

# HUOM (2026-10, korjattu repon kasvu, ks. pilvidata-ecmwf.yml:n
# vastaava kommentti): data julkaistaan gh-pages-haaraan tiivistettyna,
# EI committoida main:iin.
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Asenna Python-riippuvuudet
        run: |
          pip install ecmwf-opendata cfgrib xarray numpy

      - name: Hae tuuli ECMWF:ltä (kaikki 4 korkeutta, 2 hakua)
        run: python3 scripts/fetch-wind-ecmwf.py

      - name: Tallenna data artifactiksi (julkaistaan alla)
        uses: actions/upload-artifact@v4
        with:
          name: wind-ecmwf
          path: |
            data/wind-ecmwf-surface.json
            data/wind-ecmwf-850.json
            data/wind-ecmwf-500.json
            data/wind-ecmwf-300.json
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: fetch
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wind-ecmwf
          path: fetched
      - uses: ./.github/actions/publish-pages
        with:
          label: 'Tuulidata ECMWF'
          data-source-dir: fetched
