name: Päivitä tuulidata (HARMONIE)

on:
  schedule:
    # Sama hakutiheys/perustelu kuin pilvidata-harmonie.yml:ssa (tuuli ja
    # pilvet SAMASTA mallista, ks. CLAUDE.md) - 3h valein koska julkaisu-
    # viivetta ei voida mitata tarkasti.
    - cron: '35 2,5,8,11,14,17,20,23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wind-harmonie
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        level: [surface, "850", "500", "300"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Asenna Python-riippuvuudet
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libeccodes-dev
          pip install cfgrib xarray numpy

      - name: Hae tuuli (${{ matrix.level }})
        run: python3 scripts/fetch-wind-harmonie.py ${{ matrix.level }}

      # HUOM (2026-10, korjattu kilpajuoksu - sama kuin wind-icon_eu.yml):
      # 4 matrix-jobia EIVÄT enää julkaise itse, vain tallentavat oman
      # tasonsa artifactiksi. "publish"-job alla kokoaa ja julkaisee
      # YHDEN tiivistetyn gh-pages-commitin - todellinen tuotannossa
      # havaittu virhe ("cannot pull with rebase: you have unstaged
      # changes" + "remote rejected ... cannot lock ref") johtui tasta
      # samasta 4-suuntaisesta sisaisesta kilpajuoksusta. Resoluutio
      # HARVENNETTU STRIDE=4:aan (~10 km, oli 2/~5 km) samassa
      # yhteydessa kuin alueen laajennus Skandinaviaan - ks.
      # fetch-wind-harmonie.py:n docstring "RESOLUUTIO".
      - name: Tallenna data artifactiksi (julkaistaan kootusti alla)
        uses: actions/upload-artifact@v4
        with:
          name: wind-harmonie-${{ matrix.level }}
          path: |
            data/wind-harmonie-${{ matrix.level }}-meta.json
            data/wind-harmonie-${{ matrix.level }}-step*.json
          retention-days: 1
          if-no-files-found: ignore

  publish:
    needs: fetch
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Lataa kaikkien tasojen data
        uses: actions/download-artifact@v4
        with:
          pattern: wind-harmonie-*
          path: fetched
          merge-multiple: true

      - uses: ./.github/actions/publish-pages
        with:
          label: 'Tuulidata HARMONIE'
          data-source-dir: fetched
