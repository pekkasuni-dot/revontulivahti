name: Päivitä tuulidata (HARMONIE)

on:
  schedule:
    # Sama hakutiheys/perustelu kuin pilvidata-harmonie.yml:ssa (tuuli ja
    # pilvet SAMASTA mallista, ks. CLAUDE.md) - 3h valein koska julkaisu-
    # viivetta ei voida mitata tarkasti.
    - cron: '35 2,5,8,11,14,17,20,23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wind-harmonie
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        level: [surface, "850", "500", "300"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Asenna Python-riippuvuudet
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libeccodes-dev
          pip install cfgrib xarray numpy

      - name: Hae tuuli (${{ matrix.level }})
        run: python3 scripts/fetch-wind-harmonie.py ${{ matrix.level }}

      # HUOM (2026-10, korjattu kilpajuoksu - sama kuin wind-icon_eu.yml):
      # 4 matrix-jobia EIVÄT enää committaa/pushaa itse, vain tallentavat
      # oman tasonsa artifactiksi. "commit"-job alla kokoaa ja tekee YHDEN
      # commitin/pushin - todellinen tuotannossa havaittu virhe
      # ("cannot pull with rebase: you have unstaged changes" + "remote
      # rejected ... cannot lock ref") johtui tasta samasta 4-suuntaisesta
      # sisaisesta kilpajuoksusta.
      - name: Tallenna data artifactiksi (committoidaan kootusti alla)
        uses: actions/upload-artifact@v4
        with:
          name: wind-harmonie-${{ matrix.level }}
          path: |
            data/wind-harmonie-${{ matrix.level }}-meta.json
            data/wind-harmonie-${{ matrix.level }}-step*.json
          retention-days: 1
          if-no-files-found: ignore

  commit:
    needs: fetch
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lataa kaikkien tasojen data
        uses: actions/download-artifact@v4
        with:
          pattern: wind-harmonie-*
          path: data
          merge-multiple: true

      - name: Committaa jos data muuttui (YKSI commit/push kaikille tasoille)
        run: |
          git config user.name "pilvibotti"
          git config user.email "actions@users.noreply.github.com"
          git add data/wind-harmonie-*-meta.json data/wind-harmonie-*-step*.json
          if git diff --cached --quiet; then
            echo "Ei muutoksia."
            exit 0
          fi
          git commit -m "Tuulidata HARMONIE $(date -u +'%Y-%m-%d %H:%M') UTC"
          # "pull --rebase" VASTA commitin jalkeen - tama job EI enaa
          # kilpaile itsensa kanssa (vain 1 push/ajo), mutta voi yha
          # tormata ristikkain pilvidata-harmonie/camera-status-tyonkulkuihin.
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push epaonnistui (yritys $i/5), odotetaan ja yritetaan uudelleen..."
            sleep $((RANDOM % 10 + 3))
          done
          echo "Push epaonnistui kaikilla yrityksilla." >&2
          exit 1
