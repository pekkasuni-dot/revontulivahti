name: Päivitä tuulidata (HARMONIE)

on:
  schedule:
    # Sama hakutiheys/perustelu kuin pilvidata-harmonie.yml:ssa (tuuli ja
    # pilvet SAMASTA mallista, ks. CLAUDE.md) - 3h valein koska julkaisu-
    # viivetta ei voida mitata tarkasti.
    # VARAJASTUS (2026-10-23): pääajastin on Cloudflare Worker (workers/ajastin,
    # aikataulu schedule.js). Tämä cron (ennallaan, harvennetaan kun ajastin on
    # toiminut >= 3 vrk) ajaa vain, jos ajastin ei ole käynnistänyt työnkulkua
    # 270 min sisällä (job vahti) -> ei tuplia.
    - cron: '35 2,5,8,11,14,17,20,23 * * *'
  workflow_dispatch:

# Oikeudet (2026-10-22, KATSELMOINTI 3.1): työnkulun tasolla vain luku;
# kirjoitus vain publish-jobille (sen oma permissions-lohko).
permissions:
  contents: read

concurrency:
  group: wind-harmonie
  cancel-in-progress: false   # 2026-10-23: varaajo ei saa keskeyttää ajastimen ajoa (jää jonoon, vahti ohittaa)

jobs:
  # Varajastuksen vahti (vain schedule): ohittaa ajon, jos Cloudflare-ajastin
  # käynnisti työnkulun viimeisen 270 min aikana (.github/actions/ajastin-vahti).
  vahti:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.v.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions/ajastin-vahti
          persist-credentials: false
      - id: v
        uses: ./.github/actions/ajastin-vahti
        with:
          max-age-min: '270'

  fetch:
    needs: vahti
    if: ${{ !cancelled() && needs.vahti.outputs.run != 'false' }}   # vahti ohitettu (ei schedule) tai epäonnistui -> ajetaan
    runs-on: ubuntu-latest
    # Aikaraja (KATSELMOINTI): jumittunut haku ei pysäytä päivityksiä tunneiksi,
    # ja aikakatkaisu = failure -> publish julkaisee onnistuneet osat.
    timeout-minutes: 30
    strategy:
      matrix:
        level: [surface, "850", "500", "300"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # haku ei tarvitse tokenia (KATSELMOINTI 3.1)

      - name: Asenna Python-riippuvuudet
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libeccodes-dev
          pip install --require-hashes -r requirements.txt   # lukitut versiot + tiivisteet (requirements.in)
      - name: Hae tuuli (${{ matrix.level }})
        run: python3 scripts/fetch-wind-harmonie.py ${{ matrix.level }}

      # HUOM (2026-10, korjattu kilpajuoksu - sama kuin wind-icon_eu.yml):
      # 4 matrix-jobia EIVÄT enää julkaise itse, vain tallentavat oman
      # tasonsa artifactiksi. "publish"-job alla kokoaa ja julkaisee
      # YHDEN tiivistetyn gh-pages-commitin - todellinen tuotannossa
      # havaittu virhe ("cannot pull with rebase: you have unstaged
      # changes" + "remote rejected ... cannot lock ref") johtui tasta
      # samasta 4-suuntaisesta sisaisesta kilpajuoksusta. Resoluutio
      # HARVENNETTU STRIDE=4:aan (~10 km, oli 2/~5 km) samassa
      # yhteydessa kuin alueen laajennus Skandinaviaan - ks.
      # fetch-wind-harmonie.py:n docstring "RESOLUUTIO".
      - name: Tallenna data artifactiksi (julkaistaan kootusti alla)
        uses: actions/upload-artifact@v4
        with:
          name: wind-harmonie-${{ matrix.level }}
          path: |
            data/wind-harmonie-${{ matrix.level }}-meta.json
            data/wind-harmonie-${{ matrix.level }}-step*.json
          retention-days: ${{ github.ref == 'refs/heads/main' && 1 || 7 }}   # haara-ajo: vertailuun 7 vrk
          if-no-files-found: ignore

  publish:
    needs: fetch
    # Julkaisu VAIN mainista (2026-10-23): haaralta ajettaessa data jää
    # fetch-jobin artefaktiksi (7 vrk) vertailua varten, gh-pages ennallaan.
    if: ${{ !cancelled() && needs.fetch.result != 'skipped' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Lataa kaikkien tasojen data
        uses: actions/download-artifact@v4
        continue-on-error: true   # ei artifactia = keskeneräinen ajo, julkaisu ohitetaan (publish-pages)
        with:
          pattern: wind-harmonie-*
          path: fetched
          merge-multiple: true

      - uses: ./.github/actions/publish-pages
        with:
          label: 'Tuulidata HARMONIE'
          data-source-dir: fetched
