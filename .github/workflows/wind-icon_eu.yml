name: Päivitä tuulidata (ICON-EU)

on:
  schedule:
    # Sama ajoitus/perustelu kuin pilvidata-icon_eu.yml - tuuli ja pilvet
    # SAMASTA DWD-ajosta (ks. CLAUDE.md "mallinvalitsin koskee kaikkia tasoja").
    - cron: '58 2,5,8,11,14,17,20,23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wind-icon_eu
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        level: [surface, "850", "500", "300"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Asenna Python-riippuvuudet
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libeccodes-dev
          pip install cfgrib xarray numpy

      - name: Hae tuuli DWD:n avoimesta datasta (${{ matrix.level }})
        run: python3 scripts/fetch-wind-icon_eu.py ${{ matrix.level }}

      # HUOM (2026-10, korjattu kilpajuoksu): 4 matrix-jobia EIVÄT enää
      # committaa/pushaa itse - jokainen vain tallentaa oman tasonsa
      # datan artifactiksi. Aiemmin kaikki 4 pushasivat mainiin
      # RINNAKKAIN ("git pull --rebase" ennen committia + likainen
      # tyohakemisto -> rebase epaonnistui -> push hylattiin non-fast-
      # forward-virheella, todettu oikeasti tuotannossa). Yksi erillinen
      # "commit"-job alla kokoaa kaikki 4 artifactia ja tekee YHDEN
      # commitin/pushin - ei sisaista kilpajuoksua enaa lainkaan.
      - name: Tallenna data artifactiksi (committoidaan kootusti alla)
        uses: actions/upload-artifact@v4
        with:
          name: wind-icon_eu-${{ matrix.level }}
          path: |
            data/wind-icon_eu-${{ matrix.level }}-meta.json
            data/wind-icon_eu-${{ matrix.level }}-step*.json
          retention-days: 1
          if-no-files-found: ignore

  commit:
    needs: fetch
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lataa kaikkien tasojen data
        uses: actions/download-artifact@v4
        with:
          pattern: wind-icon_eu-*
          path: data
          merge-multiple: true

      - name: Committaa jos data muuttui (YKSI commit/push kaikille tasoille)
        run: |
          git config user.name "pilvibotti"
          git config user.email "actions@users.noreply.github.com"
          git add data/wind-icon_eu-*-meta.json data/wind-icon_eu-*-step*.json
          if git diff --cached --quiet; then
            echo "Ei muutoksia."
            exit 0
          fi
          git commit -m "Tuulidata ICON-EU $(date -u +'%Y-%m-%d %H:%M') UTC"
          # "pull --rebase" VASTA commitin jalkeen - tama job EI enaa
          # kilpaile itsensa kanssa (vain 1 push/ajo), mutta voi yha
          # tormata ristikkain pilvidata-icon_eu/camera-status-tyonkulkuihin.
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push epaonnistui (yritys $i/5), odotetaan ja yritetaan uudelleen..."
            sleep $((RANDOM % 10 + 3))
          done
          echo "Push epaonnistui kaikilla yrityksilla." >&2
          exit 1
