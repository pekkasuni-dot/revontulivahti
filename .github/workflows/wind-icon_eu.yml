name: Päivitä tuulidata (ICON-EU)

on:
  schedule:
    # Sama ajoitus/perustelu kuin pilvidata-icon_eu.yml - tuuli ja pilvet
    # SAMASTA DWD-ajosta (ks. CLAUDE.md "mallinvalitsin koskee kaikkia tasoja").
    # VARAJASTUS (2026-10-23): pääajastin on Cloudflare Worker (workers/ajastin,
    # aikataulu schedule.js). Tämä cron (harvennettu 2026-10-26: ajastin toiminut
    # luotettavasti 3 vrk, ks. OHJE-ajastin.md) ajaa vain, jos ajastin ei ole käynnistänyt työnkulkua
    # 270 min sisällä (job vahti) -> ei tuplia.
    - cron: '58 2,8,14,20 * * *'   # varalla 6 h
  workflow_dispatch:

# Oikeudet (2026-10-22, KATSELMOINTI 3.1): työnkulun tasolla vain luku;
# kirjoitus vain publish-jobille (sen oma permissions-lohko).
permissions:
  contents: read

concurrency:
  group: wind-icon_eu
  cancel-in-progress: false   # 2026-10-23: varaajo ei saa keskeyttää ajastimen ajoa (jää jonoon, vahti ohittaa)

jobs:
  # Varajastuksen vahti (vain schedule): ohittaa ajon, jos Cloudflare-ajastin
  # käynnisti työnkulun viimeisen 270 min aikana (.github/actions/ajastin-vahti).
  vahti:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.v.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions/ajastin-vahti
          persist-credentials: false
      - id: v
        uses: ./.github/actions/ajastin-vahti
        with:
          max-age-min: '270'

  fetch:
    needs: vahti
    if: ${{ !cancelled() && needs.vahti.outputs.run != 'false' }}   # vahti ohitettu (ei schedule) tai epäonnistui -> ajetaan
    runs-on: ubuntu-latest
    # Aikaraja (KATSELMOINTI): jumittunut haku ei pysäytä päivityksiä tunneiksi,
    # ja aikakatkaisu = failure -> publish julkaisee onnistuneet osat.
    timeout-minutes: 30
    strategy:
      matrix:
        level: [surface, "850", "500", "300"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # haku ei tarvitse tokenia (KATSELMOINTI 3.1)

      - name: Asenna Python-riippuvuudet
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libeccodes-dev
          pip install --require-hashes -r requirements.txt   # lukitut versiot + tiivisteet (requirements.in)
      - name: Hae tuuli DWD:n avoimesta datasta (${{ matrix.level }})
        run: python3 scripts/fetch-wind-icon_eu.py ${{ matrix.level }}

      # HUOM (2026-10, korjattu kilpajuoksu): 4 matrix-jobia EIVÄT enää
      # julkaise itse - jokainen vain tallentaa oman tasonsa datan
      # artifactiksi. Aiemmin kaikki 4 pushasivat mainiin RINNAKKAIN
      # ("git pull --rebase" ennen committia + likainen tyohakemisto ->
      # rebase epaonnistui -> push hylattiin non-fast-forward-virheella,
      # todettu oikeasti tuotannossa). Yksi erillinen "publish"-job alla
      # kokoaa kaikki 4 artifactia ja julkaisee YHDEN tiivistetyn
      # gh-pages-commitin - ei sisaista kilpajuoksua enaa lainkaan.
      - name: Tallenna data artifactiksi (julkaistaan kootusti alla)
        uses: actions/upload-artifact@v4
        with:
          name: wind-icon_eu-${{ matrix.level }}
          path: |
            data/wind-icon_eu-${{ matrix.level }}-meta.json
            data/wind-icon_eu-${{ matrix.level }}-step*.json
          retention-days: ${{ github.ref == 'refs/heads/main' && 1 || 7 }}   # haara-ajo: vertailuun 7 vrk
          if-no-files-found: ignore

  publish:
    needs: fetch
    # Julkaisu VAIN mainista (2026-10-23): haaralta ajettaessa data jää
    # fetch-jobin artefaktiksi (7 vrk) vertailua varten, gh-pages ennallaan.
    if: ${{ !cancelled() && needs.fetch.result != 'skipped' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Lataa kaikkien tasojen data
        uses: actions/download-artifact@v4
        continue-on-error: true   # ei artifactia = keskeneräinen ajo, julkaisu ohitetaan (publish-pages)
        with:
          pattern: wind-icon_eu-*
          path: fetched
          merge-multiple: true

      - uses: ./.github/actions/publish-pages
        with:
          label: 'Tuulidata ICON-EU'
          data-source-dir: fetched
