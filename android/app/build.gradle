apply plugin: 'com.android.application'

// Kehitysversio "Aurora Dev" (2026-11-01, OHJE-kaupat.md "Kehitysversio"): -PappDev=1 (android-dev.yml) ->
// tunniste fi.suni.auroraweather.dev, nimi "Aurora Dev", kuvake ic_launcher_dev (scripts/app-icons.mjs).
// Oma tunniste = oma sovellus ja tallennus kauppaversion rinnalla. Ilman ominaisuutta tuotanto ennallaan.
def appDev = project.findProperty('appDev') == '1'

android {
    namespace = "fi.suni.auroraweather"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "fi.suni.auroraweather"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Versio työnkulusta (android-aab.yml): -PappVersionCode=<ajon numero> -PappVersionName=<APP_VERSION>.
        versionCode((project.findProperty('appVersionCode') ?: '1') as Integer)
        versionName(project.findProperty('appVersionName') ?: '1.0')
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        if (appDev) applicationIdSuffix ".dev"
        manifestPlaceholders = [
            appLabel: appDev ? 'Aurora Dev' : '@string/app_name',
            appIcon: appDev ? '@mipmap/ic_launcher_dev' : '@mipmap/ic_launcher',
            appRoundIcon: appDev ? '@mipmap/ic_launcher_dev_round' : '@mipmap/ic_launcher_round'
        ]
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Latausavain (upload key) GitHubin salaisuuksista (android-aab.yml kirjoittaa keystoren
    // tiedostoon ajon ajaksi). Ilman avainta release-AAB jää allekirjoittamatta (koekäännös).
    signingConfigs {
        // Aurora Dev (2026-11-01): pysyvä allekirjoitus sivuasennettavalle Dev-APK:lle (aurora-dev.keystore repossa,
        // salasana "android" kuten Androidin debug-avaimessa - EI salaisuus, ei kauppaan). Sama avain joka ajossa ->
        // uusi Dev-APK asentuu vanhan päälle. Tuotannon latausavain ei koske tähän.
        dev {
            storeFile file('aurora-dev.keystore')
            storePassword 'android'
            keyAlias 'aurora-dev'
            keyPassword 'android'
        }
        release {
            def ks = System.getenv('ANDROID_KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            if (appDev) signingConfig signingConfigs.dev
        }
        release {
            if (System.getenv('ANDROID_KEYSTORE_FILE')) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Hälytykset (2026-11-10): AlertMessagingService laajentaa Firebase-lisäosan palvelua (FirebaseMessagingService,
    // RemoteMessage). Lisäosa tuo firebase-messagingin vain omaan moduuliinsa (implementation, ei api), joten
    // sovellusmoduuli tarvitsee sen itse. Versio = lisäosan oma (@capacitor-firebase/messaging android/build.gradle:
    // firebaseMessagingVersion, oletus 25.0.1) -> ei versioristiriitaa.
    implementation "com.google.firebase:firebase-messaging:${rootProject.ext.has('firebaseMessagingVersion') ? rootProject.ext.firebaseMessagingVersion : '25.0.1'}"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
