<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0A1224">
<title>Avaussivu – revontulikaaren testi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  AVAUSSIVUN REVONTULIKAARI – TESTISIVU (2026-10), EI KÄYTÖSSÄ SOVELLUKSESSA.
  Jokainen versio alkaa täsmälleen sovelluksen avaussivun näkymästä (#splash,
  index.html: sama tausta, logo, nimi ja OSM-maininta, samat --splash-*-arvot).
  Kaari syttyy ~0,5-1 s:ssa. Kevyt toteutus: yksi canvas 2D puolella
  resoluutiolla (pehmeys ilman blur-suodatinta), valmiiksi piirretty
  sädesprite + drawImage ~100 kertaa/kehys, ei suodattimia eikä varjoja.
  Versiot eroavat vain VARIANTS-taulukon arvoissa (nopeus, voimakkuus).
-->
<style>
  :root{
    --pal-base:#0A1224;--pal-text:#E9F1FF;
    --ink:var(--pal-text);
    --dim:color-mix(in srgb,var(--pal-text) 62%,var(--pal-base));
    --font-display:'Sora',system-ui,sans-serif;
    --font-body:'IBM Plex Sans',system-ui,sans-serif;
    /* SAMAT ARVOT KUIN index.html:n avaussivun säätövakiossa. */
    --splash-bg:#0A1224;--splash-logo:96px;--splash-logo-y:50%;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--splash-bg);overflow:hidden;font-family:var(--font-body);color:var(--ink);
    -webkit-tap-highlight-color:transparent;touch-action:manipulation}
  #splash{position:fixed;inset:0;background:var(--splash-bg)}
  #sky{position:absolute;inset:0;width:100%;height:100%;display:block}
  #splash .sp-center{position:absolute;left:50%;top:var(--splash-logo-y);
    transform:translate(-50%,calc(var(--splash-logo) / -2));display:flex;flex-direction:column;align-items:center}
  #splash .sp-logo{width:var(--splash-logo);height:var(--splash-logo);display:block}
  #splash .sp-name{margin-top:18px;font:700 22px var(--font-display);letter-spacing:.01em;color:var(--ink)}
  #splash .sp-osm{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 16px);
    text-align:center;font-size:11px;color:var(--dim)}
  /* Testiohjaimet (eivät kuulu avaussivuun). */
  #ctl{position:fixed;z-index:5;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 10px);
    display:flex;gap:6px;align-items:center;padding:4px;border-radius:999px;
    background:rgba(20,32,58,.85);border:1px solid rgba(233,241,255,.12)}
  #ctl button{min-height:36px;min-width:44px;padding:0 12px;border:0;border-radius:999px;background:none;
    color:var(--dim);font:600 13px var(--font-body);cursor:pointer;white-space:nowrap}
  #ctl button[aria-pressed="true"]{background:#5CC9A0;color:#0A1224}
  #ctl .replay{color:var(--ink)}
  #info{position:fixed;z-index:5;left:0;right:0;top:calc(env(safe-area-inset-top) + 58px);text-align:center;
    font-size:11.5px;color:var(--dim)}
</style>
</head>
<body>
<div id="splash">
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="sp-center">
    <svg class="sp-logo" viewBox="0 0 64 64" aria-hidden="true">
    <defs>
      <linearGradient id="spLogoB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2A1A66"/><stop offset="1" stop-color="#081128"/></linearGradient>
      <linearGradient id="spLogoR" gradientUnits="userSpaceOnUse" x1="0" y1="54" x2="0" y2="9"><stop offset="0" stop-color="#3DF5A2"/><stop offset=".55" stop-color="#3DF5A2"/><stop offset="1" stop-color="#FF4D6D"/></linearGradient>
    </defs>
    <rect width="64" height="64" rx="15" fill="url(#spLogoB)"/>
    <path d="M14 54C20 36 25 20 32 9" fill="none" stroke="url(#spLogoR)" stroke-width="8" stroke-linecap="round"/>
    <path d="M50 54C44 36 39 20 32 9" fill="none" stroke="url(#spLogoR)" stroke-width="8" stroke-linecap="round" opacity=".88"/>
    <path d="M32 31l2.4 5.6L40 39l-5.6 2.4L32 47l-2.4-5.6L24 39l5.6-2.4z" fill="#B794FF"/>
    <circle cx="50" cy="13" r="1.8" fill="#fff"/>
  </svg>
    <div class="sp-name">AuroraAwesome</div>
  </div>
  <div class="sp-osm">© OpenStreetMap contributors</div>
</div>
<div id="ctl" role="group" aria-label="Versio">
  <button type="button" data-v="a">A</button>
  <button type="button" data-v="b">B</button>
  <button type="button" data-v="c">C</button>
  <button type="button" class="replay" id="replay">↻ Toista</button>
</div>
<div id="info"></div>
<script>
'use strict';
// Versiot: speed = verhon sivuttaisliikkeen nopeus, intensity = värien
// voimakkuus (0-1), violet = yläosan violetin osuus, ignite = syttymisaika (s).
const VARIANTS = {
  a: {name: 'A – hiljainen',   speed: 0.35, intensity: 0.42, violet: 0.30, ignite: 1.0},
  b: {name: 'B – tasapaino',   speed: 0.65, intensity: 0.58, violet: 0.40, ignite: 0.8},
  c: {name: 'C – elävä',       speed: 1.05, intensity: 0.78, violet: 0.50, ignite: 0.6},
};
// Kaaren paikka ja muoto (osuuksina näytöstä): keskikohta logon yläpuolella.
const ARC = {centerY: 0.33, sag: 0.10, height: 0.20, rays: 110, stars: 14, scale: 0.5};

const cv = document.getElementById('sky'), ctx = cv.getContext('2d');
let W = 0, H = 0, sprite = null, stars = [], v = VARIANTS.b, t0 = 0, raf = 0;

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2) * ARC.scale;   // puolet resoluutiosta -> luonnollinen pehmeys
  W = Math.round(innerWidth * dpr); H = Math.round(innerHeight * dpr);
  cv.width = W; cv.height = H;
  buildSprite();
  stars = Array.from({length: ARC.stars}, (_, i) => ({
    x: (0.08 + 0.84 * ((i * 0.618) % 1)) * W,
    y: (0.06 + 0.32 * ((i * 0.377 + 0.13) % 1)) * H,
    r: Math.max(0.6, (0.5 + (i % 3) * 0.35) * dpr),
    ph: i * 1.7, sp: 0.6 + (i % 4) * 0.25,
  }));
}
// Yksi säde valmiiksi piirrettynä: alhaalta läpikuultava vihreä, ylös
// hento violetti, reunat häivytetty. Sävyt vaihtelevat versioittain.
function buildSprite(){
  const h = Math.max(32, Math.round(H * ARC.height)), w = 8;
  sprite = document.createElement('canvas'); sprite.width = w; sprite.height = h;
  const g = sprite.getContext('2d');
  const grad = g.createLinearGradient(0, h, 0, 0);
  grad.addColorStop(0, 'rgba(61,245,162,0)');
  grad.addColorStop(0.08, 'rgba(61,245,162,0.95)');
  grad.addColorStop(0.45, 'rgba(61,245,162,0.45)');
  grad.addColorStop(0.75, `rgba(168,147,242,${v.violet})`);
  grad.addColorStop(1, 'rgba(168,147,242,0)');
  g.fillStyle = grad; g.fillRect(0, 0, w, h);
  // vaakahäivytys säteen reunoille
  g.globalCompositeOperation = 'destination-in';
  const hg = g.createLinearGradient(0, 0, w, 0);
  hg.addColorStop(0, 'rgba(0,0,0,0)'); hg.addColorStop(0.5, 'rgba(0,0,0,1)'); hg.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = hg; g.fillRect(0, 0, w, h);
}
const ease = x => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);

function frame(now){
  const t = (now - t0) / 1000;
  ctx.clearRect(0, 0, W, H);
  const fade = ease(t / v.ignite);
  // Tähdet: hento tuike
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#E9F1FF';
  for(const s of stars){
    ctx.globalAlpha = fade * (0.35 + 0.35 * Math.sin(t * s.sp + s.ph) ** 2);
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
  }
  // Kaari: säteet kaarevan pohjaviivan varrella, verhomainen aalto sivusuunnassa
  ctx.globalCompositeOperation = 'lighter';
  const n = ARC.rays, sh = sprite.height, sw = Math.max(3, W / n * 2.4), ph = t * v.speed;
  for(let i = 0; i < n; i++){
    const u = i / (n - 1);                       // 0..1 vasemmalta oikealle
    const x0 = (u * 1.2 - 0.1) * W;
    const wave = Math.sin(u * 7 + ph * 1.3) * 0.5 + Math.sin(u * 13 - ph * 0.9) * 0.3;
    const x = x0 + wave * W * 0.018;             // sivuttaisliike
    const base = H * (ARC.centerY + ARC.sag * (2 * u - 1) ** 2) + Math.sin(u * 5 + ph) * H * 0.008;
    const hMul = 0.65 + 0.35 * (0.5 + 0.5 * Math.sin(u * 9 - ph * 1.6));   // säteiden pituus vaihtelee
    const edge = Math.sin(Math.PI * Math.min(1, Math.max(0, u * 1.15 - 0.075)));  // päät häipyvät
    const a = v.intensity * fade * edge * (0.55 + 0.45 * (0.5 + 0.5 * Math.sin(u * 23 + ph * 2.1)));
    if(a <= 0.01) continue;
    ctx.globalAlpha = a * 0.5;
    const h = sh * hMul;
    ctx.drawImage(sprite, x - sw / 2, base - h, sw, h);
  }
  ctx.globalAlpha = 1;
  raf = requestAnimationFrame(frame);
}
function play(key){
  v = VARIANTS[key] || VARIANTS.b;
  document.querySelectorAll('#ctl [data-v]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === key)));
  document.getElementById('info').textContent = v.name + ' · nopeus ' + v.speed + ' · voimakkuus ' + v.intensity;
  history.replaceState(null, '', '?v=' + key);
  buildSprite();
  cancelAnimationFrame(raf);
  ctx.clearRect(0, 0, W, H);
  // Alkaa avaussivun perusnäkymästä: kaari syttyy ~0,3 s:n tauon jälkeen.
  setTimeout(() => { t0 = performance.now(); raf = requestAnimationFrame(frame); }, 300);
}
let cur = (new URLSearchParams(location.search).get('v') || 'b').toLowerCase();
if(!VARIANTS[cur]) cur = 'b';
document.querySelectorAll('#ctl [data-v]').forEach(b => b.addEventListener('click', () => { cur = b.dataset.v; play(cur); }));
document.getElementById('replay').addEventListener('click', () => play(cur));
addEventListener('resize', () => { resize(); });
resize();
play(cur);
</script>
</body>
</html>
