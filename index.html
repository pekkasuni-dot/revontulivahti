<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060B14">
<title>Revontulivahti</title>
<meta name="description" content="Näenkö revontulet tästä pisteestä tänä yönä? Revontuliennuste, pilvisyys ja pimeys yhdessä kartassa.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#060B14;        /* polar night sky */
    --panel:#0C1524;        /* raised surface */
    --line:#1B2A40;         /* hairline */
    --ink:#E8F0F8;          /* primary text */
    --dim:#8CA0B8;          /* secondary text */
    --aurora:#53E6A6;       /* aurora green */
    --aurora-hi:#8CF5C8;
    --violet:#8B7BF7;       /* upper-arc violet */
    --cloud:#E0B04E;        /* cloud warning amber */
    --bad:#E06060;
    --radius:18px;
    --font-display:'Sora',system-ui,sans-serif;
    --font-body:'IBM Plex Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--font-body);
    background:var(--night);
    color:var(--ink);
    overflow:hidden;
  }
  #map{position:fixed;inset:0;background:var(--night)}
  .maplibregl-ctrl-attrib{font-size:10px;background:rgba(6,11,20,.7)!important;color:var(--dim)}
  .maplibregl-ctrl-attrib a{color:var(--dim)}

  /* ── top bar ─────────────────────────── */
  header{
    position:fixed;top:0;left:0;right:0;z-index:20;
    padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
    display:flex;align-items:center;gap:10px;
    background:linear-gradient(180deg,rgba(6,11,20,.92) 0%,rgba(6,11,20,0) 100%);
    pointer-events:none;
  }
  header .logo{
    width:30px;height:30px;flex:none;
  }
  header h1{
    font-family:var(--font-display);
    font-size:17px;font-weight:700;letter-spacing:.01em;
  }
  header .kp{
    margin-left:auto;pointer-events:auto;
    font-family:var(--font-display);font-weight:600;font-size:13px;
    background:var(--panel);border:1px solid var(--line);
    border-radius:999px;padding:6px 12px;color:var(--dim);
  }
  header .kp b{color:var(--ink);font-weight:700}

  /* ── locate button ───────────────────── */
  #locateBtn{
    position:fixed;right:14px;z-index:20;
    bottom:calc(env(safe-area-inset-bottom) + 292px);
    width:46px;height:46px;border-radius:50%;
    background:var(--panel);border:1px solid var(--line);
    color:var(--aurora);font-size:20px;line-height:1;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.45);
    transition:transform .15s;
  }
  #locateBtn:active{transform:scale(.92)}
  #locateBtn:focus-visible{outline:2px solid var(--aurora);outline-offset:2px}
  #cloudBtn{
    position:fixed;right:14px;z-index:20;
    bottom:calc(env(safe-area-inset-bottom) + 350px);
    width:46px;height:46px;border-radius:50%;
    background:var(--panel);border:1px solid var(--line);
    color:var(--cloud);font-size:20px;line-height:1;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.45);
    transition:transform .15s,opacity .2s;
  }
  #cloudBtn:active{transform:scale(.92)}
  #cloudBtn:focus-visible{outline:2px solid var(--cloud);outline-offset:2px}
  #auroraBtn{
    position:fixed;right:14px;z-index:20;
    bottom:calc(env(safe-area-inset-bottom) + 408px);
    width:46px;height:46px;border-radius:50%;
    background:var(--panel);border:1px solid var(--line);
    color:var(--aurora);font-size:20px;line-height:1;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.45);
    transition:transform .15s,opacity .2s;
  }
  #auroraBtn:active{transform:scale(.92)}
  #auroraBtn:focus-visible{outline:2px solid var(--aurora);outline-offset:2px}
  #mapStyleBtn{
    position:fixed;right:14px;z-index:20;
    bottom:calc(env(safe-area-inset-bottom) + 466px);
    width:46px;height:46px;border-radius:50%;
    background:var(--panel);border:1px solid var(--line);
    color:var(--violet);font-size:20px;line-height:1;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.45);
    transition:transform .15s;
  }
  #mapStyleBtn:active{transform:scale(.92)}
  #mapStyleBtn:focus-visible{outline:2px solid var(--violet);outline-offset:2px}

  /* ── karttamarkkerit ────────────────── */
  .rv-location{
    position:relative;width:36px;height:36px;
    display:flex;align-items:center;justify-content:center;
    pointer-events:none;
  }
  .rv-location-halo{
    position:absolute;inset:0;border-radius:50%;
    background:rgba(66,133,244,.22);
  }
  .rv-location-dot{
    width:16px;height:16px;border-radius:50%;
    background:#4285F4;border:3px solid #fff;
    box-shadow:0 2px 6px rgba(0,0,0,.35);
    position:relative;z-index:1;
  }

  /* ── klikkauksen pilvisyysmerkki ─────── */
  .rv-cloudcard{display:flex;flex-direction:column;align-items:center;pointer-events:auto}
  .rv-cloudcard .cc-body{
    position:relative;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:9px 12px 7px;min-width:58px;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    box-shadow:0 4px 16px rgba(0,0,0,.45);
  }
  .rv-cloudcard .cc-icon{color:var(--cloud);display:block}
  .rv-cloudcard .cc-pct{font-family:var(--font-display);font-size:17px;font-weight:700;color:var(--ink);line-height:1.1}
  .rv-cloudcard .cc-close{
    position:absolute;top:-7px;right:-7px;width:18px;height:18px;border-radius:50%;
    background:var(--line);color:var(--ink);border:1px solid var(--panel);font-size:11px;line-height:1;
    display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
  }
  .rv-cloudcard .cc-chevron{
    margin-top:3px;width:20px;height:20px;border-radius:50%;
    background:var(--cloud);color:#2b1c00;border:none;font-size:11px;line-height:1;
    display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
  }
  .rv-cloudcard .cc-tail{
    width:0;height:0;margin-top:-1px;
    border-left:7px solid transparent;border-right:7px solid transparent;
    border-top:9px solid var(--panel);
  }

  #mapStylePanel{
    position:fixed;right:68px;z-index:20;
    bottom:calc(env(safe-area-inset-bottom) + 466px);
    display:flex;flex-direction:row;gap:8px;align-items:center;
    opacity:0;pointer-events:none;
    transform:translateX(16px);
    transition:opacity .18s ease,transform .18s ease;
  }
  #mapStylePanel.open{opacity:1;pointer-events:auto;transform:translateX(0)}
  .style-opt{
    width:46px;height:46px;border-radius:50%;
    background:var(--panel);border:1px solid var(--line);color:var(--violet);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.45);
    transition:transform .15s;flex:none;
  }
  .style-opt:active{transform:scale(.92)}
  .style-opt:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
  #updatePill{
    display:none;position:fixed;top:calc(env(safe-area-inset-top) + 58px);
    left:50%;transform:translateX(-50%);z-index:45;
    background:var(--aurora);color:#06281A;border:0;border-radius:999px;
    font-family:var(--font-display);font-weight:600;font-size:13px;
    padding:9px 16px;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.5);
  }
  #updatePill.show{display:block}

  /* ── bottom sheet ────────────────────── */
  #sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:var(--panel);
    border-top:1px solid var(--line);
    border-radius:22px 22px 0 0;
    padding:14px 18px calc(env(safe-area-inset-bottom) + 16px);
    box-shadow:0 -10px 40px rgba(0,0,0,.5);
  }
  .sheet-toggle{display:block;width:100%;background:none;border:0;padding:4px 0 12px;cursor:pointer}
  .sheet-toggle:focus-visible{outline:2px solid var(--aurora);outline-offset:2px;border-radius:6px}
  .sheet-grip{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
  #sheet.min .row,#sheet.min .factors,#sheet.min .note,#sheet.min .ver{display:none}
  #sheet.min{padding-bottom:calc(env(safe-area-inset-bottom) + 8px)}
  .mini-cloud{display:none;justify-content:space-between;font-size:12px;color:var(--dim);margin:4px 0 0}
  .mini-cloud b{color:var(--ink);font-weight:600}
  #sheet.min .mini-cloud{display:flex}
  #playBtn{background:none;border:0;color:var(--dim);cursor:pointer;font-size:14px;padding:0 4px;line-height:1;vertical-align:middle}
  #playBtn:hover{color:var(--ink)}

  .row{display:flex;align-items:center;gap:16px}

  /* gauge — the signature element */
  .gauge{position:relative;width:118px;height:118px;flex:none}
  .gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
  .gauge circle{fill:none;stroke-width:9;stroke-linecap:round}
  .gauge .track{stroke:var(--line)}
  .gauge .val{stroke:var(--aurora);transition:stroke-dashoffset .6s ease, stroke .3s}
  .gauge .num{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
  }
  .gauge .num b{font-family:var(--font-display);font-size:30px;font-weight:700;line-height:1}
  .gauge .num span{font-size:10.5px;color:var(--dim);margin-top:3px;letter-spacing:.04em;text-transform:uppercase}

  .verdict{flex:1;min-width:0}
  .verdict h2{font-family:var(--font-display);font-size:19px;font-weight:600;line-height:1.25;margin-bottom:4px}
  .verdict p{font-size:13px;color:var(--dim);line-height:1.45}
  .verdict .place{font-size:12px;color:var(--dim);margin-top:6px;display:flex;align-items:center;gap:5px}
  .verdict .place svg{flex:none}

  /* factor chips */
  .factors{display:flex;gap:8px;margin-top:14px}
  .chip{
    flex:1;background:var(--night);border:1px solid var(--line);
    border-radius:var(--radius);padding:9px 10px 8px;
  }
  .chip small{display:block;font-size:10.5px;color:var(--dim);letter-spacing:.03em;text-transform:uppercase;margin-bottom:3px}
  .now-badge{
    display:none;margin-left:5px;padding:1px 6px;border-radius:999px;
    background:var(--violet);color:#fff;font-size:9px;font-weight:700;
    letter-spacing:.02em;text-transform:none;vertical-align:1px;
  }
  .now-badge.show{display:inline-block}
  .chip b{font-family:var(--font-display);font-size:16px;font-weight:600}
  .chip .bar{height:3px;border-radius:2px;background:var(--line);margin-top:7px;overflow:hidden}
  .chip .bar i{display:block;height:100%;border-radius:2px;background:var(--aurora);transition:width .5s ease}
  .chip.c-cloud .bar i{background:var(--cloud)}
  .chip.c-dark .bar i{background:var(--violet)}

  /* time slider */
  .timectl{margin-top:14px}
  .timectl .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:6px}
  .timectl .lbl b{color:var(--ink);font-weight:600}
  .model-row{
    display:flex;align-items:center;justify-content:space-between;
    font-size:11.5px;color:var(--dim);margin:6px 0;
  }
  .model-row select{
    background:var(--night);border:1px solid var(--line);color:var(--ink);
    font-family:var(--font-body);font-size:11.5px;border-radius:8px;
    padding:4px 8px;max-width:60%;
  }
  .model-row select:focus-visible{outline:2px solid var(--aurora);outline-offset:2px}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;
  }
  input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:var(--line)}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:22px;height:22px;border-radius:50%;
    background:var(--aurora);border:3px solid var(--night);margin-top:-8.5px;
    box-shadow:0 2px 8px rgba(0,0,0,.5);
  }
  input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:var(--line)}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--aurora);border:3px solid var(--night)}
  input[type=range]:focus-visible{outline:2px solid var(--aurora);outline-offset:4px;border-radius:6px}

  .note{margin-top:10px;font-size:11.5px;color:var(--dim);line-height:1.4;display:none}
  .note.show{display:block}
  .note.err{color:var(--bad)}
  .ver{margin-top:8px;text-align:right;font-size:10px;color:var(--dim);opacity:.45}

  /* toast for load state */
  #toast{
    position:fixed;top:calc(env(safe-area-inset-top) + 58px);left:50%;transform:translateX(-50%);
    z-index:40;background:var(--panel);border:1px solid var(--line);color:var(--dim);
    font-size:12.5px;padding:8px 14px;border-radius:999px;transition:opacity .4s;white-space:nowrap;
  }
  #toast.hide{opacity:0;pointer-events:none}

  @media (max-width:420px){
    #sheet{padding:8px 14px calc(env(safe-area-inset-bottom) + 12px)}
    .row{gap:12px}
    .gauge{width:92px;height:92px}
    .gauge .num b{font-size:22px}
    .verdict h2{font-size:16px}
    .verdict p{font-size:12px;line-height:1.4}
    .chip{padding:7px 8px 6px}
    .chip b{font-size:14px}
    .factors,.timectl{margin-top:10px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important}
  }
  #zoomInBtn,#zoomOutBtn{
    position:fixed;right:16px;z-index:20;
    width:42px;height:42px;
    background:rgba(255,255,255,.96);
    border:1px solid rgba(0,0,0,.18);
    color:#333;font-size:22px;font-weight:300;line-height:1;
    display:none;align-items:center;justify-content:center;
    cursor:pointer;
    transition:background .12s;
  }
  #zoomInBtn{
    border-radius:8px 8px 0 0;
    border-bottom:1px solid rgba(0,0,0,.12);
    box-shadow:0 2px 6px rgba(0,0,0,.28);
  }
  #zoomOutBtn{
    border-radius:0 0 8px 8px;
    border-top:none;
  }
  #zoomInBtn:hover,#zoomOutBtn:hover{background:#fff}
  #zoomInBtn:active,#zoomOutBtn:active{background:rgba(0,0,0,.06)}
  @media (min-width:700px){
    #sheet{left:auto;right:20px;bottom:20px;width:400px;border-radius:22px;border:1px solid var(--line)}
    #locateBtn{bottom:auto;top:calc(env(safe-area-inset-top) + 70px)}
    #cloudBtn{bottom:auto;top:calc(env(safe-area-inset-top) + 128px)}
    #auroraBtn{bottom:auto;top:calc(env(safe-area-inset-top) + 186px)}
    #mapStyleBtn{bottom:auto;top:calc(env(safe-area-inset-top) + 244px)}
    #mapStylePanel{bottom:auto;top:calc(env(safe-area-inset-top) + 244px)}
    #zoomInBtn{display:flex;top:calc(env(safe-area-inset-top) + 308px)}
    #zoomOutBtn{display:flex;top:calc(env(safe-area-inset-top) + 350px)}
  }
</style>
</head>
<body>

<div id="map" role="application" aria-label="Revontulikartta"></div>

<header>
  <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
    <rect width="32" height="32" rx="8" fill="#0C1524"/>
    <path d="M6 22 C10 12, 12 20, 16 10 C20 20, 22 12, 26 22" fill="none" stroke="#53E6A6" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="25" cy="7.5" r="1.6" fill="#8B7BF7"/>
  </svg>
  <h1>Revontulivahti</h1>
  <div class="kp" id="kpBadge">Kp <b>–</b></div>
</header>

<button id="locateBtn" aria-label="Näytä oma sijainti">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
    <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
  </svg>
</button>

<button id="cloudBtn" aria-label="Pilvikerros päälle tai pois" aria-pressed="true">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M7 17h9a4 4 0 0 0 .7-7.94A5.5 5.5 0 0 0 6 8.6 3.7 3.7 0 0 0 7 17z"/>
  </svg>
</button>

<button id="auroraBtn" aria-label="Revontuliennuste päälle tai pois" aria-pressed="true">
  <svg width="20" height="20" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
    <path d="M3 19 C7 9, 9 17, 13 8 C17 17, 19 9, 23 19"/>
  </svg>
</button>

<div id="mapStylePanel" role="group" aria-label="Karttapohjan valinta">
  <button class="style-opt" data-style="dark" aria-label="Tumma"></button>
  <button class="style-opt" data-style="light" aria-label="Vaalea"></button>
  <button class="style-opt" data-style="satellite" aria-label="Satelliitti"></button>
</div>

<button id="mapStyleBtn" aria-label="Karttapohja: Tumma">
  <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>

<button id="zoomInBtn" aria-label="Lähennä">+</button>
<button id="zoomOutBtn" aria-label="Loitonna">−</button>

<button id="updatePill">Uusi versio saatavilla — päivitä</button>

<div id="toast">Haetaan revontuli- ja säätietoja…</div>

<section id="sheet" aria-live="polite">
  <button class="sheet-toggle" id="sheetToggle" aria-expanded="true" aria-label="Pienennä tai laajenna tietopaneeli">
    <div class="sheet-grip" aria-hidden="true"></div>
  </button>

  <div class="row">
    <div class="gauge" aria-hidden="true">
      <svg viewBox="0 0 120 120">
        <circle class="track" cx="60" cy="60" r="52"/>
        <circle class="val" id="gaugeVal" cx="60" cy="60" r="52"
                stroke-dasharray="326.7" stroke-dashoffset="326.7"/>
      </svg>
      <div class="num"><b id="idxNum">–</b><span>näkyvyys</span></div>
    </div>
    <div class="verdict">
      <h2 id="verdictTitle">Valitse piste kartalta</h2>
      <p id="verdictText">Napauta karttaa tai käytä paikannusta, niin lasken revontulien näkyvyyden juuri siihen pisteeseen.</p>
      <div class="place" id="placeLbl"></div>
    </div>
  </div>

  <div class="factors">
    <div class="chip c-aurora">
      <small>Revontulet</small><b id="fAurora">–</b>
      <div class="bar"><i id="bAurora" style="width:0%"></i></div>
    </div>
    <div class="chip c-cloud">
      <small>Pilvetön taivas</small><b id="fCloud">–</b>
      <div class="bar"><i id="bCloud" style="width:0%"></i></div>
    </div>
    <div class="chip c-dark">
      <small>Pimeys</small><b id="fDark">–</b>
      <div class="bar"><i id="bDark" style="width:0%"></i></div>
    </div>
  </div>

  <div class="timectl">
    <div class="lbl"><span>Ajankohta <span id="auroraNowBadge" class="now-badge">Revontulet: nyt</span></span><span style="display:flex;align-items:center;gap:5px"><button id="playBtn" aria-label="Käynnistä aikakaruselli">▶</button><b id="timeLbl">Nyt</b></span></div>
    <div class="mini-cloud"><span>☁ Pilvisyys</span><b id="miniCloudPct">–</b></div>
    <div class="model-row">
      <label for="cloudModelSelect">Pilvimalli</label>
      <select id="cloudModelSelect"></select>
    </div>
    <input type="range" id="timeSlider" min="0" max="10" step="0.5" value="0"
           aria-label="Ennusteen ajankohta, tunteja tästä hetkestä">
  </div>

  <p class="note" id="noteMsg"></p>
  <p class="ver" id="appVersion"></p>
</section>

<canvas id="cloudCanvas" width="1440" height="82" style="display:none" aria-hidden="true"></canvas>

<script>
'use strict';
/* ══════════════════════════════════════════════════════════════
   Revontulivahti — MVP
   Data:  NOAA SWPC OVATION (revontuliovaali, nowcast)
          NOAA SWPC Kp-indeksi + 3 vrk ennuste
          Open-Meteo (pilvisyys kerroksittain, tunneittain)
   Laskenta selaimessa: auringon korkeus (pimeys), geomagneettinen
   leveysaste, näkyvyysindeksi.
   ══════════════════════════════════════════════════════════════ */

const APP_VERSION = 'v1.44';  // päivitä joka julkaisun yhteydessä
const USE_WEBGL_CLOUDS = true;
const $ = id => document.getElementById(id);
const clamp = (v,a,b)=>Math.min(b,Math.max(a,v));

/* ── pilvimallit: rekisteri + valinta ────────────────────────────
   Kaikki pilvisyyttä näyttävät kohdat (kartan pilvitaso, klikkausmerkin

const CLOUD_MODELS = {
  ecmwf: {
    id:'ecmwf', label:'ECMWF IFS',
    gridFile:'data/clouds-ecmwf.json',
    hasLayers:false, // avoin ECMWF-data: vain kokonaispilvisyys (tcc), ei korkeuserittelyä
    attr:'ECMWF Open Data (CC BY 4.0)',
  },
  icon_eu: {
    id:'icon_eu', label:'ICON-EU (DWD)',
    gridFile:'data/clouds-icon_eu.json',
    hasLayers:true,  // sisältää myös matala/keski/ylä-erittelyn → näkyvyysindeksi tarkempi
    attr:'© DWD (ICON-EU)',
  },
};
const DEFAULT_CLOUD_MODEL = 'ecmwf';
const CLOUD_MODEL_KEY = 'rv-cloud-model';

function loadSavedCloudModel(){
  try{
    const v = localStorage.getItem(CLOUD_MODEL_KEY);
    return CLOUD_MODELS[v] ? v : DEFAULT_CLOUD_MODEL;
  }catch(e){ return DEFAULT_CLOUD_MODEL; }
}
function saveCloudModel(id){
  try{ localStorage.setItem(CLOUD_MODEL_KEY, id); }catch(e){}
}

  hour:0,              // slider offset in hours
  auroraOn:true,

  kpNow:null,
  kpForecast:[],       // [{t:Date, kp}]
  marker:null,
  markerCloudPctEl:null, // klikkausmerkin pilvisyys%-elementti (jos markerType==='pin')
  cloudModel: loadSavedCloudModel(),

  cloudsOn:true,

/* ── kirjastojen lataus varmistuksin ─────────────────────────── */
function loadOne(tag, attrs){
  return new Promise(res=>{
    const el = document.createElement(tag);
    Object.assign(el, attrs);
    el.onload = ()=>res(true);
    el.onerror = ()=>res(false);
    document.head.appendChild(el);
  });
}
async function loadMapLib(){
  const v='3.6.2';
  const cdns=[
    ['https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/'+v+'/maplibre-gl.min.js',
     'https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/'+v+'/maplibre-gl.min.css'],
    ['https://unpkg.com/maplibre-gl@'+v+'/dist/maplibre-gl.js',
     'https://unpkg.com/maplibre-gl@'+v+'/dist/maplibre-gl.css'],
    ['https://cdn.jsdelivr.net/npm/maplibre-gl@'+v+'/dist/maplibre-gl.min.js',
     'https://cdn.jsdelivr.net/npm/maplibre-gl@'+v+'/dist/maplibre-gl.min.css']
  ];
  for(const [js,css] of cdns){
    if(await loadOne('script',{src:js})){
      loadOne('link',{rel:'stylesheet',href:css});
      return true;
    }
  }
  return false;
}

function cloudAttrSuffix(){
  const m = CLOUD_MODELS[state.cloudModel] || CLOUD_MODELS[DEFAULT_CLOUD_MODEL];
  return ' · Revontulet: NOAA SWPC · Pilvet: ' + (m.attr || '');

  // alkoivat vaatia API-avaimen (palauttavat "API key required" -kuvan HTTP 200:lla) —

    tileSize:256, attr:ESRI_ATTR

function buildMapStyle(key){
  const s = MAP_STYLES[key] || MAP_STYLES.dark;
  if(s.color){
    return {version:8, sources:{}, layers:[{id:'base', type:'background',
      paint:{'background-color':s.color}}]};
  }
  return {version:8, sources:{base:{type:'raster',tiles:s.tiles,tileSize:s.tileSize,
    attribution:s.attr+cloudAttrSuffix()}},
    layers:[{id:'base',type:'raster',source:'base',paint:s.basePaint||{}}]};
}

function updateMapStyleBtn(){

  $('mapStyleBtn').innerHTML = STYLE_SVG[k] || STYLE_SVG.dark;

function switchMapStyle(key){
  state.mapStyleKey = key;
  if(map){
    const s = MAP_STYLES[key] || MAP_STYLES.dark;
    if(map.getLayer('base')){
      // Vaihda vain base-taso — WebGL-konteksti ja custom-tasot säilyvät
      map.removeLayer('base');
      if(map.getSource('base')) map.removeSource('base');
      // base pohjimmaiseksi — lisää ensimmäisen jäljellä olevan tason alle
      const firstId = map.getStyle().layers[0] && map.getStyle().layers[0].id;
      if(s.color){
        map.addLayer({id:'base', type:'background',
          paint:{'background-color':s.color}}, firstId);
      } else {
        map.addSource('base', {type:'raster', tiles:s.tiles, tileSize:s.tileSize,
                               attribution: s.attr + cloudAttrSuffix()});
        map.addLayer({id:'base', type:'raster', source:'base', paint:s.basePaint||{}}, firstId);
      }
      // style.load ei laukea kevyessä vaihdossa — kutsu overlayit käsin
      addOverlays();
    } else {
      // style.load hoitaa addOverlaysin tässä haarassa
      map.setStyle(buildMapStyle(key));
    }
  }
  updateMapStyleBtn();
}

/* ── datahaut ────────────────────────────────────────────────── */
async function fetchJSON(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error(url+' → '+r.status);
  return r.json();
}

async function loadOvation(){
  const d = await fetchJSON('https://services.swpc.noaa.gov/json/ovation_aurora_latest.json');
  // coordinates: [lon 0..359, lat -90..90, aurora prob 0..100]
  const grid = new Float32Array(181*360);
  for(const [lon,lat,p] of d.coordinates){
    grid[(lat+90)*360 + lon] = p;
  }
  state.ovation = {grid, time:new Date(d['Forecast Time']||d['Observation Time']||Date.now())};
  // [DIAG] Tarkista datakvaliteetti
  let maxP=0, nonZero=0;
  for(let i=0;i<grid.length;i++){if(grid[i]>maxP)maxP=grid[i];if(grid[i]>0)nonZero++;}
  console.log('[OVATION] aika:', d['Forecast Time']||d['Observation Time'],
              '| koordinaatteja:', d.coordinates.length,
              '| soluja p>0:', nonZero,
              '| max p:', maxP.toFixed(1)+'%');
  drawOvalOverlay();
}

async function loadKp(){
  // nykyarvo — etsi viimeisin kelvollinen rivi (ohita otsikkorivi indeksillä 0)
  try{
    const rows = await fetchJSON('https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json');
    for(let i=rows.length-1;i>=1;i--){
      const num=parseFloat(rows[i][1]);
      if(Number.isFinite(num)){state.kpNow=num;break;}
    }
  }catch(e){ console.warn('Kp nykyarvo epäonnistui:',e); }
  // ennuste
  try{
    const rows = await fetchJSON('https://services.swpc.noaa.gov/products/noaa-planetary-k-index-forecast.json');
    state.kpForecast = rows.slice(1)
      .filter(r => r && r[0])
      .map(r=>({t:new Date(r[0].replace(' ','T')+'Z'), kp:parseFloat(r[1])}))
      .filter(f=>Number.isFinite(f.kp) && !isNaN(f.t));
    // varakeino: jos nykyarvo ei saatu, ota ennusteesta lähin arvo
    if(!Number.isFinite(state.kpNow) && state.kpForecast.length){
      const now=Date.now();
      state.kpNow=state.kpForecast.reduce((a,b)=>Math.abs(b.t-now)<Math.abs(a.t-now)?b:a).kp;
    }
  }catch(e){ console.warn('Kp ennuste epäonnistui:',e); }
  if(Number.isFinite(state.kpNow)) $('kpBadge').innerHTML='Kp <b>'+state.kpNow.toFixed(1)+'</b>';
}

/* ── ovaalin piirto kartalle ─────────────────────────────────── */
function drawOvalOverlay(){
  if(!map || !state.ovation) return;  // OVATION ei latautunut vielä

  // Piilota taso jos aurora on pois päältä
  if(!state.auroraOn){
    try{ if(map.getLayer('ovation')) map.setLayoutProperty('ovation','visibility','none'); }catch(e){}
    return;
  }

  // [DIAG] Kumpi haara
  console.log('[drawOvalOverlay] OVATION nowcast, aika:', state.ovation.time.toISOString(), '| hour:', state.hour);

  // Aina nykyhetken OVATION, riippumatta aikajanan kohdasta (jäädytetty)
  // OVATION-hila on 1° x 1° (360x181). Piirretään OSA-kerroin verran isommalla
  // canvaksella, mutta jokainen OSA×OSA-pikselilohko luetaan samasta yhdestä
  // hilasolusta (ei interpolointia) — tämä pitää solun reunat täysin terävinä,
  // vaikka WebGL-rasterikerros tekisi lievää bilineaarista suodatusta
  // skaalatessa 'image'-lähdettä (raster-resampling:'nearest' ei kata tätä
  // kaikissa MapLibre-versioissa image-lähteille).
  const OSA = 4;
  const W=360*OSA, H=180*OSA+1;
  const cv = document.createElement('canvas');
  cv.width=W; cv.height=H;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(W,H);
  const yTop = merc(85), yBot = merc(-85);  // canvas pystyakseli Mercator-Y:ssä

  for(let y=0;y<H;y++){
    const lat = imerc(yTop + (y/(H-1))*(yBot-yTop));  // käänteinen Mercator → oikea lat
    const latIdx = clamp(Math.round(lat+90),0,180);
    for(let x=0;x<W;x++){
      const lon = (x/W)*360 - 180;
      const lonIdx = Math.round((lon+360)%360);
      const p = state.ovation.grid[latIdx*360+lonIdx]||0;
      if(p>0){
        const t = clamp((p-1)/99,0,1);
        let r,g,b;
        if(t<0.35){
          const u=t/0.35;
          r=Math.round(20+(220-20)*u); g=Math.round(200+(220-200)*u); b=Math.round(80-80*u);
        }else if(t<0.65){
          const u=(t-0.35)/0.30;
          r=Math.round(220+(235-220)*u); g=Math.round(220+(100-220)*u); b=0;
        }else{
          const u=(t-0.65)/0.35;
          r=Math.round(235+(215-235)*u); g=Math.round(100-100*u); b=0;
        }
        const i=(y*W+x)*4;
        img.data[i]=r; img.data[i+1]=g; img.data[i+2]=b;
        // Kynnys 3% + jyrkkä nousu: p≤3 → läpinäkyvä, p=10 → 28, p=30 → 108, p=60+ → 230
        img.data[i+3]=Math.round(clamp((p-3)*4, 0, 230));
      }
    }
  }
  ctx.putImageData(img,0,0);
  const url = cv.toDataURL();
  const coords = [[-180,85],[180,85],[180,-85],[-180,-85]];
  try{
    if(map.getSource('ovation')){
      map.getSource('ovation').updateImage({url, coordinates:coords});
      if(map.getLayer('ovation')) map.setPaintProperty('ovation','raster-resampling','nearest');
    }else{
      map.addSource('ovation',{type:'image',url,coordinates:coords});
      map.addLayer({id:'ovation',type:'raster',source:'ovation',
                    paint:{'raster-opacity':0.85,'raster-resampling':'nearest'}});
    }
    if(map.getLayer('ovation')) map.setLayoutProperty('ovation','visibility','visible');
    reorderAllLayers();
  }catch(e){}
}

function saveCloudCache(times, vals, nlat, nlon){

// Muuntaa 0..100-%-taulukon 0..1-Float32Array:ksi (null/puuttuva -> 0)
function toUnitFloat32(arr, n){
  const out = new Float32Array(n);
  if(Array.isArray(arr)) for(let i=0;i<n;i++) out[i] = (arr[i]||0)/100;
  return out;
}

function applyStaticGrid(d){
  const times = d.times.map(t=>new Date(t));
  const n = d.vals.length;
  const hasLayers = Array.isArray(d.valsLow) && Array.isArray(d.valsMid) && Array.isArray(d.valsHigh);
  state.cloudGrid = {
    times, vals: toUnitFloat32(d.vals, n),
    valsLow:  hasLayers ? toUnitFloat32(d.valsLow, n)  : null,
    valsMid:  hasLayers ? toUnitFloat32(d.valsMid, n)  : null,
    valsHigh: hasLayers ? toUnitFloat32(d.valsHigh, n) : null,
    hasLayers,
    lat0:d.lat0, lat1:d.lat1, lon0:d.lon0, lon1:d.lon1,
    nlat:d.nlat, nlon:d.nlon, dlat:d.dlat, dlon:d.dlon
  };
  // Päivitä aikajanasoveltamisala ennusteen todelliseen horisontiin (30 min tarkkuudella)
  const base = Math.floor(Date.now()/3600e3)*3600e3;
  const maxH = Math.max(0, Math.floor((times[times.length-1] - base) / 1800e3) * 0.5);
  $('timeSlider').max = Math.min(maxH, 10);
  renderClouds();
}

/* Lähde: Actions-putken esikäsitelty hila valitulle mallille (päivittyy ~4× vrk).
   Globaaliruudukko/pistekohtaiset haut olisivat liian raskaita selainpuolelle. */
async function loadCloudGrid(){
  const model = CLOUD_MODELS[state.cloudModel] || CLOUD_MODELS[DEFAULT_CLOUD_MODEL];
  const d = await fetchJSON(model.gridFile + '?v=' + Math.floor(Date.now()/600e3));
  if(!d || !d.nlat || !d.nlon || !Array.isArray(d.vals) || !d.dlat || !d.dlon)
    throw new Error('Pilvidata puuttuu tai on väärässä muodossa');
  applyStaticGrid(d);
}

function loadCloudCache(){
  try{
    const d = JSON.parse(localStorage.getItem(CLOUD_CACHE_KEY));
    if(!d || Date.now()-d.t > 12*3600e3) return false;   // yli 12 h vanha ei kelpaa
    state.cloudGrid = {times:d.times.map(t=>new Date(t)),
                       vals:new Float32Array(d.vals), nlat:d.nlat, nlon:d.nlon};
    renderClouds();
    return Math.max(0.05, (Date.now()-d.t)/3600e3);   // ika tunteina (aina truthy)
  }catch(e){ return false; }
}

/* 429-toipuminen: yrita tuoretta hakua taustalla kasvavalla valilla */
let cloudRetryDelay = 2*60*1000;
let cloudRetryTimer = null;
function scheduleCloudRetry(){
  if(cloudRetryTimer) return;
  cloudRetryTimer = setTimeout(()=>{
    cloudRetryTimer = null;
    loadCloudGrid().then(()=>{ renderClouds(); note(''); cloudRetryDelay = 2*60*1000; })
      .catch(()=>{ cloudRetryDelay = Math.min(cloudRetryDelay*2, 30*60*1000); scheduleCloudRetry(); });
  }, cloudRetryDelay);
}

const merc  = lat => Math.log(Math.tan(Math.PI/4 + lat*Math.PI/360));
const imerc = y   => (2*Math.atan(Math.exp(y)) - Math.PI/2) * 180/Math.PI;
const ss    = t   => t*t*(3-2*t);   // smoothstep: poistaa bilineaarisen ristikkojaljen

/* Saumattomasti toistuva fraktaalikohina pilvitekstuuriin (lasketaan kerran).
   Tekstuuri on kosmeettinen: pilvien sijainti ja reunat tulevat datasta. */
const NOISE = (()=>{
  const S = 512, n = new Float32Array(S*S);
  const h = (x,y)=>{ let t=(x*374761393 + y*668265263)|0;
    t=((t^(t>>13))*1274126177)|0; return ((t^(t>>16))>>>0)/4294967295; };
  const sm = (a,b,t)=>a+(b-a)*(t*t*(3-2*t));
  let amp=0.55, freq=8;
  for(let oct=0; oct<3; oct++, amp*=0.5, freq*=2){
    for(let y=0;y<S;y++){
      const fy=y/S*freq, y0=Math.floor(fy), ty=fy-y0, y1=(y0+1)%freq;
      for(let x=0;x<S;x++){
        const fx=x/S*freq, x0=Math.floor(fx), tx=fx-x0, x1=(x0+1)%freq;
        const v = sm( sm(h(x0,y0),h(x1,y0),tx), sm(h(x0,y1),h(x1,y1),tx), ty );
        n[y*S+x] += (v-0.5)*amp;
      }
    }
  }
  return {S, n};
})();

/* ── WebGL pilvikerros (custom MapLibre layer) ───────────────── */

const CWG = {
  ready:false, program:null, posBuffer:null,
  tex0:null, tex1:null, noiseTex:null, aPos:-1,
  uMatrix:null, uBlend:null, uOpacity:null, uNoiseOff:null,
  uTexSize:null, uGrid:null, uCloud0:null, uCloud1:null, uNoise:null,
  lastT0:-1, lastT1:-1, lastNlat:0,
};

const CWG_VERT = `attribute vec2 a_merc;
uniform mat4 u_matrix;
varying vec2 v_merc;
void main(){
  gl_Position = u_matrix * vec4(a_merc, 0.0, 1.0);
  v_merc = a_merc;
}`;

const CWG_FRAG = `precision mediump float;
uniform sampler2D u_cloud0, u_cloud1, u_noise;
uniform float u_blend, u_opacity;
uniform vec2 u_noiseOff, u_texSize;
uniform vec4 u_grid;
varying vec2 v_merc;
float mercLat(float my){
  const float PI=3.14159265358979;
  return (2.0*atan(exp(PI*(1.0-2.0*my)))-PI*0.5)*180.0/PI;
}
vec4 catrom(float t){
  float t2=t*t,t3=t2*t;
  return 0.5*vec4(-t3+2.0*t2-t,3.0*t3-5.0*t2+2.0,-3.0*t3+4.0*t2+t,t3-t2);
}
float sampleGrid(sampler2D tex, vec2 uv){
  vec2 px=uv*u_texSize-0.5; vec2 pi=floor(px); vec2 pf=px-pi;
  vec4 wx=catrom(pf.x); vec4 wy=catrom(pf.y);
  float x0=(pi.x-0.5)/u_texSize.x,x1=(pi.x+0.5)/u_texSize.x,
        x2=(pi.x+1.5)/u_texSize.x,x3=(pi.x+2.5)/u_texSize.x;
  float y0=clamp((pi.y-0.5)/u_texSize.y,0.,1.),y1=clamp((pi.y+0.5)/u_texSize.y,0.,1.),
        y2=clamp((pi.y+1.5)/u_texSize.y,0.,1.),y3=clamp((pi.y+2.5)/u_texSize.y,0.,1.);
  return clamp(
    wy[0]*(wx[0]*texture2D(tex,vec2(x0,y0)).r+wx[1]*texture2D(tex,vec2(x1,y0)).r+wx[2]*texture2D(tex,vec2(x2,y0)).r+wx[3]*texture2D(tex,vec2(x3,y0)).r)+
    wy[1]*(wx[0]*texture2D(tex,vec2(x0,y1)).r+wx[1]*texture2D(tex,vec2(x1,y1)).r+wx[2]*texture2D(tex,vec2(x2,y1)).r+wx[3]*texture2D(tex,vec2(x3,y1)).r)+
    wy[2]*(wx[0]*texture2D(tex,vec2(x0,y2)).r+wx[1]*texture2D(tex,vec2(x1,y2)).r+wx[2]*texture2D(tex,vec2(x2,y2)).r+wx[3]*texture2D(tex,vec2(x3,y2)).r)+
    wy[3]*(wx[0]*texture2D(tex,vec2(x0,y3)).r+wx[1]*texture2D(tex,vec2(x1,y3)).r+wx[2]*texture2D(tex,vec2(x2,y3)).r+wx[3]*texture2D(tex,vec2(x3,y3)).r)
    ,0.,1.);
}
void main(){
  float lat=mercLat(v_merc.y),lon=v_merc.x*360.0-180.0;
  float u=(lon-u_grid.x)/(u_grid.z-u_grid.x);
  float v=(lat-u_grid.y)/(u_grid.w-u_grid.y);
  if(u<0.0||u>1.0||v<0.0||v>1.0){gl_FragColor=vec4(0.0);return;}
  float v0=sampleGrid(u_cloud0,vec2(u,v)),v1=sampleGrid(u_cloud1,vec2(u,v));
  float cv=mix(v0,v1,u_blend);
  vec2 nuv=fract(vec2(u*3.0,v)+u_noiseOff);
  float nz=texture2D(u_noise,nuv).r-0.5;
  float vt=clamp(cv+nz*cv*(1.0-cv)*4.0*0.9,0.0,1.0);
  float pct=vt*100.0;
  // Pilvisyysaste → läpinäkyvyys porrastettuna (ei liukuva), väri aina valkoinen.
  float a;
  if(pct<6.0)        a=0.0;
  else if(pct<=10.0) a=0.12;
  else if(pct<=20.0) a=0.24;
  else if(pct<=30.0) a=0.36;
  else if(pct<=40.0) a=0.48;
  else if(pct<=50.0) a=0.60;
  else if(pct<=90.0) a=0.75;
  else                a=1.0;
  float fade=clamp(min(u,1.0-u)*80.0,0.0,1.0)*clamp(min(v,1.0-v)*5.0,0.0,1.0);
  float alpha=a*fade*u_opacity;
  gl_FragColor=vec4(alpha,alpha,alpha,alpha);
}`;

function cwgShader(gl, type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
    console.error('Cloud shader:', gl.getShaderInfoLog(s));
    gl.deleteShader(s); return null;
  }
  return s;
}

function cwgUploadSlice(gl, tex, idx, g){
  const N = g.nlat * g.nlon;
  const u8 = new Uint8Array(N);
  const off = idx * N;
  for(let i=0; i<N; i++) u8[i] = Math.round(g.vals[off+i]*255);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.LUMINANCE,g.nlon,g.nlat,0,gl.LUMINANCE,gl.UNSIGNED_BYTE,u8);
}

function cwgSyncQuad(gl, g){
  const mc = maplibregl.MercatorCoordinate;
  const tl = mc.fromLngLat([g.lon0, g.lat1]);
  const tr = mc.fromLngLat([g.lon1, g.lat1]);
  const bl = mc.fromLngLat([g.lon0, g.lat0]);
  const br = mc.fromLngLat([g.lon1, g.lat0]);
  gl.bindBuffer(gl.ARRAY_BUFFER, CWG.posBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
    tl.x,tl.y, bl.x,bl.y, br.x,br.y,
    tl.x,tl.y, br.x,br.y, tr.x,tr.y
  ]), gl.STATIC_DRAW);
}

const cloudWebGLLayer = {
  id:'clouds-webgl', type:'custom', renderingMode:'2d',

  onAdd(map, gl){
    const vs = cwgShader(gl, gl.VERTEX_SHADER, CWG_VERT);
    const fs = cwgShader(gl, gl.FRAGMENT_SHADER, CWG_FRAG);
    if(!vs || !fs){ console.warn('Cloud WebGL: shader compile failed'); return; }
    const prog = gl.createProgram();
    gl.attachShader(prog, vs); gl.attachShader(prog, fs);
    gl.linkProgram(prog);
    gl.deleteShader(vs); gl.deleteShader(fs);
    if(!gl.getProgramParameter(prog, gl.LINK_STATUS)){
      console.warn('Cloud WebGL: link failed', gl.getProgramInfoLog(prog)); return;
    }
    CWG.program  = prog;
    CWG.aPos     = gl.getAttribLocation(prog, 'a_merc');
    CWG.uMatrix  = gl.getUniformLocation(prog, 'u_matrix');
    CWG.uBlend   = gl.getUniformLocation(prog, 'u_blend');
    CWG.uOpacity = gl.getUniformLocation(prog, 'u_opacity');
    CWG.uNoiseOff= gl.getUniformLocation(prog, 'u_noiseOff');
    CWG.uTexSize = gl.getUniformLocation(prog, 'u_texSize');
    CWG.uGrid    = gl.getUniformLocation(prog, 'u_grid');
    CWG.uCloud0  = gl.getUniformLocation(prog, 'u_cloud0');
    CWG.uCloud1  = gl.getUniformLocation(prog, 'u_cloud1');
    CWG.uNoise   = gl.getUniformLocation(prog, 'u_noise');

    CWG.posBuffer = gl.createBuffer();

    // Noise texture: NOISE.n is float32 ~[-0.48,0.48], encode as LUMINANCE with +0.5 offset
    const ns = NOISE.S;
    const nu8 = new Uint8Array(ns*ns);
    for(let i=0; i<ns*ns; i++) nu8[i] = Math.round(clamp(NOISE.n[i]+0.5,0,1)*255);
    CWG.noiseTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, CWG.noiseTex);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.LUMINANCE,ns,ns,0,gl.LUMINANCE,gl.UNSIGNED_BYTE,nu8);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.REPEAT);

    // Cloud data textures: lon wraps, lat clamps
    CWG.tex0 = gl.createTexture(); CWG.tex1 = gl.createTexture();
    for(const t of [CWG.tex0, CWG.tex1]){
      gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    }

    CWG.ready = true;
    CWG.lastT0 = -1; CWG.lastT1 = -1; CWG.lastNlat = 0;
    if(state.cloudGrid) cwgSyncQuad(gl, state.cloudGrid);
  },

  render(gl, matrix){
    if(!CWG.ready || !state.cloudGrid || !state.cloudsOn) return;
    const g = state.cloudGrid;
    const tf = cloudTimeFloat(targetTime());
    const t0i = Math.floor(tf);
    const t1i = Math.min(t0i+1, g.times.length-1);

    // nlatChanged talteen ETUKATEEN - mallin vaihto (eri hilakoko) pitaa
    // pakottaa UUDELLEENLATAUS MYOS tex1:lle, ei vain tex0:lle
    const nlatChanged = CWG.lastNlat !== g.nlat;
    if(CWG.lastT0 !== t0i || nlatChanged){
      cwgUploadSlice(gl, CWG.tex0, t0i, g);
      cwgSyncQuad(gl, g);
      CWG.lastT0 = t0i; CWG.lastNlat = g.nlat;
    }
    if(CWG.lastT1 !== t1i || nlatChanged){
      cwgUploadSlice(gl, CWG.tex1, t1i, g);
      CWG.lastT1 = t1i;
    }

    gl.useProgram(CWG.program);
    gl.uniformMatrix4fv(CWG.uMatrix, false, matrix);
    gl.uniform1f(CWG.uBlend, tf - t0i);
    gl.uniform1f(CWG.uOpacity, 0.9);
    gl.uniform2f(CWG.uNoiseOff,
      ((Math.round(state.hour*7)) & (NOISE.S-1)) / NOISE.S,
      ((Math.round(state.hour*3)) & (NOISE.S-1)) / NOISE.S);
    gl.uniform2f(CWG.uTexSize, g.nlon, g.nlat);
    gl.uniform4f(CWG.uGrid, g.lon0, g.lat0, g.lon1, g.lat1);

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, CWG.tex0);
    gl.uniform1i(CWG.uCloud0, 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, CWG.tex1);
    gl.uniform1i(CWG.uCloud1, 1);
    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D, CWG.noiseTex);
    gl.uniform1i(CWG.uNoise, 2);

    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);  // premultiplied alpha
    gl.bindBuffer(gl.ARRAY_BUFFER, CWG.posBuffer);
    gl.enableVertexAttribArray(CWG.aPos);
    gl.vertexAttribPointer(CWG.aPos, 2, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.TRIANGLES, 0, 6);
    gl.disableVertexAttribArray(CWG.aPos);
  },

  onRemove(map, gl){
    if(!CWG.ready) return;
    if(CWG.program)   gl.deleteProgram(CWG.program);
    if(CWG.posBuffer) gl.deleteBuffer(CWG.posBuffer);
    if(CWG.tex0)      gl.deleteTexture(CWG.tex0);
    if(CWG.tex1)      gl.deleteTexture(CWG.tex1);
    if(CWG.noiseTex)  gl.deleteTexture(CWG.noiseTex);
    CWG.ready = false; CWG.lastT0 = -1; CWG.lastT1 = -1; CWG.lastNlat = 0;
    CWG.program = CWG.posBuffer = CWG.tex0 = CWG.tex1 = CWG.noiseTex = null;
  }
};

/* ── tasojärjestys: base → clouds → ovaali → rajat → nimet ──── */
function reorderAllLayers(){
  if(!map) return;
  // Nosta yksi kerrallaan; viimeinen jää päällimmäiseksi
  ['clouds-webgl','ovation','borders','coast-shadow','coast','labels']
    .forEach(id=>{ try{ if(map.getLayer(id)) map.moveLayer(id); }catch(e){} });
}

let _bordersGeoJSON = null, _coastGeoJSON = null;

async function addBordersOverlay(){
  if(!map) return;
  const doAdd = async ()=>{
    if(map.getSource('borders') || map.getSource('coast')){ reorderAllLayers(); return; }
    try{
      if(!_coastGeoJSON || !_bordersGeoJSON){
        const base = 'https://cdn.jsdelivr.net/gh/nvkelso/natural-earth-vector@master/geojson/';
        [_coastGeoJSON, _bordersGeoJSON] = await Promise.all([
          fetchJSON(base + 'ne_50m_coastline.geojson'),
          fetchJSON(base + 'ne_50m_admin_0_boundary_lines_land.geojson')
        ]);
      }
      // Tarkista uudelleen awaitin jälkeen — rinnakkainen kutsu on saattanut lisätä jo
      if(map.getSource('borders') || map.getSource('coast')){ reorderAllLayers(); return; }
      map.addSource('borders',{type:'geojson', data:_bordersGeoJSON});
      map.addLayer({id:'borders', type:'line', source:'borders',
        paint:{'line-color':'#000000','line-width':0.7,'line-opacity':0.6}});
      map.addSource('coast',{type:'geojson', data:_coastGeoJSON});
      // Varjo rantaviivan alle: leveämpi, sumennettu ja hieman siirretty kopio
      map.addLayer({id:'coast-shadow', type:'line', source:'coast',
        paint:{'line-color':'#000000','line-width':2.6,'line-opacity':0.35,
               'line-blur':2.5,'line-translate':[1.5,1.5]}});
      map.addLayer({id:'coast', type:'line', source:'coast',
        paint:{'line-color':'#000000','line-width':1.3,'line-opacity':0.85}});
      reorderAllLayers();
    }catch(e){ console.warn('Rajadata ei latautunut', e); }
  };
  doAdd();
}

function addLabelsOverlay(){
  if(!map) return;
  const s = MAP_STYLES[state.mapStyleKey] || {};
  if(map.getLayer('labels'))      map.removeLayer('labels');
  if(map.getSource('base-labels')) map.removeSource('base-labels');
  if(!s.labelTiles) return;   // satelliitti: ei erillistä nimitasoa
  map.addSource('base-labels', {type:'raster', tiles:s.labelTiles, tileSize:256,
    // Yksivärisellä base-taustalla (s.color) ei ole omaa lähdettä/attribuutiota,
    // joten Esrin attribuutio kiinnitetään tähän nimitasoon.
    attribution: s.color ? (s.attr||'') + cloudAttrSuffix() : undefined});
  map.addLayer({id:'labels', type:'raster', source:'base-labels'});
  // addLayer ilman beforeId → labels päälle; reorderAllLayers ei tarvita tässä
}

/* Kaikki karttatasot uudelleen – kutsutaan aina style.load-tapahtumasta */
function addOverlays(){
  try{ if(state.cloudGrid) renderClouds(); }catch(e){ console.warn('pilvet',e); }
  try{ drawOvalOverlay(); }catch(e){ console.warn('ovaali',e); }
  try{ addBordersOverlay(); }catch(e){ console.warn('rajat',e); }

}

function cloudTimeFloat(date){
  const ts = state.cloudGrid.times;
  const t = date.getTime();
  if(t <= ts[0].getTime()) return 0;
  if(t >= ts[ts.length-1].getTime()) return ts.length - 1.0001;
  let lo = 0, hi = ts.length - 1;
  while(hi - lo > 1){ const mid = (lo+hi)>>1; if(t >= ts[mid].getTime()) lo=mid; else hi=mid; }
  return lo + Math.min((t - ts[lo].getTime()) / (ts[lo+1].getTime() - ts[lo].getTime()), 0.9999);
}

function renderClouds(){
  if(!state.cloudGrid || !map) return;
  if(USE_WEBGL_CLOUDS){
    if(!map.getLayer('clouds-webgl')){
      try{ map.addLayer(cloudWebGLLayer); }catch(e){ return; }
    }
    map.triggerRepaint();
  } else {
    if(!map.loaded()){ map.once('load', ()=>renderClouds()); return; }
    renderCloudsCanvas();
  }
  reorderAllLayers();
}

function renderCloudsCanvas(){
  if(!state.cloudGrid || !map) return;
  const g = state.cloudGrid;
  const N = g.nlat * g.nlon;

  // ajallinen sekoitus: liukuma kahden ennustetunnin valilla → sulava animaatio
  const tf = cloudTimeFloat(targetTime());
  const t0 = Math.floor(tf), ta = tf - t0;
  if(!renderCloudsCanvas._B) renderCloudsCanvas._B = new Float32Array(N);
  const B = renderCloudsCanvas._B;
  const b0 = t0*N, b1 = Math.min(t0+1, g.times.length-1)*N;
  for(let i=0;i<N;i++) B[i] = g.vals[b0+i]*(1-ta) + g.vals[b1+i]*ta;

  const cv = document.getElementById('cloudCanvas');
  const W = cv.width, H = cv.height;
  const ctx = cv.getContext('2d');
  if(!renderCloudsCanvas._img) renderCloudsCanvas._img = ctx.createImageData(W,H);
  const img = renderCloudsCanvas._img;
  const mTop = merc(g.lat1), mBot = merc(g.lat0);
  // tekstuuri ajelehtii hitaasti ajan mukana, jotta kelaus tuntuu liikkeelta
  const offX = (Math.round(state.hour*7)) & (NOISE.S-1);
  const offY = (Math.round(state.hour*3)) & (NOISE.S-1);

  for(let y=0;y<H;y++){
    const lat = imerc(mTop + (y/(H-1))*(mBot-mTop));
    let fr = (lat - g.lat0)/g.dlat;
    fr = clamp(fr, 0, g.nlat - 2.0001);
    const r0 = Math.floor(fr), rf = ss(fr - r0);
    const ny = ((y+offY)&(NOISE.S-1))*NOISE.S;
    for(let x=0;x<W;x++){
      const lon = g.lon0 + (x/(W-1))*(g.lon1-g.lon0);
      let fc = (lon - g.lon0)/g.dlon;
      fc = clamp(fc, 0, g.nlon - 2.0001);
      const c0 = Math.floor(fc), cf = ss(fc - c0);
      const i00 = r0*g.nlon + c0;
      const v = B[i00]*(1-rf)*(1-cf) + B[i00+1]*(1-rf)*cf
              + B[i00+g.nlon]*rf*(1-cf) + B[i00+g.nlon+1]*rf*cf;

      // fraktaalitekstuuri: voimakkain puolipilvisessa, nolla selkealla ja umpipilvella
      const nz  = NOISE.n[ny + ((x+offX)&(NOISE.S-1))];
      const vt  = clamp(v + nz * v*(1-v)*4 * 0.9, 0, 1);

      const k = (y*W+x)*4;
      const fade = clamp(Math.min(x, W-1-x, y, H-1-y)/18, 0, 1);
      const cva  = clamp((vt-0.12)/0.72, 0, 1);
      // paksuus nakyy valoisuutena: ohut huntu harmaa, umpipilvi kirkas
      const bright = 148 + vt*92;
      img.data[k]   = Math.round(bright*0.96);
      img.data[k+1] = Math.round(bright);
      img.data[k+2] = Math.min(255, Math.round(bright*1.07));
      img.data[k+3] = Math.round(Math.pow(cva,1.05)*205*fade);
    }
  }
  ctx.putImageData(img,0,0);

  const coords = [[g.lon0,g.lat1],[g.lon1,g.lat1],[g.lon1,g.lat0],[g.lon0,g.lat0]];
  const url = cv.toDataURL();
  if(!map.getSource('clouds')){
    map.addSource('clouds',{type:'image',url,coordinates:coords});
    map.addLayer({id:'clouds',type:'raster',source:'clouds',
                  paint:{'raster-opacity':0.9,'raster-resampling':'linear'}});
    if(map.getLayer('ovation')) map.moveLayer('clouds','ovation');
    map.setLayoutProperty('clouds','visibility', state.cloudsOn?'visible':'none');
  } else {
    map.getSource('clouds').updateImage({url, coordinates:coords});
  }
  reorderAllLayers();
}

/* ── astronomia: auringon korkeus ────────────────────────────── */
function sunAltitude(date, lat, lon){
  const rad=Math.PI/180;
  const d = (date/86400000) - 10957.5;           // days since J2000
  const g = rad*(357.529 + 0.98560028*d);        // mean anomaly
  const q = 280.459 + 0.98564736*d;              // mean longitude
  const L = rad*(q + 1.915*Math.sin(g) + 0.020*Math.sin(2*g)); // ecliptic lon
  const e = rad*(23.439 - 0.00000036*d);         // obliquity
  const RA = Math.atan2(Math.cos(e)*Math.sin(L), Math.cos(L));
  const dec = Math.asin(Math.sin(e)*Math.sin(L));
  const GMST = (18.697374558 + 24.06570982441908*d) % 24;
  const LST = rad*((GMST*15 + lon) % 360);
  const H = LST - RA;                            // hour angle
  const alt = Math.asin(Math.sin(rad*lat)*Math.sin(dec)
            + Math.cos(rad*lat)*Math.cos(dec)*Math.cos(H));
  return alt/rad;                                // degrees
}

/* ── geomagneettinen leveysaste (dipoliapproksimaatio) ───────── */
function magLat(lat,lon){
  const rad=Math.PI/180;
  const latP=80.7*rad, lonP=-72.7*rad;
  const la=lat*rad, lo=lon*rad;
  return Math.asin(Math.sin(la)*Math.sin(latP)
       + Math.cos(la)*Math.cos(latP)*Math.cos(lo-lonP))/rad;
}

/* Kp:stä johdettu revontuliarvio tulevaisuuden tunneille.
   Ovaalin ekvaattorinpuoleinen raja (geomagneettinen lat) ~ Kp:
   Kp0≈66.5° … Kp9≈48°, n. -2°/Kp. Karkea arvio, merkitään arvioksi. */
function auroraEstimateFromKp(kp, mlat){
  const boundary = 66.5 - 2.05*kp;
  return clamp(45 + (mlat - boundary)*12, 0, 90);
}

function kpAt(date){
  if(!state.kpForecast.length) return Number.isFinite(state.kpNow) ? state.kpNow : 2;
  let best = state.kpForecast[0];
  for(const f of state.kpForecast){
    if(Math.abs(f.t-date) < Math.abs(best.t-date)) best=f;
  }
  return best.kp;
}

/* ── indeksin laskenta ───────────────────────────────────────── */
// Näytteistää yhden kentän (vals/valsLow/valsMid/valsHigh) state.cloudGrid:stä
// samalla interpoloinnilla (aika + bilineaarinen+smoothstep paikka) kuin
// kartan pilvitaso piirtää — käytetään KAIKKIIN pilvisyysnäyttöihin, jotta
// luku täsmää aina sen kohdalla näkyvän läpinäkyvyyden kanssa ja kaikki
// mallit toimivat samalla koodilla (ks. CLOUD_MODELS).
function sampleCloudGridField(field, lat, lon, date){
  const g = state.cloudGrid;
  if(!g || !g[field]) return null;
  if(lon<g.lon0 || lon>g.lon1 || lat<g.lat0 || lat>g.lat1) return null;
  const arr = g[field];
  const tf = cloudTimeFloat(date);
  const t0 = Math.floor(tf), t1 = Math.min(t0+1, g.times.length-1), ta = tf-t0;
  const N = g.nlat*g.nlon;
  const fr = clamp((lat-g.lat0)/g.dlat, 0, g.nlat-2.0001);
  const fc = clamp((lon-g.lon0)/g.dlon, 0, g.nlon-2.0001);
  const r0 = Math.floor(fr), rf = ss(fr-r0);
  const c0 = Math.floor(fc), cf = ss(fc-c0);
  const sampleAt = (tIdx)=>{
    const i00 = tIdx*N + r0*g.nlon + c0;
    return arr[i00]*(1-rf)*(1-cf) + arr[i00+1]*(1-rf)*cf
         + arr[i00+g.nlon]*rf*(1-cf) + arr[i00+g.nlon+1]*rf*cf;
  };
  return sampleAt(t0)*(1-ta) + sampleAt(t1)*ta;   // 0..1
}

// Raaka kokonaispilvisyys-% klikkausmerkkiin.
function cloudGridPctAt(lat,lon,date){
  const v = sampleCloudGridField('vals', lat, lon, date);
  return v==null ? null : Math.round(v*100);
}

// Alapaneelin "Pilvetön taivas" -näkyvyysindeksi (0..1) valitusta mallista.
// Jos malli tarjoaa korkeuserittelyn (hasLayers), painotetaan korkeuden
// mukaan kuten ennen (alapilvet peittävät lähes täysin, ohuen yläpilven
// läpi näkee osin). Jos ei (esim. ECMWF:n avoin data, vain kokonaispilvisyys),
// käytetään yksinkertaista 1-kokonaispilvisyys-arviota — tämä on tietoinen
// yksinkertaistus, ei virhe: kyseisen mallin avoimessa datassa ei ole
// korkeuserittelyä saatavilla (ks. MUISTIO-mallit.md).
function cloudVisibilityFactorAt(lat,lon,date){
  const g = state.cloudGrid;
  if(!g) return null;
  if(g.hasLayers){
    const low  = sampleCloudGridField('valsLow',  lat, lon, date);
    const mid  = sampleCloudGridField('valsMid',  lat, lon, date);
    const high = sampleCloudGridField('valsHigh', lat, lon, date);
    if(low==null || mid==null || high==null) return null;
    const block = clamp(0.95*low + 0.65*mid + 0.30*high, 0, 1);
    return 1-block;
  }
  const total = sampleCloudGridField('vals', lat, lon, date);
  return total==null ? null : 1-total;
}

function darknessFactor(altDeg){
  // aurinko yli -6° → liian valoisaa; alle -12° → täysi pimeys
  if(altDeg >= -6) return 0;
  if(altDeg <= -12) return 1;
  return (-6 - altDeg)/6;
}

function auroraProbAt(lat,lon,date,hourOffset){
  if(state.ovation){
    // Aina nykyhetken OVATION myös tulevaisuuden tunneilla (jäädytetty)
    const li = clamp(Math.round(lat+90),0,180);
    const lo = Math.round((lon+360)%360)%360;
    let p = state.ovation.grid[li*360+lo] || 0;
    // katso myös hieman pohjoisemmaksi: ovaali voi näkyä horisontissa
    const li2 = clamp(li+3,0,180);
    p = Math.max(p, (state.ovation.grid[li2*360+lo]||0)*0.6);
    return {p, est:false};
  }
  // Varapolku: OVATION ei vielä latautunut
  return {p: auroraEstimateFromKp(kpAt(date), magLat(lat,lon)), est:true};
}

// Pyöristää nykyhetken täyteen tuntiin (alas) ja lisää slider-offsetin
function targetTime(){
  return new Date(Math.floor(Date.now()/3600e3)*3600e3 + state.hour*3600e3);
}

// Muotoilee tuntiofsetin (voi olla 0.5 h askelin) muotoon "+1 h 30 min" / "+30 min"
function formatOffset(hr){
  const sign = hr<0 ? '−' : '+';
  const totalMin = Math.round(Math.abs(hr)*60);
  const h = Math.floor(totalMin/60), m = totalMin%60;
  if(h===0) return sign+m+' min';
  if(m===0) return sign+h+' h';
  return sign+h+' h '+m+' min';
}

function update(){
  const date = targetTime();
  const hr = state.hour;
  const timeStr = date.toLocaleString('fi-FI',{weekday:'short',hour:'2-digit',minute:'2-digit'});
  if(hr===0){ $('timeLbl').textContent='Nyt · '+timeStr; }
  else{ $('timeLbl').textContent = timeStr+' ('+formatOffset(hr)+')'; }

  // OVATION on aina jäädytetty nykyhetkeen — merkintä näkyy kun aikajana on siirretty
  $('auroraNowBadge').classList.toggle('show', hr !== 0);

  if(!state.point) return;
  const {lat,lon} = state.point;

  const a = auroraProbAt(lat,lon,date,state.hour);
  if(!Number.isFinite(a.p)) a.p = 0;
  const cf = cloudVisibilityFactorAt(lat,lon,date);
  const df = darknessFactor(sunAltitude(date,lat,lon));

  const cloudPct = cf==null ? null : Math.round(cf*100);
  const idx = Math.round((a.p/100) * (cf==null?1:cf) * df * 100);

  // gauge
  const C = 2*Math.PI*52;
  $('gaugeVal').style.strokeDashoffset = C*(1-idx/100);
  $('gaugeVal').style.stroke = idx>=50 ? 'var(--aurora)' : idx>=20 ? 'var(--cloud)' : 'var(--line)';
  $('idxNum').textContent = idx+'%';

  // chips
  $('fAurora').textContent = Math.round(a.p)+'%' + (a.est?' *':'');
  $('bAurora').style.width = a.p+'%';
  $('fCloud').textContent = cloudPct==null?'–':cloudPct+'%';
  $('bCloud').style.width = (cloudPct??0)+'%';
  $('miniCloudPct').textContent = cloudPct==null?'–':cloudPct+'%';
  if(state.markerCloudPctEl){
    const gridPct = cloudGridPctAt(lat,lon,date);
    state.markerCloudPctEl.textContent = gridPct==null?'–':gridPct+'%';
  }
  $('fDark').textContent = Math.round(df*100)+'%';
  $('bDark').style.width = df*100+'%';

  // verdict
  let t,x;
  if(df===0){ t='Liian valoisaa'; x='Aurinko on liian korkealla — revontulet eivät erotu taivaalta tähän aikaan.'; }
  else if(idx>=60){ t='Hyvät mahdollisuudet'; x='Revontuliaktiivisuus riittää ja taivas on riittävän selkeä. Kannattaa katsoa pohjoiselle taivaalle.'; }
  else if(idx>=30){ t='Kohtalaiset mahdollisuudet'; x='Näkyminen on mahdollista, mutta joko aktiivisuus tai sää rajoittaa. Seuraa tilannetta.'; }
  else if(a.p>=30 && cloudPct!=null && cloudPct<40){ t='Pilvet peittävät'; x='Aktiivisuutta olisi, mutta pilvikansi estää näkymän tästä pisteestä.'; }
  else { t='Heikot mahdollisuudet'; x='Revontuliaktiivisuus on tällä hetkellä vähäistä tällä leveysasteella.'; }
  $('verdictTitle').textContent = t;
  $('verdictText').textContent = x;

  // notes
  if(state.hour > 0 && state.ovation){
    const hhmm = state.ovation.time.toLocaleTimeString('fi-FI',
      {hour:'2-digit',minute:'2-digit',timeZone:'UTC'}) + ' UTC';
    note('Revontulet: nykyhetki (NOAA OVATION, päivitetty ' + hhmm + '). Pilvet ovat ennuste valitulle hetkelle.');
  } else if(a.est){
    note('Revontulitodennäköisyys on Kp-ennusteeseen perustuva arvio (OVATION-data ei saatavilla).');
  } else if(df===0 && sunAltitude(new Date(date.getTime()+12*3600e3),lat,lon) > -6){
    note('Kesäyö on tällä leveysasteella liian valoisa revontulille — kausi alkaa taas elo–syyskuussa.');
  } else note('');
}

function note(msg, isErr){
  const n = $('noteMsg');
  n.textContent = msg;
  n.className = 'note' + (msg?' show':'') + (isErr?' err':'');
}

/* ── pisteen valinta ─────────────────────────────────────────── */
function setPoint(lat,lon,label,markerType='pin'){
  state.point = {lat,lon};
  $('placeLbl').innerHTML =
    '<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>'
    + label + ' · ' + lat.toFixed(2) + '°N, ' + lon.toFixed(2) + '°E';

  if(state.marker){ state.marker.remove(); state.marker=null; }
  state.markerCloudPctEl = null;
  if(map){
    let el, anchor='center';
    if(markerType==='pin'){
      el = document.createElement('div');
      el.className = 'rv-cloudcard';
      el.innerHTML =
        '<div class="cc-body">'
        + '<button class="cc-close" type="button" aria-label="Sulje">✕</button>'
        + '<svg class="cc-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17h9a4 4 0 0 0 .7-7.94A5.5 5.5 0 0 0 6 8.6 3.7 3.7 0 0 0 7 17z"/></svg>'
        + '<div class="cc-pct">–</div>'
        + '<button class="cc-chevron" type="button" aria-label="Näytä tarkemmat tiedot">⌄</button>'
        + '</div>'
        + '<div class="cc-tail"></div>';
      anchor = 'bottom';
      state.markerCloudPctEl = el.querySelector('.cc-pct');
      el.querySelector('.cc-close').addEventListener('click', ev=>{
        ev.stopPropagation();
        clearPoint();
      });
      el.querySelector('.cc-chevron').addEventListener('click', ev=>{
        ev.stopPropagation();
        const min = sheetEl.classList.toggle('min');
        $('sheetToggle').setAttribute('aria-expanded', String(!min));
      });
    }else{
      el = document.createElement('div');
      el.className = 'rv-location';
      el.innerHTML = '<div class="rv-location-halo"></div><div class="rv-location-dot"></div>';
    }
    state.marker = new maplibregl.Marker({element:el, anchor}).setLngLat([lon,lat]).addTo(map);
  }

  // Ei enää erillistä pistekohtaista pilvihakua — update() lukee valitun
  // mallin hilasta (state.cloudGrid), joka on jo ladattu etukäteen.
  update();
}

function clearPoint(){
  if(state.marker){ state.marker.remove(); state.marker=null; }
  state.point = null;
  state.markerCloudPctEl = null;
  $('placeLbl').innerHTML = '';
  $('verdictTitle').textContent = 'Valitse piste kartalta';
  $('verdictText').textContent = 'Napauta karttaa tai käytä paikannusta, niin lasken revontulien näkyvyyden juuri siihen pisteeseen.';
  $('idxNum').textContent = '–';
  $('gaugeVal').style.strokeDashoffset = 2*Math.PI*52;
  $('gaugeVal').style.stroke = 'var(--line)';
  $('fAurora').textContent='–'; $('bAurora').style.width='0%';
  $('fCloud').textContent='–'; $('bCloud').style.width='0%';
  $('miniCloudPct').textContent='–';
  $('fDark').textContent='–'; $('bDark').style.width='0%';
  note('');
}

/* ── paneelin pienennys ja paikannusnapin asemointi ──────────── */
const sheetEl = $('sheet');
$('sheetToggle').addEventListener('click', ()=>{
  const min = sheetEl.classList.toggle('min');
  $('sheetToggle').setAttribute('aria-expanded', String(!min));
});
function placeLocate(){
  if(window.matchMedia('(min-width:700px)').matches){
    $('locateBtn').style.bottom = '';
    $('cloudBtn').style.bottom = '';
    $('auroraBtn').style.bottom = '';
    $('mapStyleBtn').style.bottom = '';
    $('mapStylePanel').style.bottom = '';
    return;
  }
  const sh = sheetEl.offsetHeight;
  $('locateBtn').style.bottom     = (sh + 14) + 'px';
  $('cloudBtn').style.bottom      = (sh + 14 + 58) + 'px';
  $('auroraBtn').style.bottom     = (sh + 14 + 116) + 'px';
  $('mapStyleBtn').style.bottom   = (sh + 14 + 174) + 'px';
  $('mapStylePanel').style.bottom = (sh + 14 + 174) + 'px';
}
function updateMinZoom(){
  if(!map) return;
  const mz = Math.log2(window.innerHeight / 256) + 0.3;
  map.setMinZoom(mz);
  if(map.getZoom() < mz) map.easeTo({zoom: mz});
}

new ResizeObserver(placeLocate).observe(sheetEl);
window.addEventListener('resize', ()=>{ placeLocate(); updateMinZoom(); });
placeLocate();

/* ── slider + play ───────────────────────────────────────────── */
let playTimer = null;
function stopPlay(){
  if(!playTimer) return;
  clearInterval(playTimer); playTimer=null;
  $('playBtn').textContent='▶';
  $('playBtn').setAttribute('aria-label','Käynnistä aikakaruselli');
}
$('playBtn').addEventListener('click', ()=>{
  if(playTimer){ stopPlay(); return; }
  $('playBtn').textContent='⏹';
  $('playBtn').setAttribute('aria-label','Pysäytä aikakaruselli');
  playTimer = setInterval(()=>{
    const s=$('timeSlider');
    let next = +s.value + 0.5;
    if(next > +s.max) next = +s.min;
    s.value=next; state.hour=next; update(); renderClouds();
  }, 1000);
});
$('timeSlider').addEventListener('input', e=>{
  stopPlay();
  state.hour = +e.target.value;
  update();
  renderClouds();
});

/* ── pilvimallin valinta ─────────────────────────────────────── */
function populateCloudModelSelect(){
  const sel = $('cloudModelSelect');
  sel.innerHTML = '';
  Object.values(CLOUD_MODELS).forEach(m=>{
    const opt = document.createElement('option');
    opt.value = m.id; opt.textContent = m.label;
    sel.appendChild(opt);
  });
  sel.value = state.cloudModel;
}

let cloudModelLoadSeq = 0;
async function switchCloudModel(id){
  if(!CLOUD_MODELS[id]) return;
  if(id === state.cloudModel && state.cloudGrid) return;
  state.cloudModel = id;
  saveCloudModel(id);
  state.cloudGrid = null;
  const seq = ++cloudModelLoadSeq;
  note('Haetaan ' + CLOUD_MODELS[id].label + ' -pilvidataa…');
  try{
    await loadCloudGrid();
    if(seq !== cloudModelLoadSeq) return;   // käyttäjä vaihtoi jo toiseen malliin kesken haun
    note('');
  }catch(e){
    if(seq !== cloudModelLoadSeq) return;
    console.warn(e);
    note('Pilvimallin "' + CLOUD_MODELS[id].label + '" lataus epäonnistui.', true);
  }
  if(seq === cloudModelLoadSeq && state.point) update();
}

populateCloudModelSelect();
$('cloudModelSelect').addEventListener('change', e=>{ switchCloudModel(e.target.value); });

/* ── käynnistys ──────────────────────────────────────────────── */
(async ()=>{
  const _startTime = Date.now();
  updateMapStyleBtn();
  const libOk = await loadMapLib();
  if(libOk){
    initMap();
  }else{
    note('Karttakirjaston lataus estyi (CDN ei tavoitettavissa). Näkyvyysindeksi toimii silti: paina paikannusta oikeasta reunasta.', true);
  }
  addBordersOverlay();
  const jobs = [loadOvation().catch(e=>{console.warn(e);note('Revontulidatan haku epäonnistui (NOAA ei tavoitettavissa). Yritä hetken päästä uudelleen.',true);}),
                loadKp().catch(e=>console.warn(e)),
                loadCloudGrid()
                  .catch(e=>{
                    console.warn(e);
                    const st = (String(e.message).match(/(\d{3})$/)||[])[1] || '?';
                    const age = loadCloudCache();
                    if(age){
                      const ageTxt = age<1 ? Math.round(age*60)+' min' : age.toFixed(1).replace('.',',')+' h';
                      note('Tuore pilvihaku epäonnistui ('+st+') — näytetään '+ageTxt+' vanha pilvitilanne. Haen tuoretta taustalla.', true);
                    }else{
                      note('Pilvikerroksen haku epäonnistui ('+st+') — pistekohtainen sää toimii silti. Yritän uudelleen taustalla.', true);
                    }
                    scheduleCloudRetry();
                  })];
  await Promise.all(jobs);
  const _elapsed = Date.now() - _startTime;
  if(_elapsed < 1500) await sleep(1500 - _elapsed);
  $('toast').classList.add('hide');
  $('appVersion').textContent = APP_VERSION;
  setInterval(()=>{ loadCloudGrid().then(()=>renderClouds()).catch(()=>{}); }, 60*60*1000);
  // OVATION päivittyy ~5 min välein
  setInterval(()=>{ loadOvation().catch(()=>{}); loadKp().catch(()=>{}); if(state.point) update(); }, 5*60*1000);
})();

/* ── service worker + päivitysilmoitus ───────────────────────── */
if('serviceWorker' in navigator && location.protocol==='https:'){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    const offer = w => { if(w) $('updatePill').classList.add('show'),
      $('updatePill').onclick = ()=> w.postMessage('SKIP_WAITING'); };
    if(reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener('updatefound', ()=>{
      const w = reg.installing;
      w && w.addEventListener('statechange', ()=>{
        if(w.state==='installed' && navigator.serviceWorker.controller) offer(reg.waiting || w);
      });
    });
    setInterval(()=>reg.update().catch(()=>{}), 30*60*1000);
  }).catch(()=>{});
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(!reloaded){ reloaded = true; location.reload(); }
  });
}
</script>
