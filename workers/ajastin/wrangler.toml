# AuroraAwesome-ajastin (Cloudflare Worker), ks. OHJE-ajastin.md.
# Julkaisu: .github/workflows/deploy-ajastin.yml (vain mainista).
# GH_DISPATCH_TOKEN on Workerin SALAISUUS (Cloudflaren hallintapaneeli) -
# ei tähän tiedostoon. Julkaisu ei poista salaisuuksia. PALAUTE_AVAIN
# viedään GitHubin salaisuudesta julkaisussa (deploy-ajastin.yml).
name = "auroraawesome-ajastin"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Julkinen osoite (2026-10-24) vain hälytysten palautteelle: /palaute
# (https://auroraawesome-ajastin.<tilin-aliverkkotunnus>.workers.dev/palaute).
# Muut polut 404. Ks. OHJE-ntfy.md.
workers_dev = true

[triggers]
crons = ["*/5 * * * *"]

[vars]
GH_REPO = "pekkasuni-dot/revontulivahti"
GH_REF = "main"

# Lokit näkyvät hallintapaneelissa (Workers > auroraawesome-ajastin > Logs).
[observability]
enabled = true
