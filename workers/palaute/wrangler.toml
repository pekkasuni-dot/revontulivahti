# Aurora-palaute (Cloudflare Worker, 2026-11-07, päätös 36): revontulihälytysten palautteen vastaanotto
# (ilmoituksen painikkeet Näkyi / Ei näkynyt / Pilvessä ja sovelluksen varakysely).
# EI JULKAISTU. Julkaisu käsin luvalla (päätös 37): ks. workers/palaute/README.md.
# Salaisuus PALAUTE_AVAIN_FCM (sama arvo kuin GitHubin salaisuus, jolla hälytysajo allekirjoittaa hälytykset):
#   npx wrangler secret put PALAUTE_AVAIN_FCM   (ei tähän tiedostoon, ei repoon)
name = "aurora-palaute"
main = "src/index.js"
compatibility_date = "2024-09-23"
workers_dev = true

# Tallennus: Workers KV (ilmainen taso 1 000 kirjoitusta / vrk riittää Dev-testiin).
# Luo: npx wrangler kv namespace create PALAUTE -> kopioi id tähän (id ei ole salaisuus).
[[kv_namespaces]]
binding = "PALAUTE"
id = "TAYTA_KV_ID"

[observability]
enabled = true
